[package]
name = "trusted-server-framework-nextjs"
description = "Next.js support, which rewrites origin URLs in a page's data and in React Server Components payloads, as a framework module."
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
version = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
error-stack = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
trusted-server-core = { workspace = true }
uuid = { workspace = true }
validator = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
trusted-server-core = { workspace = true, features = ["test-utils"] }

# The visible owner of this vendor crate, the way Prebid.js requires a named
# maintainer of every adapter. Vercel has not yet adopted this crate, so the
# Trusted Server maintainers own it until a vendor owner steps up.
[package.metadata.maintainers]
owner = "Trusted Server maintainers"
status = "seeking vendor owner"
