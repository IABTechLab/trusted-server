[package]
name = "trusted-server-shared-aws"
description = "What Amazon Web Services offers every crate that wants it: the s3_sigv4 origin signer, which signs a read from S3 with AWS Signature Version 4."
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
version = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
chrono = { workspace = true }
error-stack = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
http = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
trusted-server-core = { workspace = true }
url = { workspace = true }

[dev-dependencies]
edgezero-core = { workspace = true, features = ["test-utils"] }
futures = { workspace = true }
trusted-server-core = { workspace = true, features = ["test-utils"] }

# The visible owner of this vendor crate, the way Prebid.js requires a named
# maintainer of every adapter. Amazon has not yet adopted this crate, so the
# Trusted Server maintainers own it until a vendor owner steps up.
[package.metadata.maintainers]
owner = "Trusted Server maintainers"
status = "seeking vendor owner"
