[package]
name = "trusted-server-shared-51degrees"
description = "What the 51Degrees modules share: the vendor's table, the one call to the cloud service and its held answer, the evidence the call sends and the cache the answer is held in."
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
version = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true

[features]
# Exposes test_services to the other 51Degrees crates' tests, with a loading
# cache in their services so what one call holds is what the next one reads.
test-utils = ["dep:trusted-server-loading-cache-51degrees", "trusted-server-core/test-utils"]

[dependencies]
trusted-server-core = { workspace = true }
trusted-server-loading-cache-51degrees = { workspace = true, optional = true }
async-trait = { workspace = true }
bytes = { workspace = true }
edgezero-core = { workspace = true }
error-stack = { workspace = true }
http = { workspace = true }
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }
validator = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
trusted-server-core = { workspace = true, features = ["test-utils"] }
trusted-server-loading-cache-51degrees = { workspace = true }

# The visible owner of this vendor crate, the way Prebid.js requires a named
# maintainer of every adapter.
[package.metadata.maintainers]
owner = "51Degrees"
status = "vendor owned"
