[package]
name = "trusted-server-device-fastly"
description = "Fastly host device provider exposing opt-in TLS and HTTP/2 signals."
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
version = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
trusted-server-core = { workspace = true }
async-trait = { workspace = true }
fastly = { workspace = true }

# The visible owner of this vendor crate, the way Prebid.js requires a named
# maintainer of every adapter. Fastly has not yet adopted this crate, so the
# Trusted Server maintainers own it until a vendor owner steps up.
[package.metadata.maintainers]
owner = "Trusted Server maintainers"
status = "seeking vendor owner"
