[package]
name = "trusted-server-release"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true
rust-version = "1.98"

[dependencies]
base64.workspace = true
clap.workspace = true
derive_more.workspace = true
error-stack.workspace = true
flate2.workspace = true
hex.workspace = true
hmac.workspace = true
libc.workspace = true
jsonschema = { version = "=0.58.6", default-features = false }
object = { version = "=0.37.3", default-features = false, features = [
    "elf",
    "macho",
    "read_core",
    "std",
] }
reqwest = { workspace = true, features = ["hickory-dns"] }
serde.workspace = true
serde_json.workspace = true
sha1-checked = { version = "=0.10.0", default-features = false }
sha2.workspace = true
tempfile.workspace = true
tar = { version = "=0.4.46", default-features = false }
time = { workspace = true, features = ["parsing"] }
tokio.workspace = true
toml.workspace = true
wasmparser = { version = "=0.247.0", default-features = false, features = [
    "features",
    "simd",
    "std",
    "validate",
] }

[dev-dependencies]
rcgen.workspace = true
rustls.workspace = true

[lints]
workspace = true
