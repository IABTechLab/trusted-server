[package]
name = "trusted-server-provenance-encypher"
description = "Encypher text provenance: signs the article on each page a [[serve]] entry names it for, embedding invisible markers and a C2PA manifest link, and passes every page it cannot sign through unchanged."
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
version = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
bytes = { workspace = true }
ed25519-dalek = { workspace = true }
edgezero-core = { workspace = true }
error-stack = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
trusted-server-core = { workspace = true }
url = { workspace = true }
validator = { workspace = true }
wasmi = { workspace = true }
web-time = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
trusted-server-core = { workspace = true, features = ["test-utils"] }
wat = { workspace = true }

# The visible owner of this vendor crate.
[package.metadata.maintainers]
owner = "Encypher"
status = "vendor owned"
