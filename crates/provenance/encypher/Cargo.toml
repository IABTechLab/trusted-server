[package]
name = "trusted-server-provenance-encypher"
description = "Encypher provenance: signs the article on each page a [[serve]] entry names it for, with invisible markers and a C2PA manifest link, and the exact bytes of its media, delivering every item it cannot sign as it was and reporting it unsigned."
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
version = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
ed25519-dalek = { workspace = true }
edgezero-core = { workspace = true }
ego-tree = { workspace = true }
error-stack = { workspace = true }
futures = { workspace = true }
html5ever = { workspace = true }
http = { workspace = true }
log = { workspace = true }
roxmltree = { workspace = true }
scraper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
trusted-server-core = { workspace = true }
url = { workspace = true }
validator = { workspace = true }
wasmi = { workspace = true }
web-time = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
trusted-server-core = { workspace = true, features = ["test-utils"] }
wat = { workspace = true }

# The visible owner of this vendor crate.
[package.metadata.maintainers]
owner = "Encypher"
status = "vendor owned"
