[package]
name = "trusted-server-testing-testlight"
description = "The Testlight example integration, which rewrites an auction request body and proxies it to a test endpoint."
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
version = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
edgezero-core = { workspace = true }
error-stack = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
trusted-server-core = { workspace = true }
validator = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
trusted-server-core = { workspace = true, features = ["test-utils"] }

# An example the project keeps for testing an auction integration end to end,
# so the Trusted Server maintainers own it.
[package.metadata.maintainers]
owner = "Trusted Server maintainers"
