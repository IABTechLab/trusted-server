[package]
name = "trusted-server-cmp-inmobi"
description = "InMobi Choice as a consent management platform module: the prompt's tag, with the IAB TCF and GPP stubs ahead of it, written into a publisher's pages."
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
version = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
error-stack = { workspace = true }
serde = { workspace = true }
trusted-server-core = { workspace = true }
url = { workspace = true }
validator = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
trusted-server-core = { workspace = true, features = ["test-utils"] }

# The visible owner of this vendor crate, the way Prebid.js requires a named
# maintainer of every adapter. InMobi has not yet adopted this crate, so the
# Trusted Server maintainers own it until a vendor owner steps up.
[package.metadata.maintainers]
owner = "Trusted Server maintainers"
status = "seeking vendor owner"
