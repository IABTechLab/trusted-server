[package]
name = "trusted-server-cli"
description = "Operator CLI (`ts`) for Trusted Server."
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
version = { workspace = true }

[[bin]]
name = "ts"
path = "src/main.rs"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chromiumoxide = { workspace = true }
clap = { workspace = true }
derive_more = { workspace = true }
edgezero-cli = { workspace = true }
edgezero-core = { workspace = true }
futures = { workspace = true }
glob = { workspace = true }
http = { workspace = true }
log = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
# `ts dev audit headers` fetches origin responses over HTTP. Scoped to host
# targets (not the repo-default wasm32-wasip1) alongside the other native-only
# deps so unsupported targets do not try to build reqwest's TLS stack.
#
# Deliberately NOT `workspace = true`: the workspace feature list enables
# `rustls-tls`, which resolves to reqwest's `__rustls-ring` and turns on
# `rustls/ring` on top of the `rustls/aws-lc-rs` that `ts dev proxy` uses on
# macOS. With both providers compiled in, rustls cannot determine a
# process-level `CryptoProvider` and every `ts dev proxy` TLS config build
# panics. The `-no-provider` variant bakes in no provider, so it never adds
# `ring` and cannot collide with the proxy's aws-lc-rs.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls-webpki-roots-no-provider",
] }
# The `-no-provider` reqwest variant expects the process-level rustls
# `CryptoProvider` to be installed by the caller. `ts dev proxy` only exists on
# macOS, so on other hosts nothing else pulls a rustls provider; this pins
# aws-lc-rs (rustls's default) on every host target so `ts dev audit` can
# install it before its first HTTPS fetch. On macOS it deduplicates with the
# proxy's aws-lc-rs — still exactly one provider, so no ambiguity.
rustls = { workspace = true }
scraper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true }
trusted-server-core = { workspace = true }
url = { workspace = true }
which = { workspace = true }

# `ts dev proxy` is macOS-only — CA trust via the login keychain, Safari
# automation via `networksetup`, and a native TLS / networking stack. Scoping
# these dependencies to macOS keeps unsupported targets (notably the
# repo-default `wasm32-wasip1` from `.cargo/config.toml`) from trying to build
# `tokio`, `ring`, or `aws-lc-sys` for a target they do not support; on those
# targets the `dev` subcommand is simply absent.
[target.'cfg(target_os = "macos")'.dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
directories = { workspace = true }
error-stack = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["http1", "server", "client"] }
hyper-util = { workspace = true, features = ["tokio"] }
rcgen = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
# Secure (O_EXCL, random-named, 0700) temp dirs for throwaway browser profiles.
tempfile = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal"] }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
x509-parser = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
temp-env = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
