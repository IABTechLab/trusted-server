[package]
name = "trusted-server-cli"
description = "Operator CLI (`ts`) for Trusted Server."
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
version = { workspace = true }

[[bin]]
name = "ts"
path = "src/main.rs"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chromiumoxide = { workspace = true }
clap = { workspace = true }
derive_more = { workspace = true }
error-stack = { workspace = true }
edgezero-cli = { workspace = true }
edgezero-core = { workspace = true }
futures = { workspace = true }
glob = { workspace = true }
http = { workspace = true }
log = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
rpassword = { workspace = true }
# Also in the macOS/Linux block for the dev proxy; needed on every host so the probe can install
# the process-level crypto provider its `-no-provider` reqwest build expects.
rustls = { workspace = true }
# Declared directly rather than inherited from the workspace, to control the rustls
# crypto provider. `reqwest`'s plain `rustls-tls` forces `ring`, and this crate already
# links `aws-lc-rs` through `reqwest` 0.13 (via `chromiumoxide` and `edgezero-cli`).
# Compiling both providers makes rustls's process-level default ambiguous, and it then
# panics on first use — which broke the dev-proxy tests. The `-no-provider` variant uses
# whichever provider is already present instead of adding a second.
#
# `gzip` so the probe's Accept-Encoding axis compares decoded bytes: reqwest transparently
# decodes a gzip response, which is what "differ only by content coding" must be tested
# against.
reqwest = { version = "0.12", default-features = false, features = [
    "gzip",
    "json",
    "rustls-tls-webpki-roots-no-provider",
] }
scraper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true }
trusted-server-core = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
which = { workspace = true }

# `ts dev lint domains` and `ts dev install-hooks` drive all git access through
# gitoxide (no `git` subprocess). Cross-host: the linter runs in CI on every
# target. Version pins live in the root `[workspace.dependencies]`; the feature
# set is crate-local.
gix = { workspace = true, features = [
    "blob-diff",
    "index",
    "revision",
    "sha1",
    # Fixture repos in the unit tests construct trees via gix-only APIs.
    "tree-editor",
] }

# `ts dev sandbox-probe` needs a real HTTP/1.1 client with keep-alive. These
# are shared with the macOS/Linux proxy but scoped to every non-wasm host, so
# the probe builds on any host target. The exclusion still keeps
# `tokio`/`ring` off the repo-default `wasm32-wasip1` target.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
bytes = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["http1", "client"] }
hyper-util = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["net", "rt-multi-thread"] }

# The shared proxy engine supports macOS and Linux only.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
directories = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["http1", "server", "client"] }
hyper-util = { workspace = true, features = ["tokio"] }
rcgen = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
# Secure (O_EXCL, random-named, 0700) temp dirs for throwaway browser profiles.
tempfile = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal"] }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }

# Exact NSS subject identity checks; already used transitively by rcgen.
[target.'cfg(target_os = "linux")'.dependencies]
x509-parser = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
x509-parser = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
assert_cmd = { workspace = true }
edgezero-adapter-axum = { workspace = true, features = ["axum"] }
flate2 = { workspace = true }
predicates = { workspace = true }
temp-env = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
trusted-server-adapter-axum = { path = "../trusted-server-adapter-axum" }
