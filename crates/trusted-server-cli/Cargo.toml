[package]
name = "trusted-server-cli"
description = "Operator CLI (`ts`) for Trusted Server."
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
version = { workspace = true }

[[bin]]
name = "ts"
path = "src/main.rs"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chromiumoxide = { workspace = true }
clap = { workspace = true }
derive_more = { workspace = true }
edgezero-cli = { workspace = true }
edgezero-core = { workspace = true }
futures = { workspace = true }
glob = { workspace = true }
http = { workspace = true }
log = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
# Also in the macOS block for the dev proxy; needed on every host so the probe can install
# the process-level crypto provider its `-no-provider` reqwest build expects.
rustls = { workspace = true }
# Declared directly rather than inherited from the workspace, to control the rustls
# crypto provider. `reqwest`'s plain `rustls-tls` forces `ring`, and this crate already
# links `aws-lc-rs` through `reqwest` 0.13 (via `chromiumoxide` and `edgezero-cli`).
# Compiling both providers makes rustls's process-level default ambiguous, and it then
# panics on first use — which broke the dev-proxy tests. The `-no-provider` variant uses
# whichever provider is already present instead of adding a second.
#
# `gzip` so the probe's Accept-Encoding axis compares decoded bytes: reqwest transparently
# decodes a gzip response, which is what "differ only by content coding" must be tested
# against.
reqwest = { version = "0.12", default-features = false, features = [
    "gzip",
    "json",
    "rustls-tls-webpki-roots-no-provider",
] }
scraper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true }
trusted-server-core = { workspace = true }
url = { workspace = true }
which = { workspace = true }

# `ts dev proxy` is macOS-only — CA trust via the login keychain, Safari
# automation via `networksetup`, and a native TLS / networking stack. Scoping
# these dependencies to macOS keeps unsupported targets (notably the
# repo-default `wasm32-wasip1` from `.cargo/config.toml`) from trying to build
# `tokio`, `ring`, or `aws-lc-sys` for a target they do not support; on those
# targets the `dev` subcommand is simply absent.
[target.'cfg(target_os = "macos")'.dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
directories = { workspace = true }
error-stack = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["http1", "server", "client"] }
hyper-util = { workspace = true, features = ["tokio"] }
rcgen = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
# Secure (O_EXCL, random-named, 0700) temp dirs for throwaway browser profiles.
tempfile = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal"] }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
x509-parser = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
flate2 = { workspace = true }
temp-env = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
