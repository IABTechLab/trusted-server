[package]
name = "trusted-server-cli"
description = "Operator CLI (`ts`) for Trusted Server."
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
version = { workspace = true }

[[bin]]
name = "ts"
path = "src/main.rs"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chromiumoxide = { workspace = true }
clap = { workspace = true }
derive_more = { workspace = true }
edgezero-cli = { workspace = true }
edgezero-core = { workspace = true }
futures = { workspace = true }
glob = { workspace = true }
http = { workspace = true }
log = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
scraper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true }
trusted-server-core = { workspace = true }
url = { workspace = true }
which = { workspace = true }

# The shared proxy engine supports macOS and Linux only.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
directories = { workspace = true }
error-stack = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["http1", "server", "client"] }
hyper-util = { workspace = true, features = ["tokio"] }
rcgen = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
# Secure (O_EXCL, random-named, 0700) temp dirs for throwaway browser profiles.
tempfile = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal"] }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }

# Exact NSS subject identity checks; already used transitively by rcgen.
[target.'cfg(target_os = "linux")'.dependencies]
x509-parser = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
x509-parser = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
temp-env = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
