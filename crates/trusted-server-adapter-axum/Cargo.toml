[package]
name = "trusted-server-adapter-axum"
description = "Axum entry point for Trusted Server — native dev server."
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
version = { workspace = true }

[lints]
workspace = true

[lib]
name = "trusted_server_adapter_axum"
path = "src/lib.rs"

[[bin]]
name = "trusted-server-axum"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
edgezero-adapter-axum = { workspace = true, features = ["axum"] }
edgezero-core = { workspace = true }
error-stack = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true }
simple_logger = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
trusted-server-ad-server-iabtl = { workspace = true }
trusted-server-ad-tag-google = { workspace = true }
trusted-server-ads-txt-iabtl = { workspace = true }
trusted-server-middleware-51degrees = { workspace = true }
trusted-server-analytics-tinybird = { workspace = true }
trusted-server-auction-aps = { workspace = true }
trusted-server-auction-prebid = { workspace = true }
trusted-server-auction-prebid-server = { workspace = true }
trusted-server-auction-protocol-openrtb = { workspace = true }
trusted-server-audience-permutive = { workspace = true }
trusted-server-bot-protection-datadome = { workspace = true }
trusted-server-cmp-didomi = { workspace = true }
trusted-server-cmp-inmobi = { workspace = true }
trusted-server-cmp-osano = { workspace = true }
trusted-server-cmp-sourcepoint = { workspace = true }
trusted-server-core = { workspace = true }
trusted-server-framework-nextjs = { workspace = true }
trusted-server-headers-geo = { workspace = true }
trusted-server-identity-lockr = { workspace = true }
trusted-server-permission-signal-gpc = { workspace = true }
trusted-server-permission-signal-gpp = { workspace = true }
trusted-server-permission-signal-mtm = { workspace = true }
trusted-server-permission-signal-tcf = { workspace = true }
trusted-server-permission-signal-us-privacy = { workspace = true }
trusted-server-tag-google-tag = { workspace = true }
trusted-server-tag-google-tag-manager = { workspace = true }
trusted-server-testing-testlight = { workspace = true }

[dev-dependencies]
trusted-server-core = { workspace = true, features = ["test-utils"] }
axum = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
temp-env = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tower = { workspace = true, features = ["util"] }
# Test fixture only. It proves the integration seam from outside core and must
# never reach a production build, so it stays a dev-dependency.
trusted-server-testing-iabtl = { path = "../testing/iabtl" }
