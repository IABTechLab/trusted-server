spin_manifest_version = 2

[application]
name = "trusted-server-aps-runner-proxy-integration"
version = "0.1.0"

[variables]
v_trusted_x5fserver_x5fconfig = { required = true }
aps_runner_proxy_test_endpoint = { required = true }

[[trigger.http]]
route = "/..."
component = "trusted-server"

[component.trusted-server]
source = "__APS_RUNNER_PROXY_WASM__"
allowed_outbound_hosts = ["http://127.0.0.1:*"]
key_value_stores = ["default"]

[component.trusted-server.variables]
v_trusted_x5fserver_x5fconfig = "{{ v_trusted_x5fserver_x5fconfig }}"
aps_runner_proxy_test_endpoint = "{{ aps_runner_proxy_test_endpoint }}"
