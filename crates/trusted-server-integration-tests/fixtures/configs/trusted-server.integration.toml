[[handlers]]
path = "^/_ts/admin"
username = "admin"
password = "integration_admin_password"

[publisher]
domain = "localhost"
cookie_domain = "localhost"
origin_url = "http://127.0.0.1:8888"
proxy_secret = "integration_proxy_secret"

# Viceroy does not resolve geolocation for the loopback test client, so the
# request carries no country and the top of the permissions.yaml rules tree
# supplies the baseline the permission model uses.
[geo]
# Viceroy maps the loopback client to US/CA (see viceroy-template.toml), so
# the platform geo provider resolves a real place and the EC lifecycle
# scenarios exercise the US state opt-out machinery, the same posture the
# retired default_country setting pointed at, now through the real lookup.
provider = "platform"

[ec]
provider = "hmac"
ec_store = "ec_identity_store"
pull_sync_concurrency = 3

[ec.hmac]
passphrase = "integration_ec_passphrase"

[[ec.partners]]
name = "Integration Test Partner"
source_domain = "inttest.example.com"
bidstream_enabled = true
api_token = "integration_partner_token_alpha"

[[ec.partners]]
name = "Integration Test Partner 2"
source_domain = "inttest2.example.com"
bidstream_enabled = true
api_token = "integration_partner_token_bravo"

[request_signing]
enabled = false
config_store_id = "app_config"
secret_store_id = "secrets"

# Only the GPT diagnostics overlay runs, which is what the browser tests need.
# Every other integration used to sit here as an `enabled = false` stub. A
# settings table its type's `provider` does not name now refuses startup, so
# the stubs are gone instead of sitting unselected.
[integration]
provider = ["gpt_diagnostics"]

[proxy]
certificate_check = false

[auction]
enabled = false
timeout_ms = 2000
allowed_context_keys = []

[demand]
provider = ["pbs_main", "aps_main"]

[demand.pbs_main]
implementation = "prebid_server"
endpoint = "https://prebid.example.com/openrtb2/auction"
routing = "explicit"
debug = false
test_mode = false
consent_forwarding = "both"

[demand.pbs_main.notifications]
suppress_all = false
suppress_seats = []

[demand.aps_main]
implementation = "aps"
endpoint = "https://aps.example.com/e/pb/bid"
routing = "all_eligible"
account_id = "example-aps-account-id"
debug = false
allow_script_creatives = false

[auction.bidders.example-bidder]
provider = "pbs_main"

[debug]
ja4_endpoint_enabled = false
