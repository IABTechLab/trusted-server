# Contract template for the protected real-GAM page. Values are deliberately
# fictional placeholders; actual GAM, APS, Prebid, PUC, URL, and authorization
# configuration exists only in the protected `aps-real-gam` environment.
schema_version = 1
browser_contract_global = "__tsRealGamTestNetwork"
expected_external_puc_release = "1.17.2"

[environment]
page_url = "__PROTECTED_HTTPS_PAGE_URL__"
authorization_header = "__PROTECTED_AUTHORIZATION_VALUE__"
expected_release_id = "__DEPLOYED_TSJS_RELEASE_ID__"

[page_contract]
version = 1
case_root_attribute = "data-ts-real-gam-case"
terminal_state_attribute = "data-ts-real-gam-state"
terminal_state_value = "terminal"
slot_attribute = "data-ts-real-gam-slot"
puc_owner_attribute = "data-ts-real-gam-owner" # value is the case id
owned_frame_attribute = "data-ts-real-gam-owned-frame" # value is the case id
screenshot_secret_mask_attribute = "data-ts-real-gam-secret"

case_ids = [
  "ssat-aps-puc",
  "trusted-server-prebid-aps-puc",
  "page-bids-aps-puc",
  "direct-aps",
  "direct-adm",
  "direct-cache",
  "attributable-empty-gam-fallback",
  "sra-aps-puc",
  "refresh-aps-puc",
  "spa-navigation",
  "gpt-handoff",
  "hydrated-dom-replacement",
  "collapsed-shell-resize",
  "wrong-id",
  "wrong-source",
  "invalid-descriptor",
  "no-outer-claim",
  "no-owner-registration",
  "no-document-ack",
  "aps-runner-failure",
]

[evidence]
capture_response_bodies = false
capture_request_headers = false
capture_response_headers = false
capture_post_data = false
capture_native_trace = false
capture_har = false
capture_video = false
sanitized_trace_directory = "real-gam-evidence"
