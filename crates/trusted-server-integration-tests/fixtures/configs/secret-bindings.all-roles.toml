# Fictional compiler/renderer fixture only. Never send traffic to these endpoints.
[[handlers]]
path = "^/_ts/admin"
username = "admin"

[publisher]
domain = "publisher.example.com"
cookie_domain = "publisher.example.com"
origin_url = "https://origin.example.com"

[ec]
[[ec.partners]]
name = "Fictional partner"
source_domain = "partner.example.com"
api_token_enabled = true
pull_sync_enabled = true
pull_sync_url = "https://sync.example.com/pull"

[trusted_client_ip]
ip_header = "x-fictional-client-ip"
auth_header = "x-fictional-client-auth"

[tinybird]
enabled = true
api_host = "api.tinybird.example.com"
auction_dataset = "auction_events_raw"

[integrations.datadome]
enabled = true
enable_protection = true
protection_api_origin = "https://protection.example.com"

[integrations.datadome.protection_test_bypass]
enabled = true

[[proxy.asset_routes]]
prefix = "/assets/"
origin_url = "https://bucket.example.com"

[proxy.asset_routes.auth]
type = "s3_sigv4"
region = "us-east-1"
session_token_enabled = true
