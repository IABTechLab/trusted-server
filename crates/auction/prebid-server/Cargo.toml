[package]
name = "trusted-server-auction-prebid-server"
description = "Prebid Server as a demand implementation: its request extensions, bidder parameter overrides, transport headers and response reader."
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
version = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
error-stack = { workspace = true }
http = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
trusted-server-core = { workspace = true }
url = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
edgezero-core = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
validator = { workspace = true }
web-time = { workspace = true }
trusted-server-core = { workspace = true, features = ["test-utils"] }

# The visible owner of this vendor crate, the way Prebid.js requires a named
# maintainer of every adapter. Prebid.org has not yet adopted this crate, so the
# Trusted Server maintainers own it until a vendor owner steps up.
[package.metadata.maintainers]
owner = "Trusted Server maintainers"
status = "seeking vendor owner"
