<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // Fix the parent-origin base before creative markup can install a <base>
      // or overwrite the stamp. This pins legacy relative click resolution and
      // the endpoint fallback. It does not authenticate the higher-priority
      // runtime script origin: earlier creative script can shadow currentScript
      // and choose the endpoint origin despite this immutable stamp.
      Object.defineProperty(window, '__tsCreativeOrigin', {
        value: '%TRUSTED_ORIGIN%',
        writable: false,
        configurable: false,
        enumerable: false,
      });
    </script>
    <style>
      %NORMALIZE_CSS%
    </style>
  </head>
  <body style="margin: 0; padding: 0; overflow: hidden">
    %CREATIVE_HTML%
  </body>
</html>
