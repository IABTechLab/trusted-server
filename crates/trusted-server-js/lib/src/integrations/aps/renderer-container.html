<!doctype html>
<meta charset="utf-8" />
<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'none'; base-uri 'none'; object-src 'none'; script-src 'unsafe-inline' https:; connect-src https:; frame-src data: __TS_APS_CREATIVE_ORIGIN__; img-src https: data:; media-src https: blob:; style-src 'unsafe-inline' https:; font-src https: data:"
/>
<meta name="referrer" content="no-referrer" />
<style>
  html,
  body,
  iframe {
    border: 0;
    height: 100%;
    margin: 0;
    padding: 0;
    width: 100%;
  }
</style>
<body>
  <script>
    (function () {
      'use strict';
      var match = /^#tsaps=([A-Za-z0-9_-]{22,128})$/.exec(location.hash);
      var outerNonce = match && match[1];
      var innerNonce = __TS_APS_INNER_NONCE__;
      var creativeOrigin = __TS_APS_CREATIVE_ORIGIN_JSON__;
      if (!outerNonce) return;
      function keys(value, expectedKeys) {
        if (!value || typeof value !== 'object' || Array.isArray(value)) return false;
        var actual = Object.keys(value).sort();
        return (
          actual.length === expectedKeys.length &&
          actual.every(function (key, index) {
            return key === expectedKeys[index];
          })
        );
      }
      var frame = document.createElement('iframe');
      frame.title = 'APS creative renderer';
      frame.setAttribute('sandbox', __TS_APS_RENDERER_SANDBOX__);
      frame.src = __TS_APS_RENDERER_URL__;
      function receive(event) {
        if (
          event.source !== frame.contentWindow ||
          !keys(event.data, ['message', 'nonce']) ||
          event.data.message !== 'trusted-server/aps/document-ready' ||
          event.data.nonce !== innerNonce
        )
          return;
        removeEventListener('message', receive);
        var channel = new MessageChannel();
        frame.contentWindow.postMessage(
          {
            message: 'trusted-server/aps/channel-init',
            nonce: innerNonce,
            creativeOrigin: creativeOrigin,
          },
          '*',
          [channel.port1]
        );
        parent.postMessage(
          { message: 'trusted-server/aps/container-ready', nonce: outerNonce },
          '*',
          [channel.port2]
        );
      }
      addEventListener('message', receive);
      document.body.appendChild(frame);
    })();
  </script>
</body>
