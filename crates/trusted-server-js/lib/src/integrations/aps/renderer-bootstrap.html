<!doctype html>
<meta charset="utf-8" />
<meta name="referrer" content="no-referrer" />
<script>
  (function () {
    'use strict';
    var match = /^#tsaps=([A-Za-z0-9_-]{22,128})$/.exec(location.hash);
    var expected = match && match[1];
    if (!expected) return;
    function keys(value, expectedKeys) {
      if (!value || typeof value !== 'object' || Array.isArray(value)) return false;
      var actual = Object.keys(value).sort();
      return (
        actual.length === expectedKeys.length &&
        actual.every(function (key, index) {
          return key === expectedKeys[index];
        })
      );
    }
    function receive(event) {
      if (event.source !== parent) return;
      var message = event.data;
      if (
        !keys(message, ['message', 'nonce', 'rendererUrl']) ||
        message.message !== 'trusted-server/aps/bootstrap-navigate' ||
        message.nonce !== expected ||
        typeof message.rendererUrl !== 'string' ||
        !message.rendererUrl.startsWith('data:text/html;charset=utf-8,')
      )
        return;
      try {
        var url = new URL(message.rendererUrl);
        if (url.protocol !== 'data:' || url.hash !== '#tsaps=' + expected) return;
        removeEventListener('message', receive);
        location.replace(url.href);
      } catch (_error) {}
    }
    addEventListener('message', receive);
    parent.postMessage({ message: 'trusted-server/aps/bootstrap-ready', nonce: expected }, '*');
  })();
</script>
