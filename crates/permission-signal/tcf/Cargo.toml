[package]
name = "trusted-server-permission-signal-tcf"
description = "The IAB TCF v2 string decoder and the record as a permission signal module, with the purpose mapping."
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
version = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
derive_more = { workspace = true }
error-stack = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
trusted-server-core = { workspace = true }
trusted-server-permission-signal-gpp = { workspace = true }
web-time = { workspace = true }

[dev-dependencies]
http = { workspace = true }
serde_json = { workspace = true }
# The tests read the repository's sample policy, which only core's
# test-utils feature compiles.
trusted-server-core = { workspace = true, features = ["test-utils"] }

# The visible owner of this crate, the way Prebid.js requires a named
# maintainer of every adapter. The scheme's own body is the natural owner, and
# until one adopts the crate the Trusted Server maintainers hold it.
[package.metadata.maintainers]
owner = "Trusted Server maintainers"
status = "seeking vendor owner"
