spin_manifest_version = 2

[application]
name = "trusted-server-adapter-spin"
version = "0.1.0"

# EdgeZero's Spin config stores are KV-backed and read keys verbatim. Request-signing
# metadata such as `current-kid`, `active-kids`, and public JWK entries therefore
# belongs directly in the component's `default` key-value store.
#
# Secret stores read Spin component variables. The adapter encodes the store and
# key into a collision-resistant variable name. Every generated name starts with
# "v_"; lowercase ASCII letters and digits are kept as-is, while uppercase letters
# and punctuation are encoded as "_xhh" lowercase hex bytes. For example:
#   store "signing_keys", key "ts-2026-05-25"
#   -> v_signing_x5fkeys_v_ts_x2d2026_x2d05_x2d25
#
# Operators enabling request_signing must declare one encoded secret variable for
# each private signing key. Public signing metadata remains in the KV store.
# Declarations compiled from trusted-server.example.toml by the shared renderer.
# Supply values through a protected provider. `secret = true` is not encryption.
# Regenerate with scripts/generate-integration-viceroy-configs.sh --local-manifests.
# BEGIN GENERATED APP SECRET VARIABLES
[variables.v_trusted_x5fserver_x5fsecrets_v_ts1_x5fjuuqz3tbywbbzruyd2bvt56qmxuiokdflb4ii2dfmjvw7ypyjwbq]
required = true
secret = true

[variables.v_trusted_x5fserver_x5fsecrets_v_ts1_x5fkw4dni7h367mab3ywnml5mqvumkwivjjxzduonjz7mw3mihm42da]
required = true
secret = true

[variables.v_trusted_x5fserver_x5fsecrets_v_ts1_x5fmu4d7mg5sfuleogirpka2zbh2b33lsocgyl6wcovawmjs4nfmi6a]
required = true
secret = true
# END GENERATED APP SECRET VARIABLES

[[trigger.http]]
route = "/..."
component = "trusted-server"

[component.trusted-server]
source = "../../target/wasm32-wasip1/release/trusted_server_adapter_spin.wasm"
# Wildcard outbound is required because the first-party proxy and ad-serving
# paths reach arbitrary, operator-configured publisher and ad origins that are
# not known at build time. Both https and http are allowed because some upstream
# origins are still served over plaintext http. Follow-up: scope this to the
# configured origins once they can be enumerated from settings.
allowed_outbound_hosts = ["https://*:*", "http://*:*"]
key_value_stores = ["default"]

[component.trusted-server.variables]
# BEGIN GENERATED APP SECRET COMPONENT
v_trusted_x5fserver_x5fsecrets_v_ts1_x5fjuuqz3tbywbbzruyd2bvt56qmxuiokdflb4ii2dfmjvw7ypyjwbq = "{{ v_trusted_x5fserver_x5fsecrets_v_ts1_x5fjuuqz3tbywbbzruyd2bvt56qmxuiokdflb4ii2dfmjvw7ypyjwbq }}"
v_trusted_x5fserver_x5fsecrets_v_ts1_x5fkw4dni7h367mab3ywnml5mqvumkwivjjxzduonjz7mw3mihm42da = "{{ v_trusted_x5fserver_x5fsecrets_v_ts1_x5fkw4dni7h367mab3ywnml5mqvumkwivjjxzduonjz7mw3mihm42da }}"
v_trusted_x5fserver_x5fsecrets_v_ts1_x5fmu4d7mg5sfuleogirpka2zbh2b33lsocgyl6wcovawmjs4nfmi6a = "{{ v_trusted_x5fserver_x5fsecrets_v_ts1_x5fmu4d7mg5sfuleogirpka2zbh2b33lsocgyl6wcovawmjs4nfmi6a }}"
# END GENERATED APP SECRET COMPONENT

[component.trusted-server.build]
command = "cargo build --target wasm32-wasip1 --release -p trusted-server-adapter-spin --features spin"
watch = ["src/**/*.rs", "Cargo.toml", "../../edgezero.toml", "spin.toml"]
