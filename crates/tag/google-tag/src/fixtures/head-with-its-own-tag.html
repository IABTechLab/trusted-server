<!--
  An invented publisher's page head that already loads the Google tag this
  integration is configured to write, so the duplicate case is tested on a
  page rather than only on a string.

  The id here has to match `TEST_TAG_ID` in the tests. Everything in it is
  made up.
-->
<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Example Publisher</title>
    <link rel="canonical" href="https://www.example.com/" />
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());

      gtag('config', 'G-XXXXXXXXXX');
    </script>
  </head>
  <body></body>
</html>
