[package]
name = "trusted-server-tag-google-tag"
description = "Google's tag, Tag Manager container and AdSense loader written on the page from the settings, as a tag module."
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
version = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
error-stack = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
trusted-server-core = { workspace = true }
trusted-server-tag-google-tag-manager = { workspace = true }
url = { workspace = true }
validator = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
serde_json = { workspace = true }
trusted-server-core = { workspace = true, features = ["test-utils"] }

# The visible owner of this vendor crate, the way Prebid.js requires a named
# maintainer of every adapter. Google has not yet adopted this crate, so the
# Trusted Server maintainers own it until a vendor owner steps up.
[package.metadata.maintainers]
owner = "Trusted Server maintainers"
status = "seeking vendor owner"
