[package]
name = "trusted-server-headers-geo"
description = "Writes the reader's location as the x-geo-* response headers, from the location the request already resolved, as a serve middleware."
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
version = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
error-stack = { workspace = true }
http = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
trusted-server-core = { workspace = true }
validator = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
edgezero-core = { workspace = true }
futures = { workspace = true }
trusted-server-core = { workspace = true, features = ["test-utils"] }

# The visible owner of this crate. The x-geo-* headers are Trusted Server's
# own, so the Trusted Server maintainers own it.
[package.metadata.maintainers]
owner = "Trusted Server maintainers"
status = "project owned"
