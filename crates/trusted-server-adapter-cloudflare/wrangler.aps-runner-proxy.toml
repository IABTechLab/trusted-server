name = "trusted-server-aps-runner-proxy-integration"
main = "build/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat", "cache_option_enabled"]

[[kv_namespaces]]
binding = "TRUSTED_SERVER_KV"
id = "aps-runner-proxy-local-kv"

[[services]]
binding = "APS_RUNNER_PROXY_FIXTURE"
service = "aps-runner-proxy-fixture"

[vars]
# Replaced in a temporary copy by the integration-test controller.
TRUSTED_SERVER_CONFIG = "{}"

# Fictitious integration-only values for the secret references in the shared
# app-config fixture. Production values are provisioned with Worker secrets.
integration_admin_password = "integration-admin-password-32-bytes-ok"
integration_proxy_secret = "integration-test-proxy-secret-32-bytes-ok"
integration_ec_passphrase = "integration-test-ec-secret-padded-32"
integration_partner_token_alpha = "integration-test-token-alpha-32-bytes-ok"
integration_partner_token_bravo = "integration-test-token-bravo-32-bytes-ok"
