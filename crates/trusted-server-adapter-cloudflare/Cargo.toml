[package]
name = "trusted-server-adapter-cloudflare"
description = "Cloudflare Workers entry point for Trusted Server."
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
version = { workspace = true }

[lints]
workspace = true

[lib]
name = "trusted_server_adapter_cloudflare"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Opt-in local runtime fixture and its diagnostic console sink.
test-utils = ["trusted-server-core/test-utils"]
# Keep for explicit `cargo check --features cloudflare --target wasm32-unknown-unknown`
cloudflare = ["edgezero-adapter-cloudflare/cloudflare", "dep:worker"]

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
derive_more = { workspace = true }
edgezero-adapter-cloudflare = { workspace = true }
edgezero-core = { workspace = true }
error-stack = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }
serde_json = { workspace = true }
trusted-server-core = { workspace = true }
worker = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
edgezero-adapter-cloudflare = { workspace = true, features = ["cloudflare"] }
js-sys = { workspace = true }
worker = { workspace = true }

[dev-dependencies]
trusted-server-core = { workspace = true, features = ["test-utils"] }
base64 = { workspace = true }
edgezero-core = { workspace = true }
toml = { workspace = true }
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[[example]]
name = "deadline-runtime"
path = "tests/runtime/deadline.rs"
crate-type = ["cdylib"]
required-features = ["cloudflare"]
