name = "trusted-server"
main = "build/index.js"
# Pins the Workers runtime API surface. Bump to a recent date and re-run
# integration tests to pick up free runtime fixes. Keep in sync with the
# minimum date supported by the worker crate version in Cargo.toml.
compatibility_date = "2024-09-23"
# `cache_option_enabled` is on by default from compatibility date 2024-11-11.
# The pinned date predates it, so the flag must be set explicitly: without it
# the runtime throws when a subrequest sets the `cache` field on `RequestInit`.
# The outbound HTTP client sets `CacheMode::NoStore` for cache-bypass requests
# (auction-eligible publisher navigations), so this is a hard requirement.
compatibility_flags = ["nodejs_compat", "cache_option_enabled"]

[build]
command = "bash build.sh"

[[kv_namespaces]]
binding = "TRUSTED_SERVER_KV"
# Run `wrangler kv:namespace create TRUSTED_SERVER_KV` and paste the returned
# id here before `wrangler deploy` or `wrangler dev --remote`.
# `wrangler dev --local` (Miniflare default) tolerates this placeholder.
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# The config store. `ts config push --adapter cloudflare` writes the settings
# blob into this namespace and the Worker reads it when it builds its
# application. The binding is the store's platform name, which
# EDGEZERO__STORES__CONFIG__TRUSTED_SERVER_CONFIG__NAME changes, and
# `ts provision --adapter cloudflare` creates the namespace and writes its id
# here.
[[kv_namespaces]]
binding = "trusted_server_config"
id = "REPLACE_WITH_YOUR_CONFIG_KV_NAMESPACE_ID"

# App-config secret values are provisioned as Worker secrets with
# `wrangler secret put <key-name>`. The pushed blob contains only those key
# names; never add secret values to this file.
