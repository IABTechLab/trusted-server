[package]
name = "trusted-server-adapter-fastly"
description = "Fastly Compute entry point for Trusted Server."
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
version = { workspace = true }

[lints]
workspace = true

[features]
# Opt-in reusable sandbox lifecycle. Off by default, and `fastly.toml`'s build
# command does not pass it, so production builds keep the single-request entry
# point. Enabling the feature alone does not enable reuse: the bounds still
# come from the runtime environment (see `sandbox::resolve_mode`).
reusable-sandbox = []

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
derive_more = { workspace = true }
edgezero-adapter-fastly = { workspace = true, features = ["fastly"] }
edgezero-core = { workspace = true }
error-stack = { workspace = true }
esi = { workspace = true }
fastly = { workspace = true }
fern = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
log-fastly = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
trusted-server-core = { workspace = true }
trusted-server-permission-signal-gpc = { workspace = true }
trusted-server-permission-signal-gpp = { workspace = true }
trusted-server-permission-signal-mtm = { workspace = true }
trusted-server-permission-signal-tcf = { workspace = true }
trusted-server-permission-signal-us-privacy = { workspace = true }
trusted-server-device-fastly = { workspace = true }
trusted-server-geo-fastly = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }

[dev-dependencies]
bytes = { workspace = true }
edgezero-core = { workspace = true, features = ["test-utils"] }
toml = { workspace = true }
trusted-server-core = { workspace = true, features = ["test-utils"] }
# Test fixture only. It proves the integration seam on this adapter from
# outside core and must never be a regular dependency.
trusted-server-integration-seam-probe = { path = "../testing/seam-probe" }
