[package]
name = "trusted-server-auction-protocol-openrtb"
description = "OpenRTB 2.6 as an auction protocol: the request builder, the response reader and the hook trait a demand implementation that speaks it fills in, with the plain implementation for an exchange that needs no code of its own."
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
version = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
edgezero-core = { workspace = true }
error-stack = { workspace = true }
http = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
trusted-server-core = { workspace = true }
trusted-server-openrtb = { workspace = true }

[features]
# Exposes the test helpers, so a demand implementation's own tests read the
# request the driver builds for it.
test-utils = ["trusted-server-core/test-utils"]

[dev-dependencies]
futures = { workspace = true }
trusted-server-core = { workspace = true, features = ["test-utils"] }
url = { workspace = true }

# The visible owner of this crate, the way Prebid.js requires a named
# maintainer of every adapter. The protocol and its plain implementation are
# the project's own, so the Trusted Server maintainers own them.
[package.metadata.maintainers]
owner = "Trusted Server maintainers"
status = "project owned"
