[package]
name = "trusted-server-asset-cache-51degrees"
description = "An asset cache module that holds the files the publisher's origin and the asset routes send, as each origin sent them, in two loading caches."
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
version = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
trusted-server-core = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
derive_more = { workspace = true }
edgezero-core = { workspace = true }
error-stack = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
log = { workspace = true }
sha2 = { workspace = true }
web-time = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true }
trusted-server-core = { workspace = true, features = ["test-utils"] }

# The visible owner of this vendor crate, the way Prebid.js requires a named
# maintainer of every adapter.
[package.metadata.maintainers]
owner = "51Degrees"
status = "vendor owned"
