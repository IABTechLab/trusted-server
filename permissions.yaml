# Country and region permission rules for Trusted Server's permission model.
#
# This file is compiled into the build, not loaded at runtime. Editing it and
# rebuilding is how a deployer changes the default policy, so the rules stay
# visible and reviewable in version control.
#
# There are three parts:
#   groups   named permission baselines, defined once and referenced by rules
#   rules    map a country (FR) or country/state (US/CA) to a group, with optional
#            explicit per-permission overrides
#   signals  how each session signal (TCF, US-style opt-out) maps onto Data Uses,
#            so no signal-to-permission policy lives in the code
#
# Rule keys use the codes a geo provider returns, matched case-insensitively:
#   country        ISO 3166-1 alpha-2 (for example FR, US, GB)
#   country/state  adds the ISO 3166-2 subdivision code, with no country prefix
#                  (for example US/CA for California)
# The Fastly and other geo providers both emit these codes directly.
#
# A request whose country/region matches no rule, or whose country the geo
# provider cannot resolve, uses the deployer's default set in trusted-server.toml
# as [geo] default_country. A default is required, so there is always a default
# permission set; startup fails when none is configured.
#
# A permission flag is one of:
#   granted          set without any signal (for example strictly necessary)
#   requires_signal  set only when a signal grants it (opt-in)
#   denied           never set, even when a signal grants it
#
# Permission names are the IAB Privacy Taxonomy Data Uses, mapped from the IAB
# TCF Europe purposes. Every group below lists every Data Use so its policy is
# fully explicit. Two purposes have no Data Use yet: TCF purpose 1 (device
# storage) uses a proposed `necessary.operations.storage` key, and TCF purpose
# 11 (limited-data content selection) keeps its TCF identifier
# `select-basic-content`. Both are flagged for an upstream taxonomy addition.
#
# Trusted Server is not the policy authority. Where no informed policy decision
# has been made for a Data Use it is `denied`, so a demo or test deployment has
# a complete, conservative default. A deployer edits this file to set its own
# policy per jurisdiction.
#
# Named baselines. Each group lists every Data Use and its flag, so a group's
# meaning is explicit. (A `default: <flag>` shorthand is also accepted for any
# Data Use a group omits.)
groups:
  # European Union: opt-in; the modeled ad-tech purposes require a signal.
  gdpr-eu:
    necessary.operations.storage: requires_signal
    advertising_marketing.first_party.contextual: requires_signal
    advertising_marketing.profiling: requires_signal
    advertising_marketing.first_party.targeted: requires_signal
    advertising_marketing.personalize.profiling: requires_signal
    advertising_marketing.personalize.content: requires_signal
    analytics.ad_reporting.measure_ad_performance: requires_signal
    analytics.ad_reporting.content_performance: requires_signal
    analytics.ad_reporting.market_research: requires_signal
    necessary.operations.improve: requires_signal
    select-basic-content: requires_signal
    # Remaining Privacy Taxonomy Data Uses: no policy decision made yet,
    # so denied by default (see the file header).
    advertising_marketing: denied
    advertising_marketing.communications: denied
    advertising_marketing.communications.email: denied
    advertising_marketing.communications.sms: denied
    advertising_marketing.first_party: denied
    advertising_marketing.frequency_capping: denied
