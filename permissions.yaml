# The place rules for Trusted Server's permission model, and the jurisdiction
# each place falls under.
#
# The vocabulary is not ours. The permissions are the IAB Tech Lab Privacy
# Taxonomy Data Uses, with the IAB TCF Europe purposes mapped onto them where
# no Data Use exists yet. That is deliberate, because a permission a provider
# declares should be stated in the industry's own terms rather than in a
# vocabulary this project invented, so a reader can check it against the
# taxonomy rather than against us.
#
# This file is compiled into the build, not loaded at runtime. Editing it and
# rebuilding is how a deployer changes the default policy, so the rules stay
# visible and reviewable in version control.
#
# There are three parts:
#   groups   named permission baselines, defined once and referenced by rules
#   rules    a tree of places, from the whole world down to a single region,
#            each naming the group and the jurisdiction that apply there
#   signals  how each session signal (TCF, US-style opt-out) maps onto Data Uses,
#            so no signal-to-permission policy lives in the code
#
# The rules tree
# --------------
# `rules` is one tree. Its top stands for the whole world, countries sit under
# it, and a country's regions sit under that country:
#
#   rules:
#     group: gdpr-eu
#     jurisdiction: gdpr       # inherited by every country not overriding it,
#                              # and the answer when no country resolves
#     GB: gdpr-uk              # inherits gdpr
#     US:
#       group: us-notice
#       jurisdiction: non-regulated
#       CA:
#         group: us-opt-out
#         jurisdiction: us-state
#       NY: us-notice          # inherits non-regulated
#
# Every node names a `group`. Writing a plain group name (`GB: gdpr-uk`) is the
# short form of a node with that group, no jurisdiction of its own, and nothing
# below it. To give a node regions, or a jurisdiction, write it as a block with
# a `group:` line and the rest beside it. A block with no `group:` line is an
# error, because then the node says nothing.
#
# Any node may also name a `jurisdiction`, which is the consent handling that
# applies there. A node that names none inherits the nearest one above it. The
# top of the tree must name both `group` and `jurisdiction`, so inheritance
# always ends somewhere, and the top node is also the answer for a visitor whose
# place the geo provider could not resolve at all.
#
# A `jurisdiction` is one of:
#   gdpr           the EU, EEA and UK regime
#   us-state       a US state with a comprehensive privacy law. It carries no
#                  state code, because the region naming it is the state, so
#                  only a region may name it, never a country or the top
#   non-regulated  a place with no matching regulation
#   unknown        declining to name one
#
# Place codes are the codes a geo provider returns, matched without regard to
# upper or lower case:
#   country  ISO 3166-1 alpha-2 (for example FR, US, GB)
#   region   ISO 3166-2 subdivision, with no country prefix (for example CA for
#            California, written under US)
# The Fastly geo provider emits these codes directly, and any other provider
# must do the same. Those codes are at most three letters long, so a place code
# can never be confused with the reserved words `group`, `jurisdiction` and
# `permissions`. Where the tree puts a code also tells the two DE codes apart,
# since ISO 3166-1 DE is Germany at the country level and ISO 3166-2 DE is
# Delaware under US.
#
# The most specific place wins, and whatever a node does not answer falls back
# to the node above it. A visitor is matched on their region if it is listed,
# otherwise on their country, otherwise on the top of the tree. So the top node
# is also the answer for a country nobody has written a rule for.
#
# A geo provider that reports an outright lookup failure is the exception. It
# resolves every permission to the requires-signal floor, and its jurisdiction
# to unknown, rather than to the top of the tree, though no geo provider shipped
# today reports one.
# A permission flag is one of:
#   granted          set without any signal (for example strictly necessary)
#   requires_signal  set only when a signal grants it (opt-in)
#   denied           never set, even when a signal grants it
#
# Permission names are the IAB Privacy Taxonomy Data Uses, mapped from the IAB
# TCF Europe purposes. Every group below lists every Data Use so its policy is
# fully explicit. Two purposes have no Data Use yet: TCF purpose 1 (device
# storage) uses a proposed `necessary.operations.storage` key, and TCF purpose
# 11 (limited-data content selection) keeps its TCF identifier
# `select-basic-content`. Both are flagged for an upstream taxonomy addition.
#
# Trusted Server is not the policy authority. Where no informed policy decision
# has been made for a Data Use it is `denied`, so a demo or test deployment has
# a complete, conservative default. A deployer edits this file to set its own
# policy per jurisdiction.
#
# Named baselines. Each group lists every Data Use and its flag, so a group's
# meaning is explicit. (A `default: <flag>` shorthand is also accepted for any
# Data Use a group omits.)
groups:
  # European Union, where the model is opt-in, so the modeled ad-tech purposes
  # require a signal.
  gdpr-eu:
    necessary.operations.storage: requires_signal
    advertising_marketing.first_party.contextual: requires_signal
    advertising_marketing.profiling: requires_signal
    advertising_marketing.first_party.targeted: requires_signal
    advertising_marketing.personalize.profiling: requires_signal
    advertising_marketing.personalize.content: requires_signal
    analytics.ad_reporting.measure_ad_performance: requires_signal
    analytics.ad_reporting.content_performance: requires_signal
    analytics.ad_reporting.market_research: requires_signal
    necessary.operations.improve: requires_signal
    select-basic-content: requires_signal
    # Remaining Privacy Taxonomy Data Uses: no policy decision made yet,
    # so denied by default (see the file header).
    advertising_marketing: denied
