[package]
name = "permissions-inspector-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
trusted-server-core = { path = "../../../crates/trusted-server-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1

# Deliberately its own workspace, like the integration-tests crate, so the
# main workspace's wasm32-wasip1 default target does not apply to it.
[workspace]
