[package]
name = "permissions-inspector-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
trusted-server-core = { path = "../../../crates/trusted-server-core" }
# The inspector runs the same permission signal providers an adapter ships,
# in the same default order, so the page answers as a deployment would.
trusted-server-permission-signal-gpc = { path = "../../../crates/permission-signal/gpc" }
trusted-server-permission-signal-gpp = { path = "../../../crates/permission-signal/gpp" }
trusted-server-permission-signal-tcf = { path = "../../../crates/permission-signal/tcf" }
trusted-server-permission-signal-us-privacy = { path = "../../../crates/permission-signal/us-privacy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1

# Deliberately its own workspace, like the integration-tests crate, so the
# main workspace's wasm32-wasip1 default target does not apply to it.
[workspace]
