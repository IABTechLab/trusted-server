version = 1
reviewed = true

[template]
source = "trusted-server.example.toml"
placeholder_paths = ["publisher.cookie_domain", "publisher.domain", "publisher.origin_url"]
integration_ids = ["adserver_mock", "aps", "datadome", "didomi", "google_tag_manager", "gpt", "gpt_diagnostics", "lockr", "nextjs", "osano", "permutive", "prebid", "sourcepoint", "testlight"]
profile_ids = ["aps", "prebid-server", "standard"]
consumer_literals = ["ec_passphrase", "handler_password", "publisher_proxy_secret"]
expected_failure_diagnostic = "unmodified template rejects publisher.cookie_domain, publisher.domain, publisher.origin_url"

