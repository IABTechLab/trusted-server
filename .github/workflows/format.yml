name: "Run Format"

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  format-rust:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Retrieve Rust version
        id: rust-version
        run: echo "rust-version=$(grep '^rust ' .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Retrieve Node.js version
        id: node-version
        run: echo "node-version=$(grep '^nodejs ' .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Set up rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: ${{ steps.rust-version.outputs.rust-version }}
          target: wasm32-wasip1,wasm32-unknown-unknown
          components: "clippy, rustfmt"
          cache-shared-key: cargo-${{ runner.os }}

      - name: Use Node.js for Rust build scripts
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ steps.node-version.outputs.node-version }}

      - name: Run cargo fmt
        uses: actions-rust-lang/rustfmt@v1.1.2

      - name: Run cargo clippy (Fastly — wasm32-wasip1)
        run: cargo clippy-fastly

      - name: Run cargo clippy (Axum — native)
        run: cargo clippy-axum

      - name: Run cargo clippy (Cloudflare — native)
        run: cargo clippy-cloudflare

      - name: Run cargo clippy (Cloudflare — wasm32-unknown-unknown)
        run: cargo clippy-cloudflare-wasm

      - name: Run cargo clippy (Spin — native)
        run: cargo clippy-spin-native

      - name: Run cargo clippy (Spin — wasm32-wasip1)
        run: cargo clippy-spin-wasm

      - name: Run host-target CLI clippy
        run: cargo clippy --package trusted-server-cli --target x86_64-unknown-linux-gnu --all-targets --all-features -- -D warnings

      # The codegen crate is a workspace member but is not a default member and
      # is not covered by any adapter-scoped alias, so lint it explicitly.
      - name: Run host-target OpenRTB codegen clippy
        run: cargo clippy --package trusted-server-openrtb-codegen --target x86_64-unknown-linux-gnu --all-targets -- -D warnings

  format-typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/trusted-server-js/lib

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Retrieve Node.js version
        id: node-version
        working-directory: .
        run: echo "node-version=$(grep '^nodejs ' .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ steps.node-version.outputs.node-version }}
          cache: "npm"
          cache-dependency-path: crates/trusted-server-js/lib/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier (check)
        run: npm run format

  format-docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Retrieve Node.js version
        id: node-version
        working-directory: .
        run: echo "node-version=$(grep '^nodejs ' .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ steps.node-version.outputs.node-version }}
          cache: "npm"
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier (check)
        run: npm run format

      - name: Build with VitePress (fails on dead links)
        run: npm run build

  documentation-parity:
    name: Documentation parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Read tool versions
        id: tool-versions
        run: ./scripts/read-tool-versions.sh

      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: ${{ steps.tool-versions.outputs.rust }}
          components: "clippy, rustfmt"
          cache-workspaces: "tools/docs-parity -> tools/docs-parity/target"

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ steps.tool-versions.outputs.node }}
          cache: "npm"
          cache-dependency-path: crates/trusted-server-js/lib/package-lock.json

      - name: Install JSDoc lint dependencies
        working-directory: crates/trusted-server-js/lib
        run: npm ci

      - name: Check documentation parity tool formatting
        run: cargo fmt --manifest-path tools/docs-parity/Cargo.toml -- --check

      - name: Lint documentation parity tool
        run: cargo clippy --manifest-path tools/docs-parity/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test documentation parity tool
        run: cargo test --manifest-path tools/docs-parity/Cargo.toml

      - name: Run every deterministic documentation check
        run: cargo run --manifest-path tools/docs-parity/Cargo.toml -- check --all

      - name: Require generated documentation to be current
        run: cargo run --manifest-path tools/docs-parity/Cargo.toml -- generate --check
