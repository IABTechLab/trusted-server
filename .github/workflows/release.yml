name: Binary attestations

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/release/phase1*'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.tool-versions'
      - '.cargo/**'
      - 'edgezero.toml'
      - 'crates/**'

permissions:
  contents: read

concurrency:
  group: binary-attestations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            package: trusted-server-adapter-fastly
            target: wasm32-wasip1
            asset: trusted-server-fastly.wasm
          - os: ubuntu-24.04
            package: trusted-server-cli
            target: x86_64-unknown-linux-gnu
            asset: ts-x86_64-unknown-linux-gnu
          - os: macos-15
            package: trusted-server-cli
            target: aarch64-apple-darwin
            asset: ts-aarch64-apple-darwin
          - os: macos-15-intel
            package: trusted-server-cli
            target: x86_64-apple-darwin
            asset: ts-x86_64-apple-darwin
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Read pinned toolchains
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          echo "node=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
          echo "rust=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ steps.tools.outputs.node }}
      - name: Install the pinned Rust toolchain without build caches
        env:
          RUST_VERSION: ${{ steps.tools.outputs.rust }}
          BUILD_TARGET: ${{ matrix.target }}
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --target "$BUILD_TARGET"
      - name: Test local release checks
        run: node --test scripts/release/phase1.test.mjs
      - name: Build and generate the build inventory in a clean environment
        shell: bash
        env:
          BUILD_PACKAGE: ${{ matrix.package }}
          BUILD_TARGET: ${{ matrix.target }}
          RELEASE_ASSET: ${{ matrix.asset }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          env -i PATH="$PATH" HOME="$HOME" \
            CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" \
            RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" \
            TMPDIR="${TMPDIR:-/tmp}" RUNNER_TEMP="$RUNNER_TEMP" \
            SOURCE_COMMIT="$SOURCE_COMMIT" \
            bash scripts/release/phase1-build.sh "$BUILD_PACKAGE" "$BUILD_TARGET" "$RELEASE_ASSET"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-${{ matrix.asset }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Attest ${{ matrix.asset }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        asset:
          - trusted-server-fastly.wasm
          - ts-x86_64-unknown-linux-gnu
          - ts-aarch64-apple-darwin
          - ts-x86_64-apple-darwin
    steps:
      # No checkout, build scripts or executables from the artifacts run here.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-${{ matrix.asset }}
          path: release-assets
      - name: Attest SLSA build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/${{ matrix.asset }}
      - name: Attest the binary's SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/${{ matrix.asset }}
          sbom-path: release-assets/${{ matrix.asset }}.cdx.json

  release:
    name: Publish the immutable release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Draft, upload, publish and verify immutability
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Treat all API errors except an explicit 404 as fatal.
          if gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > existing.json 2> lookup-error.txt; then
            echo '::error::A release already exists for this tag; refusing to overwrite it.'
            exit 1
          elif ! grep -q 'HTTP 404' lookup-error.txt; then
            cat lookup-error.txt >&2
            exit 1
          fi
          cd release-assets
          expected=(trusted-server-fastly.wasm ts-x86_64-unknown-linux-gnu ts-aarch64-apple-darwin ts-x86_64-apple-darwin)
          files=()
          for asset in "${expected[@]}"; do
            test -s "$asset"
            test -s "$asset.cdx.json"
            files+=("$asset" "$asset.cdx.json")
          done
          test "$(find . -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 8
          sha256sum "${files[@]}" > SHA256SUMS
          gh release create "$RELEASE_TAG" --repo "$GH_REPO" --draft --verify-tag \
            --title "$RELEASE_TAG" --notes 'Attested release binaries. Verify provenance, SBOM and immutable asset membership before use; see the release verification guide at this tag.'
          gh release upload "$RELEASE_TAG" "${files[@]}" SHA256SUMS --repo "$GH_REPO"
          gh release edit "$RELEASE_TAG" --draft=false --repo "$GH_REPO"
          immutable=$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq '.immutable')
          if [ "$immutable" != true ]; then
            echo '::error::Published release is NOT immutable. Maintainer action required; do not use these assets.'
            exit 1
          fi
          gh release verify "$RELEASE_TAG" --repo "$GH_REPO"
          for asset in "${files[@]}" SHA256SUMS; do
            gh release verify-asset "$RELEASE_TAG" "$asset" --repo "$GH_REPO"
          done
