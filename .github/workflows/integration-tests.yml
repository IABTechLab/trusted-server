name: 'Integration Tests'

permissions:
  contents: read

on:
  # Intentionally PR-only plus manual dispatch. Direct pushes to `main` are
  # expected to arrive through PR merges, which already run this workflow.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  ORIGIN_PORT: 8888
  ARTIFACTS_DIR: /tmp/integration-test-artifacts
  WASM_ARTIFACT_PATH: /tmp/integration-test-artifacts/wasm/trusted-server-adapter-fastly.wasm
  AXUM_ARTIFACT_PATH: /tmp/integration-test-artifacts/axum/trusted-server-axum
  DOCKER_ARTIFACT_PATH: /tmp/integration-test-artifacts/docker/test-images.tar
  CF_BUILD_ARTIFACT_PATH: /tmp/integration-test-artifacts/cloudflare/build

jobs:
  prepare-artifacts:
    name: prepare integration artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read Node.js build version
        id: build-node-version
        run: echo "version=$(awk '$1 == "nodejs" {print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js for embedded and browser bundles
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.build-node-version.outputs.version }}

      - name: Set up shared integration build environment
        uses: ./.github/actions/setup-integration-test-env
        with:
          origin-port: ${{ env.ORIGIN_PORT }}
          install-viceroy: 'false'
          build-cloudflare: 'true'

      - name: Generate integration Viceroy configs
        run: ./scripts/generate-integration-viceroy-configs.sh
        env:
          INTEGRATION_ORIGIN_PORT: ${{ env.ORIGIN_PORT }}

      - name: Prepare publisher registration artifacts
        run: |
          mkdir -p "$(dirname "$WASM_ARTIFACT_PATH")"
          cp target/wasm32-wasip1/release/trusted-server-adapter-fastly.wasm "$WASM_ARTIFACT_PATH"
          (
            cd crates/trusted-server-js/lib
            node build-all.mjs --out-dir "$ARTIFACTS_DIR/publisher-registration-dist"
            node build-prebid-external.mjs \
              --modules-json '{"bidder":["rubiconBidAdapter"],"userId":["sharedIdSystem"],"analytics":[]}' \
              --out "$ARTIFACTS_DIR/publisher-registration-prebid"
          )
          ./scripts/test-publisher-registration.sh --stamp-wasm \
            --wasm "$WASM_ARTIFACT_PATH" --dist "$ARTIFACTS_DIR/publisher-registration-dist" \
            --bundle-mode build-rs
          ./scripts/test-publisher-registration.sh --prepare \
            --wasm "$WASM_ARTIFACT_PATH" --dist "$ARTIFACTS_DIR/publisher-registration-dist" \
            --bundle-mode build-rs --prebid "$ARTIFACTS_DIR/publisher-registration-prebid" \
            --artifacts "$ARTIFACTS_DIR/publisher-registration" \
            --out "$ARTIFACTS_DIR/publisher-registration-prep"

      - name: Export production HTML for CWV contracts
        env:
          TSJS_PREBUILT_DIR: ${{ env.ARTIFACTS_DIR }}/publisher-registration-dist
        run: |
          HOST_TARGET="$(rustc -vV | awk '/^host:/ {print $2}')"
          cargo run -p trusted-server-integration-tests --example cwv_html --target "$HOST_TARGET" -- "$ARTIFACTS_DIR/cwv/unreserved" unreserved
          cargo run -p trusted-server-integration-tests --example cwv_html --target "$HOST_TARGET" -- "$ARTIFACTS_DIR/cwv/reserved" reserved

      - name: Package integration test artifacts
        run: |
          mkdir -p "$(dirname "$WASM_ARTIFACT_PATH")" "$(dirname "$AXUM_ARTIFACT_PATH")" "$(dirname "$DOCKER_ARTIFACT_PATH")" "$CF_BUILD_ARTIFACT_PATH"
          cp target/wasm32-wasip1/release/trusted-server-adapter-fastly.wasm "$WASM_ARTIFACT_PATH"
          cp target/debug/trusted-server-axum "$AXUM_ARTIFACT_PATH"
          cp -r crates/trusted-server-adapter-cloudflare/build/. "$CF_BUILD_ARTIFACT_PATH/"
          PUBLISHER_IMAGE="$(node -e 'const image = require(process.argv[1]); console.log((Array.isArray(image) ? image[0] : image).RepoTags[0])' "$ARTIFACTS_DIR/publisher-registration-prep/image.json")"
          docker save \
            --output "$DOCKER_ARTIFACT_PATH" \
            test-wordpress:latest test-nextjs:latest "$PUBLISHER_IMAGE"

      - name: Upload integration test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-artifacts
          path: ${{ env.ARTIFACTS_DIR }}
          retention-days: 1

  integration-tests:
    name: integration tests
    needs: prepare-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up integration test runtime
        id: shared-setup
        uses: ./.github/actions/setup-integration-test-env
        with:
          origin-port: ${{ env.ORIGIN_PORT }}
          install-viceroy: 'true'
          build-wasm: 'false'
          build-axum: 'false'
          build-test-images: 'false'

      - name: Download integration test artifacts
        uses: actions/download-artifact@v4
        with:
          name: integration-test-artifacts
          path: ${{ env.ARTIFACTS_DIR }}

      - name: Make binaries executable
        run: chmod +x "$AXUM_ARTIFACT_PATH"

      - name: Restore Cloudflare Workers bundle
        run: |
          mkdir -p crates/trusted-server-adapter-cloudflare/build
          cp -r "$CF_BUILD_ARTIFACT_PATH/." crates/trusted-server-adapter-cloudflare/build/

      - name: Load integration test Docker images
        run: docker load --input "$DOCKER_ARTIFACT_PATH"

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Run integration tests
        run: >-
          cargo test
          --manifest-path crates/trusted-server-integration-tests/Cargo.toml
          --target x86_64-unknown-linux-gnu
          -- --include-ignored
          --skip test_wordpress_fastly --skip test_nextjs_fastly
          --test-threads=1
        env:
          WASM_BINARY_PATH: ${{ env.WASM_ARTIFACT_PATH }}
          AXUM_BINARY_PATH: ${{ env.AXUM_ARTIFACT_PATH }}
          CLOUDFLARE_WRANGLER_DIR: ${{ github.workspace }}/crates/trusted-server-adapter-cloudflare
          INTEGRATION_ORIGIN_PORT: ${{ env.ORIGIN_PORT }}
          VICEROY_CONFIG_PATH: ${{ env.ARTIFACTS_DIR }}/configs/viceroy.toml
          RUST_LOG: info

  integration-tests-fastly-ec:
    name: integration tests (Fastly EC lifecycle)
    needs: prepare-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up integration test runtime
        id: shared-setup
        uses: ./.github/actions/setup-integration-test-env
        with:
          origin-port: ${{ env.ORIGIN_PORT }}
          install-viceroy: 'true'
          build-wasm: 'false'
          build-test-images: 'false'

      - name: Download integration test artifacts
        uses: actions/download-artifact@v4
        with:
          name: integration-test-artifacts
          path: ${{ env.ARTIFACTS_DIR }}

      # Focused container-free EC lifecycle coverage using the same post-cutover
      # Viceroy config as the full integration matrix.
      - name: Run Fastly EC lifecycle tests
        run: >-
          cargo test
          --manifest-path crates/trusted-server-integration-tests/Cargo.toml
          --target x86_64-unknown-linux-gnu
          test_ec_lifecycle_fastly
          -- --include-ignored --test-threads=1
        env:
          WASM_BINARY_PATH: ${{ env.WASM_ARTIFACT_PATH }}
          INTEGRATION_ORIGIN_PORT: ${{ env.ORIGIN_PORT }}
          VICEROY_CONFIG_PATH: ${{ env.ARTIFACTS_DIR }}/configs/viceroy.toml
          RUST_LOG: info

  browser-tests:
    name: browser integration tests
    needs: prepare-artifacts
    # Pinned rather than floating on ubuntu-latest, which moved to 26.04 and
    # fails at `playwright install` with "Playwright does not support chromium
    # on ubuntu26.04-x64". Every browser test then fails in milliseconds because
    # no browser was installed. Other jobs are unaffected: the Axum job obtains
    # Chrome through browser-actions/setup-chrome, which works on 26.04. Unpin
    # once the pinned Playwright version supports the newer image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up browser test runtime
        id: shared-setup
        uses: ./.github/actions/setup-integration-test-env
        with:
          origin-port: ${{ env.ORIGIN_PORT }}
          install-viceroy: 'true'
          build-wasm: 'false'
          build-test-images: 'false'

      - name: Download integration test artifacts
        uses: actions/download-artifact@v4
        with:
          name: integration-test-artifacts
          path: ${{ env.ARTIFACTS_DIR }}

      - name: Load integration test Docker images
        run: docker load --input "$DOCKER_ARTIFACT_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.shared-setup.outputs.node-version }}
          cache: npm
          cache-dependency-path: |
            crates/trusted-server-integration-tests/browser/package-lock.json
            crates/trusted-server-js/lib/package-lock.json

      - name: Build TSJS browser fixtures
        working-directory: crates/trusted-server-js/lib
        run: |
          npm ci
          npm run build
          npm run build:prebid-external -- --modules-json '{"bidder":["rubiconBidAdapter"]}'

      - name: Install Playwright
        working-directory: crates/trusted-server-integration-tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test CWV metrics and production HTML contracts
        working-directory: crates/trusted-server-integration-tests/browser
        run: |
          npm run test:cwv:unit
          npm run test:cwv -- --loading "$ARTIFACTS_DIR/cwv/unreserved" --combined "$ARTIFACTS_DIR/cwv/reserved" --correctness-only --out "$RUNNER_TEMP/cwv-evidence"

      - name: Upload CWV evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cwv-evidence
          path: ${{ runner.temp }}/cwv-evidence/
          retention-days: 7

      - name: Test initial render fixture escaping
        working-directory: crates/trusted-server-integration-tests/browser
        run: node --test initial-render/pages.test.cjs

      - name: Test initial render ownership
        working-directory: crates/trusted-server-integration-tests/browser
        # Let the runner build its Rubicon + Shared ID artifact; the bidder-only
        # artifact above belongs to the existing Playwright tests.
        run: node initial-render/run.cjs --out "$RUNNER_TEMP/initial-render-evidence"

      - name: Upload initial render evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: initial-render-evidence
          path: ${{ runner.temp }}/initial-render-evidence/
          retention-days: 7

      - name: Run browser tests (Next.js)
        if: always()
        working-directory: crates/trusted-server-integration-tests/browser
        env:
          WASM_BINARY_PATH: ${{ env.WASM_ARTIFACT_PATH }}
          INTEGRATION_ORIGIN_PORT: ${{ env.ORIGIN_PORT }}
          VICEROY_CONFIG_PATH: ${{ env.ARTIFACTS_DIR }}/configs/viceroy.toml
          TEST_FRAMEWORK: nextjs
          PLAYWRIGHT_HTML_REPORT: playwright-report-nextjs
        run: npx playwright test

      - name: Upload Playwright report (Next.js)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-nextjs
          path: crates/trusted-server-integration-tests/browser/playwright-report-nextjs/
          retention-days: 7

      - name: Run browser tests (WordPress)
        if: always()
        working-directory: crates/trusted-server-integration-tests/browser
        env:
          WASM_BINARY_PATH: ${{ env.WASM_ARTIFACT_PATH }}
          INTEGRATION_ORIGIN_PORT: ${{ env.ORIGIN_PORT }}
          VICEROY_CONFIG_PATH: ${{ env.ARTIFACTS_DIR }}/configs/viceroy.toml
          TEST_FRAMEWORK: wordpress
          PLAYWRIGHT_HTML_REPORT: playwright-report-wordpress
        run: npx playwright test

      - name: Upload Playwright report (WordPress)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-wordpress
          path: crates/trusted-server-integration-tests/browser/playwright-report-wordpress/
          retention-days: 7

      - name: Upload Playwright traces and screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: crates/trusted-server-integration-tests/browser/test-results/
          retention-days: 7

  publisher-registration:
    name: publisher registration contracts
    needs: [prepare-artifacts, browser-tests]
    if: ${{ always() && needs.prepare-artifacts.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up publisher registration runtime
        id: shared-setup
        uses: ./.github/actions/setup-integration-test-env
        with:
          origin-port: ${{ env.ORIGIN_PORT }}
          install-viceroy: 'true'
          build-wasm: 'false'
          build-axum: 'false'
          build-test-images: 'false'

      - name: Download prepared integration artifacts
        uses: actions/download-artifact@v4
        with:
          name: integration-test-artifacts
          path: ${{ env.ARTIFACTS_DIR }}

      - name: Load prepared fixture images
        run: docker load --input "$DOCKER_ARTIFACT_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.shared-setup.outputs.node-version }}
          cache: npm
          cache-dependency-path: crates/trusted-server-integration-tests/browser/package-lock.json

      - name: Install browser dependencies
        working-directory: crates/trusted-server-integration-tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Restore prepared TSJS bundles
        run: |
          mkdir -p crates/trusted-server-js/dist
          cp "$ARTIFACTS_DIR/publisher-registration-dist/"*.js crates/trusted-server-js/dist/

      - name: Test publisher registration fixture and offline contracts
        run: |
          npm --prefix crates/trusted-server-integration-tests/browser run test:publisher-registration:fixture
          node crates/trusted-server-integration-tests/browser/publisher-registration/run.cjs \
            --implementation all --prebid "$ARTIFACTS_DIR/publisher-registration-prebid" \
            --out "$RUNNER_TEMP/publisher-registration-offline"

      - name: Test actual framework injection and provider delivery
        if: always()
        env:
          INTEGRATION_ORIGIN_PORT: ${{ env.ORIGIN_PORT }}
        run: |
          ./scripts/test-publisher-registration.sh \
            --wasm "$WASM_ARTIFACT_PATH" --dist "$ARTIFACTS_DIR/publisher-registration-dist" \
            --bundle-mode build-rs --prebid "$ARTIFACTS_DIR/publisher-registration-prebid" \
            --reuse-artifacts "$ARTIFACTS_DIR/publisher-registration" \
            --out "$RUNNER_TEMP/publisher-registration-framework"

      - name: Upload publisher registration evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publisher-registration-evidence
          path: |
            ${{ runner.temp }}/publisher-registration-offline/
            ${{ runner.temp }}/publisher-registration-framework/
            ${{ env.ARTIFACTS_DIR }}/publisher-registration/
            ${{ env.ARTIFACTS_DIR }}/publisher-registration-prep/
          retention-days: 7
