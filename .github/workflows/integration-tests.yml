name: "Integration Tests"
run-name: >-
  Integration Tests / ${{ inputs.evidence_id || format('PR {0}', github.event.pull_request.number) }}

permissions:
  contents: read

on:
  # Intentionally PR-only plus manual dispatch. Direct pushes to `main` are
  # expected to arrive through PR merges, which already run this workflow.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      evidence_id:
        description: Unique identifier used to bind this run to an evidence artifact
        required: true
        type: string

env:
  ORIGIN_PORT: 8888
  ARTIFACTS_DIR: /tmp/integration-test-artifacts
  WASM_ARTIFACT_PATH: /tmp/integration-test-artifacts/wasm/trusted-server-adapter-fastly.wasm
  AXUM_ARTIFACT_PATH: /tmp/integration-test-artifacts/axum/trusted-server-axum
  DOCKER_ARTIFACT_PATH: /tmp/integration-test-artifacts/docker/test-images.tar
  CF_BUILD_ARTIFACT_PATH: /tmp/integration-test-artifacts/cloudflare/build

jobs:
  prepare-artifacts:
    name: prepare integration artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up shared integration build environment
        uses: ./.github/actions/setup-integration-test-env
        with:
          origin-port: ${{ env.ORIGIN_PORT }}
          install-viceroy: "false"
          build-cloudflare: "true"

      - name: Generate integration Viceroy configs
        run: ./scripts/generate-integration-viceroy-configs.sh
        env:
          INTEGRATION_ORIGIN_PORT: ${{ env.ORIGIN_PORT }}

      - name: Package integration test artifacts
        run: |
          mkdir -p "$(dirname "$WASM_ARTIFACT_PATH")" "$(dirname "$AXUM_ARTIFACT_PATH")" "$(dirname "$DOCKER_ARTIFACT_PATH")" "$CF_BUILD_ARTIFACT_PATH"
          cp target/wasm32-wasip1/release/trusted-server-adapter-fastly.wasm "$WASM_ARTIFACT_PATH"
          cp target/debug/trusted-server-axum "$AXUM_ARTIFACT_PATH"
          cp -r crates/trusted-server-adapter-cloudflare/build/. "$CF_BUILD_ARTIFACT_PATH/"
          docker save \
            --output "$DOCKER_ARTIFACT_PATH" \
            test-wordpress:latest test-nextjs:latest

      - name: Upload integration test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-artifacts
          path: ${{ env.ARTIFACTS_DIR }}
          retention-days: 1

  integration-tests:
    name: integration tests
    needs: prepare-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up integration test runtime
        id: shared-setup
        uses: ./.github/actions/setup-integration-test-env
        with:
          origin-port: ${{ env.ORIGIN_PORT }}
          install-viceroy: "true"
          build-wasm: "false"
          build-axum: "false"
          build-test-images: "false"

      - name: Download integration test artifacts
        uses: actions/download-artifact@v4
        with:
          name: integration-test-artifacts
          path: ${{ env.ARTIFACTS_DIR }}

      - name: Make binaries executable
        run: chmod +x "$AXUM_ARTIFACT_PATH"

      - name: Restore Cloudflare Workers bundle
        run: |
          mkdir -p crates/trusted-server-adapter-cloudflare/build
          cp -r "$CF_BUILD_ARTIFACT_PATH/." crates/trusted-server-adapter-cloudflare/build/

      - name: Load integration test Docker images
        run: docker load --input "$DOCKER_ARTIFACT_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.shared-setup.outputs.node-version }}

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Run integration tests
        run: >-
          cargo test
          --manifest-path crates/trusted-server-integration-tests/Cargo.toml
          --target x86_64-unknown-linux-gnu
          -- --include-ignored
          --skip test_wordpress_fastly --skip test_nextjs_fastly
          --test-threads=1
        env:
          WASM_BINARY_PATH: ${{ env.WASM_ARTIFACT_PATH }}
          AXUM_BINARY_PATH: ${{ env.AXUM_ARTIFACT_PATH }}
          CLOUDFLARE_WRANGLER_DIR: ${{ github.workspace }}/crates/trusted-server-adapter-cloudflare
          INTEGRATION_ORIGIN_PORT: ${{ env.ORIGIN_PORT }}
          VICEROY_CONFIG_PATH: ${{ env.ARTIFACTS_DIR }}/configs/viceroy.toml
          RUST_LOG: info

  integration-tests-fastly-ec:
    name: integration tests (Fastly EC lifecycle)
    needs: prepare-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up integration test runtime
        id: shared-setup
        uses: ./.github/actions/setup-integration-test-env
        with:
          origin-port: ${{ env.ORIGIN_PORT }}
          install-viceroy: "true"
          build-wasm: "false"
          build-test-images: "false"

      - name: Download integration test artifacts
        uses: actions/download-artifact@v4
        with:
          name: integration-test-artifacts
          path: ${{ env.ARTIFACTS_DIR }}

      # Focused container-free EC lifecycle coverage using the same post-cutover
      # Viceroy config as the full integration matrix.
      - name: Run Fastly EC lifecycle tests
        run: >-
          cargo test
          --manifest-path crates/trusted-server-integration-tests/Cargo.toml
          --target x86_64-unknown-linux-gnu
          test_ec_lifecycle_fastly
          -- --include-ignored --test-threads=1
        env:
          WASM_BINARY_PATH: ${{ env.WASM_ARTIFACT_PATH }}
          INTEGRATION_ORIGIN_PORT: ${{ env.ORIGIN_PORT }}
          VICEROY_CONFIG_PATH: ${{ env.ARTIFACTS_DIR }}/configs/viceroy.toml
          RUST_LOG: info

  aps-runner-proxy:
    name: APS runner proxy (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runtime: [axum, fastly, cloudflare, spin]
    steps:
      - uses: actions/checkout@v4

      - name: Set up APS proxy test environment
        id: shared-setup
        uses: ./.github/actions/setup-integration-test-env
        with:
          origin-port: ${{ env.ORIGIN_PORT }}
          install-viceroy: ${{ matrix.runtime == 'fastly' && 'true' || 'false' }}
          build-wasm: "false"
          build-axum: "false"
          build-test-images: "false"
          build-cloudflare: "false"

      - name: Add Cloudflare wasm target
        if: matrix.runtime == 'cloudflare'
        run: rustup target add wasm32-unknown-unknown

      - name: Set up Node.js for Wrangler
        if: matrix.runtime == 'cloudflare'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.shared-setup.outputs.node-version }}

      - name: Install Wrangler
        if: matrix.runtime == 'cloudflare'
        run: npm install -g wrangler@4.64.0

      - name: Install Spin
        if: matrix.runtime == 'spin'
        uses: fermyon/actions/spin/setup@v1
        with:
          version: "4.0.2"

      - name: Run actual-adapter APS runner-proxy corpus
        run: ./scripts/integration-tests-aps-runner-proxy.sh --runtime ${{ matrix.runtime }}
        env:
          INTEGRATION_ORIGIN_PORT: ${{ env.ORIGIN_PORT }}
          RUST_LOG: info

  browser-tests:
    name: browser integration tests
    needs: prepare-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up browser test runtime
        id: shared-setup
        uses: ./.github/actions/setup-integration-test-env
        with:
          origin-port: ${{ env.ORIGIN_PORT }}
          install-viceroy: "true"
          build-wasm: "false"
          build-test-images: "false"

      - name: Download integration test artifacts
        uses: actions/download-artifact@v4
        with:
          name: integration-test-artifacts
          path: ${{ env.ARTIFACTS_DIR }}

      - name: Load integration test Docker images
        run: docker load --input "$DOCKER_ARTIFACT_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.shared-setup.outputs.node-version }}
          cache: npm
          cache-dependency-path: |
            crates/trusted-server-integration-tests/browser/package-lock.json
            crates/trusted-server-js/lib/package-lock.json

      - name: Build TSJS browser fixtures
        working-directory: crates/trusted-server-js/lib
        run: |
          npm ci
          npm run build
          npm run build:prebid-external

      - name: Install Playwright
        working-directory: crates/trusted-server-integration-tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run browser tests (Next.js)
        working-directory: crates/trusted-server-integration-tests/browser
        env:
          WASM_BINARY_PATH: ${{ env.WASM_ARTIFACT_PATH }}
          INTEGRATION_ORIGIN_PORT: ${{ env.ORIGIN_PORT }}
          VICEROY_CONFIG_PATH: ${{ env.ARTIFACTS_DIR }}/configs/viceroy.toml
          TEST_FRAMEWORK: nextjs
          PLAYWRIGHT_HTML_REPORT: playwright-report-nextjs
        run: npx playwright test

      - name: Upload Playwright report (Next.js)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-nextjs
          path: crates/trusted-server-integration-tests/browser/playwright-report-nextjs/
          retention-days: 7

      - name: Run browser tests (WordPress)
        if: always()
        working-directory: crates/trusted-server-integration-tests/browser
        env:
          WASM_BINARY_PATH: ${{ env.WASM_ARTIFACT_PATH }}
          INTEGRATION_ORIGIN_PORT: ${{ env.ORIGIN_PORT }}
          VICEROY_CONFIG_PATH: ${{ env.ARTIFACTS_DIR }}/configs/viceroy.toml
          TEST_FRAMEWORK: wordpress
          PLAYWRIGHT_HTML_REPORT: playwright-report-wordpress
        run: npx playwright test

      - name: Upload Playwright report (WordPress)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-wordpress
          path: crates/trusted-server-integration-tests/browser/playwright-report-wordpress/
          retention-days: 7

      - name: Upload Playwright traces and screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: crates/trusted-server-integration-tests/browser/test-results/
          retention-days: 7

      - name: Record TSJS pre-change performance evidence
        if: github.event_name == 'workflow_dispatch'
        working-directory: crates/trusted-server-integration-tests/browser
        env:
          WASM_BINARY_PATH: ${{ env.WASM_ARTIFACT_PATH }}
          INTEGRATION_ORIGIN_PORT: ${{ env.ORIGIN_PORT }}
          VICEROY_CONFIG_PATH: ${{ env.ARTIFACTS_DIR }}/configs/viceroy.toml
          TEST_FRAMEWORK: nextjs
          TSJS_PERF_MODE: baseline
          TSJS_PERF_OUTPUT: crates/trusted-server-js/lib/test/fixtures/performance/aps-tsjs-prechange.json
          TSJS_PERF_MACHINE_CLASS: github-hosted:ubuntu-24.04
          TSJS_EVIDENCE_ID: ${{ inputs.evidence_id }}
        run: >-
          npm exec -- playwright test
          tests/shared/tsjs-performance.spec.ts
          --project=chromium

      - name: Upload TSJS pre-change performance evidence
        if: github.event_name == 'workflow_dispatch' && always()
        uses: actions/upload-artifact@v4
        with:
          name: tsjs-performance-${{ inputs.evidence_id }}
          path: crates/trusted-server-js/lib/test/fixtures/performance/aps-tsjs-prechange.json
          if-no-files-found: error
          retention-days: 30

  browser-tests-aps-tsjs-conformance:
    name: browser integration tests (APS/TSJS conformance)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up APS/TSJS browser test runtime
        id: shared-setup
        uses: ./.github/actions/setup-integration-test-env
        with:
          origin-port: ${{ env.ORIGIN_PORT }}
          install-viceroy: "true"
          build-wasm: "false"
          build-axum: "false"
          build-test-images: "false"
          build-cloudflare: "false"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.shared-setup.outputs.node-version }}
          cache: npm
          cache-dependency-path: |
            crates/trusted-server-integration-tests/browser/package-lock.json
            crates/trusted-server-js/lib/package-lock.json

      - name: Run focused APS/TSJS three-browser conformance matrix
        env:
          INTEGRATION_ORIGIN_PORT: ${{ env.ORIGIN_PORT }}
          TS_BROWSER_FRAMEWORKS: nextjs
          TS_BROWSER_PROJECTS: chromium,firefox,webkit
        run: >-
          ./scripts/integration-tests-browser.sh
          tests/shared/aps-renderer.spec.ts
          tests/shared/aps-puc-lifecycle.spec.ts
          tests/shared/tsjs-runtime.spec.ts
          tests/shared/creative-sandbox.spec.ts
          tests/nextjs/gpt-diagnostics.spec.ts
          tests/nextjs/navigation.spec.ts
          --project=chromium --project=firefox --project=webkit

      - name: Upload APS/TSJS Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-aps-tsjs-conformance
          path: crates/trusted-server-integration-tests/browser/playwright-report/
          retention-days: 7
