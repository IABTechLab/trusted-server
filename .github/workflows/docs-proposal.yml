name: Documentation proposal

# Proposes documentation edits with Copilot CLI for the code changes since a
# chosen commit and opens one reviewable pull request. Run it manually from the
# Actions tab. See
# docs/superpowers/specs/2026-10-01-docs-proposal-automation-design.md.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to propose documentation for and open the pull request against
        required: true
        default: main
        type: string
      since:
        description: >-
          Commit on the branch to propose documentation since (exclusive); the run
          covers every change after it
        required: true
        type: string
      sha:
        description: >-
          Full SHA of the last commit on the branch to include; defaults to
          the branch head
        required: false
        type: string

permissions: {}

# Sequential merges are proposed one at a time, in order. The default queue
# keeps only one pending run and cancels older ones, so keep them all. Every
# job has a timeout so a hung run cannot hold the queue for hours.
concurrency:
  group: docs-proposal
  cancel-in-progress: false
  queue: max

# Each job runs the proposal scripts from the workflow's own revision in
# `tools/` against a checkout of the merge commit in `source/`, so retrying a
# merge that predates this tooling, or a later fix to it, still works. Copilot
# inspects `since`..`sha`.
# The propose job resolves the commit once so later jobs use the same SHA even
# if the branch moves during the run.
env:
  DOCS_PROPOSAL_BRANCH: ${{ inputs.branch }}
  BASE_SHA: ${{ inputs.since }}

jobs:
  # Copilot runs here with a read-only token; it cannot push or open PRs.
  # Copilot can write files that later steps execute, so treat this job as
  # untrusted: it uses no dependency cache that later runs would restore.
  # Because untrusted code runs on the main ref, it can still write other
  # main-scoped caches, so privileged workflows must never restore caches.
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      copilot-requests: write
    outputs:
      merge_sha: ${{ steps.resolve.outputs.merge_sha }}
    steps:
      - name: Checkout tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: tools
          persist-credentials: false

      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || inputs.branch }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve merge commit
        id: resolve
        working-directory: source
        run: echo "merge_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Retrieve Node.js version
        id: node-version
        run: echo "node-version=$(grep '^nodejs ' tools/.tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.node-version }}

      - name: Install Copilot CLI
        run: npm install -g @github/copilot@1.0.90

      - name: Propose documentation edits
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ steps.resolve.outputs.merge_sha }}
        run: ../tools/scripts/docs-proposal/propose.sh "$MERGE_SHA" .docs-proposal "$BASE_SHA"

      - name: Upload proposal
        uses: actions/upload-artifact@v4
        with:
          name: docs-proposal
          path: source/.docs-proposal/
          include-hidden-files: true
          if-no-files-found: error

  # VitePress executes Vue in Markdown during the build, so the docs gates run
  # here with no write token, persisted credentials, or dependency cache.
  validate:
    needs: propose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: tools
          persist-credentials: false

      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.propose.outputs.merge_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Retrieve Node.js version
        id: node-version
        run: echo "node-version=$(grep '^nodejs ' tools/.tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.node-version }}

      - name: Download proposal
        uses: actions/download-artifact@v4
        with:
          name: docs-proposal
          path: source/.docs-proposal

      - name: Validate proposal
        working-directory: source
        env:
          MERGE_SHA: ${{ needs.propose.outputs.merge_sha }}
        run: ../tools/scripts/docs-proposal/validate.sh "$MERGE_SHA" .docs-proposal

  # Copilot does not run here, and neither does any proposal content: this job
  # re-checks the path allowlist on a fresh checkout and publishes the patch.
  publish:
    needs: [propose, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: tools
          persist-credentials: false

      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.propose.outputs.merge_sha }}
          path: source
          fetch-depth: 0

      - name: Retrieve Node.js version
        id: node-version
        run: echo "node-version=$(grep '^nodejs ' tools/.tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.node-version }}

      - name: Download proposal
        uses: actions/download-artifact@v4
        with:
          name: docs-proposal
          path: source/.docs-proposal

      - name: Publish proposal pull request
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ needs.propose.outputs.merge_sha }}
        run: ../tools/scripts/docs-proposal/publish.sh "$MERGE_SHA" .docs-proposal
