name: 'Run Tests'

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-rust:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Retrieve Viceroy version
        id: viceroy-version
        # `.tool-versions` is the single source of truth so this workflow and
        # `.github/actions/setup-integration-test-env/action.yml` can't drift.
        run: echo "viceroy-version=$(grep '^viceroy ' .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Retrieve Node.js version
        id: node-version
        run: echo "node-version=$(grep '^nodejs ' .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          target: wasm32-wasip1
          cache-key: cargo-fastly

      - name: Cache Viceroy binary
        id: cache-viceroy
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/viceroy
          key: viceroy-${{ runner.os }}-v${{ steps.viceroy-version.outputs.viceroy-version }}

      - name: Install Viceroy
        if: steps.cache-viceroy.outputs.cache-hit != 'true'
        run: cargo install viceroy --version "${{ steps.viceroy-version.outputs.viceroy-version }}" --locked --force

      - name: Use Node.js for the served-seam contract
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.node-version }}

      - name: Run tests
        run: cargo test-fastly

      - name: Run tests (reusable-sandbox feature)
        run: cargo test-fastly-reuse

      - name: Run template cache ESI local harness
        run: BID_DELAY=3 ./scripts/template-cache-local-test.sh esi

      - name: Run inline control harness
        run: BID_DELAY=3 ./scripts/template-cache-local-test.sh inline

      - name: Run cache purge harness
        run: BID_DELAY=3 ./scripts/template-cache-local-test.sh purge

  test-axum:
    name: cargo test (axum native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          # wasm32-wasip1 is required by the "Verify Fastly WASM release
          # build" step below; the axum build and tests are native.
          target: wasm32-wasip1
          cache-key: cargo-axum

      - name: Read pinned Node.js version for CLI fixtures
        id: node-version
        shell: bash
        run: echo "version=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      - name: Build Axum adapter
        run: cargo build -p trusted-server-adapter-axum

      - name: Run Axum adapter tests
        run: cargo test-axum

      - name: Test template build digest inputs (native)
        run: cargo test -p trusted-server-core --test template_build_digest

      - name: Run HTML processor benchmarks (smoke)
        # -- --test runs each benchmark as a regular test (no timing harness) so CI stays fast
        run: cargo bench -p trusted-server-core --bench html_processor_bench -- --test

      - name: Run host-target CLI tests
        run: ./scripts/test-cli.sh

      # The codegen crate is not a default member and no adapter alias builds it,
      # so its tests only run if invoked explicitly on the host target.
      - name: Run host-target OpenRTB codegen tests
        run: |
          cargo test --package trusted-server-openrtb-codegen --target "$(rustc -vV | sed -n 's/host: //p')"

      - name: Verify Fastly WASM release build
        run: cargo build --package trusted-server-adapter-fastly --release --target wasm32-wasip1

  test-cloudflare:
    name: cargo check (cloudflare native + wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain (native + wasm32-unknown-unknown)
        uses: ./.github/actions/setup-rust
        with:
          target: wasm32-unknown-unknown
          cache-key: cargo-cloudflare

      - name: Check Cloudflare adapter (native host)
        run: cargo check -p trusted-server-adapter-cloudflare

      - name: Check Cloudflare adapter (wasm32-unknown-unknown)
        run: cargo check -p trusted-server-adapter-cloudflare --target wasm32-unknown-unknown --features cloudflare

      - name: Run Cloudflare adapter tests (native host)
        run: cargo test-cloudflare

  test-spin:
    name: cargo check/build/test (spin native + wasm32-wasip1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain (native + wasm32-wasip1)
        uses: ./.github/actions/setup-rust
        with:
          target: wasm32-wasip1
          cache-key: cargo-spin

      - name: Check Spin adapter (native host)
        run: cargo check -p trusted-server-adapter-spin

      - name: Check Spin adapter (wasm32-wasip1)
        run: cargo check-spin

      - name: Build Spin adapter release WASM
        # Mirror the Fastly release-build overrides so the artifact embeds usable
        # settings instead of the trusted-server.toml placeholders, which startup
        # rejects (falling back to the generic 503 router). This proves the
        # documented Spin artifact can boot, not just compile.
        env:
          TRUSTED_SERVER__PUBLISHER__ORIGIN_URL: http://127.0.0.1:8080
          TRUSTED_SERVER__PUBLISHER__PROXY_SECRET: integration-test-proxy-secret
          TRUSTED_SERVER__EC__PASSPHRASE: integration-test-ec-secret-padded-32
          TRUSTED_SERVER__PROXY__CERTIFICATE_CHECK: 'false'
        run: cargo build --package trusted-server-adapter-spin --target wasm32-wasip1 --features spin --release

      - name: Run Spin adapter tests (native host)
        run: cargo test-spin

  test-parity:
    name: cargo test (cross-adapter parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
          cache-key: cargo-parity

      - name: Format check (parity test crate)
        run: cargo fmt --manifest-path crates/trusted-server-integration-tests/Cargo.toml -- --check

      - name: Run cross-adapter parity tests
        run: cargo test --manifest-path crates/trusted-server-integration-tests/Cargo.toml --test parity

      - name: Clippy (parity test crate)
        run: cargo clippy --manifest-path crates/trusted-server-integration-tests/Cargo.toml --all-targets -- -D warnings

  test-cli:
    name: cargo test (ts CLI, native)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: 'clippy, rustfmt'
          cache-key: cargo-cli

      - name: Read pinned Node.js version for CLI fixtures
        id: node-version
        shell: bash
        run: echo "version=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      # No separate `cargo fmt` here: `trusted-server-cli` is a workspace member,
      # so the main `cargo fmt --all` job already formats it. Clippy still needs a
      # native run — the workspace clippy jobs are wasm/adapter-scoped and never
      # lint the CLI's host-only code, including platform-specific trust operations.
      - name: cargo clippy
        run: |
          cargo clippy --manifest-path crates/trusted-server-cli/Cargo.toml --target "$(rustc -vV | sed -n 's/host: //p')" --all-targets -- -D warnings

      - name: Set up Chrome for browser fixture tests
        if: runner.os == 'macOS'
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: cargo test
        if: runner.os == 'Linux'
        run: |
          cargo test --manifest-path crates/trusted-server-cli/Cargo.toml --target "$(rustc -vV | sed -n 's/host: //p')"

      - name: cargo test (browser fixtures)
        if: runner.os == 'macOS'
        run: ./scripts/test-cli.sh
        env:
          CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Install tools for real NSS trust tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libnss3-tools openssl

      - name: cargo test (real NSS trust)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$(rustc -vV | sed -n 's/host: //p')"
          COUNT="$(cargo test --manifest-path crates/trusted-server-cli/Cargo.toml --target "$TARGET" \
            --test proxy_trust_linux -- --ignored --list | awk '/: test$/ { count += 1 } END { print count + 0 }')"
          if [ "$COUNT" -eq 0 ]; then
            echo "No ignored real-NSS tests matched --test proxy_trust_linux" >&2
            exit 1
          fi
          cargo test --manifest-path crates/trusted-server-cli/Cargo.toml --target "$TARGET" \
            --test proxy_trust_linux -- --ignored

  # Ordinary source-built behavior checks; this matrix is not release qualification.
  test-release-native:
    name: cargo test (release tooling and JS prebuilt, native)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Read pinned tool versions
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          echo "rust=$(awk '$1 == "rust" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
          echo "node=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Use pinned Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node 24)
        with:
          node-version: ${{ steps.tools.outputs.node }}
          cache: npm
          cache-dependency-path: crates/trusted-server-js/lib/package-lock.json

      - name: Install JS dependencies
        working-directory: crates/trusted-server-js/lib
        run: npm ci

      # The runner's installed rustup bootstraps ordinary CI, not the release producer.
      - name: Install pinned native Rust toolchain
        env:
          RUST_VERSION: ${{ steps.tools.outputs.rust }}
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup override set "$RUST_VERSION"
          HOST_TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          test -n "$HOST_TARGET"
          echo "HOST_TARGET=$HOST_TARGET" >> "$GITHUB_ENV"

      - name: Guard and run all native release-tool tests
        shell: bash
        run: |
          set -euo pipefail
          TEST_LIST="$(mktemp)"
          trap 'rm -f "$TEST_LIST"' EXIT
          cargo test -p trusted-server-release --target "$HOST_TARGET" --all-features -- --list > "$TEST_LIST"
          awk '/: test$/ { count++ } END { if (count == 0) { print "No native release-tool tests selected"; exit 1 } print "Selected " count " native release-tool tests" }' "$TEST_LIST"
          cargo test -p trusted-server-release --target "$HOST_TARGET" --all-features
          cargo clippy -p trusted-server-release --target "$HOST_TARGET" --all-targets --all-features -- -D warnings
          cargo doc -p trusted-server-release --target "$HOST_TARGET" --no-deps --all-features

      - name: Prepare original-only full JS fixture (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p trusted-server-release --target "$HOST_TARGET" --locked
          FIXTURE_ROOT="$RUNNER_TEMP/release-js-original-fixture"
          node scripts/release/tests/prepare-js-fixture.mjs "$FIXTURE_ROOT" "target/$HOST_TARGET/debug/trusted-server-release"
          echo "TS_RELEASE_JS_FIXTURE_ROOT=$FIXTURE_ROOT" >> "$GITHUB_ENV"

      - name: Prove two fresh offline JS builds (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          # Optimize repeated whole-input hashes with test safety checks retained.
          CARGO_PROFILE_TEST_OPT_LEVEL: '2'
          CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
          CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
        run: |
          set -euo pipefail
          TEST_NAME=preparation::tests::full::real_two_fresh_js_builds
          TEST_LIST="$(mktemp)"
          trap 'rm -f "$TEST_LIST"' EXIT
          cargo test -p trusted-server-release --target "$HOST_TARGET" --locked "$TEST_NAME" -- --ignored --exact --list > "$TEST_LIST"
          awk '/: test$/ { count++ } END { if (count != 1) { print "Expected exactly one full JS execution fixture"; exit 1 } }' "$TEST_LIST"
          cargo test -p trusted-server-release --target "$HOST_TARGET" --locked "$TEST_NAME" -- --ignored --exact --nocapture
          cat "$TS_RELEASE_JS_FIXTURE_ROOT/js-execution-measurement.json"

      - name: Guard and run native JS prebuilt tests
        shell: bash
        run: |
          set -euo pipefail
          TEST_LIST="$(mktemp)"
          trap 'rm -f "$TEST_LIST"' EXIT
          cargo test -p trusted-server-js --target "$HOST_TARGET" --test release_prebuilt -- --list > "$TEST_LIST"
          awk '/: test$/ { count++ } END { if (count == 0) { print "No native JS prebuilt tests selected"; exit 1 } print "Selected " count " native JS prebuilt tests" }' "$TEST_LIST"
          cargo test -p trusted-server-js --target "$HOST_TARGET" --test release_prebuilt
          cargo clippy -p trusted-server-js --target "$HOST_TARGET" --all-targets --all-features -- -D warnings

  # Ordinary CI candidate evidence of the confined Cargo recipe; this job is
  # not release qualification (every measurement reports it as such).
  test-release-cargo-candidate:
    name: cargo test (confined release Cargo candidate, Linux)
    runs-on: ubuntu-24.04
    # Fixture preparation, two fresh JS builds (~12 min), then two confined
    # Fastly builds each with its own vendoring (~3-4 min each) and the
    # final-byte comparison: 45 minutes left too little headroom. The
    # uncached Viceroy install (~5-8 min) and three gate runs add to that.
    timeout-minutes: 75
    env:
      # Optimize repeated whole-input hashes with test safety checks retained.
      CARGO_PROFILE_TEST_OPT_LEVEL: '2'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)
        with:
          persist-credentials: false
          # Full history: the fixtures clone this checkout, and source
          # authentication rejects a shallow repository (`.git/shallow`).
          fetch-depth: 0

      - name: Read pinned tool versions
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "rust=$(awk '$1 == "rust" { print $2 }' .tool-versions)"
            echo "node=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)"
            echo "viceroy=$(awk '$1 == "viceroy" { print $2 }' .tool-versions)"
          } >> "$GITHUB_OUTPUT"

      - name: Use pinned Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node 24)
        with:
          node-version: ${{ steps.tools.outputs.node }}
          cache: npm
          cache-dependency-path: crates/trusted-server-js/lib/package-lock.json

      # The runner's installed rustup bootstraps ordinary CI, not the release producer.
      - name: Install pinned native Rust toolchain with the Wasm target
        env:
          RUST_VERSION: ${{ steps.tools.outputs.rust }}
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup target add --toolchain "$RUST_VERSION" wasm32-wasip1
          rustup override set "$RUST_VERSION"
          HOST_TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          test -n "$HOST_TARGET"
          echo "HOST_TARGET=$HOST_TARGET" >> "$GITHUB_ENV"

      # Same pinned source install as the other Viceroy jobs, but uncached and
      # into a private root: the runtime gate selects this exact absolute path,
      # checks its reported version and records its digest.
      - name: Install pinned Viceroy for the final-byte runtime gate
        env:
          VICEROY_VERSION: ${{ steps.tools.outputs.viceroy }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VICEROY_VERSION"
          VICEROY_ROOT="$RUNNER_TEMP/release-viceroy"
          cargo install viceroy --version "$VICEROY_VERSION" --locked --root "$VICEROY_ROOT"
          test "$("$VICEROY_ROOT/bin/viceroy" --version)" = "viceroy $VICEROY_VERSION"
          echo "TS_RELEASE_VICEROY=$VICEROY_ROOT/bin/viceroy" >> "$GITHUB_ENV"

      - name: Prepare ordinary CI JS and Cargo fixtures
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p trusted-server-release --target "$HOST_TARGET" --locked
          PRODUCER="target/$HOST_TARGET/debug/trusted-server-release"
          JS_FIXTURE_ROOT="$RUNNER_TEMP/release-js-original-fixture"
          CARGO_FIXTURE_ROOT="$RUNNER_TEMP/release-cargo-fixture"
          node scripts/release/tests/prepare-js-fixture.mjs "$JS_FIXTURE_ROOT" "$PRODUCER"
          node scripts/release/tests/prepare-cargo-fixture.mjs "$CARGO_FIXTURE_ROOT" "$PRODUCER"
          echo "TS_RELEASE_JS_FIXTURE_ROOT=$JS_FIXTURE_ROOT" >> "$GITHUB_ENV"
          echo "TS_RELEASE_CARGO_FIXTURE_ROOT=$CARGO_FIXTURE_ROOT" >> "$GITHUB_ENV"
          df -h "$RUNNER_TEMP"

      - name: Prove Cargo build scripts and proc macros inherit denial (Linux)
        shell: bash
        run: |
          set -euo pipefail
          TEST_NAME=recipe::tests::full::cargo_children_inherit_denial
          TEST_LIST="$(mktemp)"
          trap 'rm -f "$TEST_LIST"' EXIT
          cargo test -p trusted-server-release --target "$HOST_TARGET" --locked "$TEST_NAME" -- --ignored --exact --list > "$TEST_LIST"
          awk '/: test$/ { count++ } END { if (count != 1) { print "Expected exactly one Cargo denial fixture"; exit 1 } }' "$TEST_LIST"
          cargo test -p trusted-server-release --target "$HOST_TARGET" --locked "$TEST_NAME" -- --ignored --exact --nocapture
          cat "$TS_RELEASE_CARGO_FIXTURE_ROOT/cargo-denial-measurement.json"

      # Before each build, the producer-normalized Git manifests are compared
      # with cargo vendor's for dependency resolution (evidence only). The
      # canonical and reproduction builds use the same JS handoff in
      # separate fresh roots and boundaries; the final Fastly files must be
      # byte-identical. Both outputs then pass the final-byte Viceroy runtime
      # gate, and a closed-origin run must be rejected despite a healthy probe.
      - name: Build canonical and reproduction Fastly from one JS handoff, compare final bytes and run the Viceroy gate (Linux)
        shell: bash
        run: |
          set -euo pipefail
          TEST_NAME=recipe::tests::full::fastly_canonical_and_reproduction_builds_are_byte_identical
          TEST_LIST="$(mktemp)"
          trap 'rm -f "$TEST_LIST"' EXIT
          cargo test -p trusted-server-release --target "$HOST_TARGET" --locked "$TEST_NAME" -- --ignored --exact --list > "$TEST_LIST"
          awk '/: test$/ { count++ } END { if (count != 1) { print "Expected exactly one Fastly canonical/reproduction equality fixture"; exit 1 } }' "$TEST_LIST"
          cargo test -p trusted-server-release --target "$HOST_TARGET" --locked "$TEST_NAME" -- --ignored --exact --nocapture
          cat "$TS_RELEASE_CARGO_FIXTURE_ROOT/normalized-manifest-differential-measurement.json"
          cat "$TS_RELEASE_CARGO_FIXTURE_ROOT/cargo-canonical-reproduction-equality-measurement.json"
          cat "$TS_RELEASE_CARGO_FIXTURE_ROOT/fastly-runtime-gate-measurement.json"

  test-release-cli-candidate:
    name: cargo test (Linux ts CLI release candidate)
    runs-on: ubuntu-24.04
    # Fixture preparation (~6 min, including the UBI 9 builder image and the
    # three startup image pulls), two fresh JS builds (~12 min), then the
    # canonical and the measured reproduction confined CLI builds (~10-15 min
    # each, about twice the Fastly dependency closure plus C code) and three
    # clean-container startups.
    timeout-minutes: 75
    env:
      # Optimize repeated whole-input hashes with test safety checks retained.
      CARGO_PROFILE_TEST_OPT_LEVEL: '2'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)
        with:
          persist-credentials: false
          # Full history: the fixtures clone this checkout, and source
          # authentication rejects a shallow repository (`.git/shallow`).
          fetch-depth: 0

      - name: Read pinned tool versions
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "rust=$(awk '$1 == "rust" { print $2 }' .tool-versions)"
            echo "node=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)"
          } >> "$GITHUB_OUTPUT"

      - name: Use pinned Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node 24)
        with:
          node-version: ${{ steps.tools.outputs.node }}
          cache: npm
          cache-dependency-path: crates/trusted-server-js/lib/package-lock.json

      # The runner's installed rustup bootstraps ordinary CI, not the release
      # producer. The copied toolchain keeps its host x86_64-unknown-linux-gnu
      # standard library, which the CLI targets; the Cargo fixture also
      # requires the Wasm one.
      - name: Install pinned native Rust toolchain with the Wasm target
        env:
          RUST_VERSION: ${{ steps.tools.outputs.rust }}
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup target add --toolchain "$RUST_VERSION" wasm32-wasip1
          rustup override set "$RUST_VERSION"
          HOST_TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          test "$HOST_TARGET" = x86_64-unknown-linux-gnu
          echo "HOST_TARGET=$HOST_TARGET" >> "$GITHUB_ENV"

      - name: Prepare ordinary CI JS, Cargo and CLI fixtures
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p trusted-server-release --target "$HOST_TARGET" --locked
          PRODUCER="target/$HOST_TARGET/debug/trusted-server-release"
          JS_FIXTURE_ROOT="$RUNNER_TEMP/release-js-original-fixture"
          CARGO_FIXTURE_ROOT="$RUNNER_TEMP/release-cargo-fixture"
          CLI_FIXTURE_ROOT="$RUNNER_TEMP/release-cli-fixture"
          node scripts/release/tests/prepare-cli-fixture.mjs "$CLI_FIXTURE_ROOT"
          # Rebuild the same producer inside the GNU baseline. The Ubuntu
          # host binary requires a newer libc and cannot serve as its probe.
          # These cached downloads remain unauthenticated candidate inputs.
          BOOTSTRAP_ROOT="$(mktemp -d "$RUNNER_TEMP/cli-producer.XXXXXX")"
          BOOTSTRAP_NAME="ts-cli-producer-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BOOTSTRAP_ID=
          BOOTSTRAP_CREATE_STARTED=false
          mkdir "$BOOTSTRAP_ROOT/cargo-home" "$BOOTSTRAP_ROOT/target" "$BOOTSTRAP_ROOT/docker-config"
          cleanup_cli_bootstrap() {
            local build_status=$?
            trap - EXIT
            local reference="$BOOTSTRAP_NAME" filter="name=^/$BOOTSTRAP_NAME$"
            if [[ -n "$BOOTSTRAP_ID" ]]; then
              reference="$BOOTSTRAP_ID"
              filter="id=$BOOTSTRAP_ID"
            elif [[ "$BOOTSTRAP_CREATE_STARTED" == true ]]; then
              printf '%s\n' 'Bootstrap creation was not acknowledged; no start was issued.' >&2
              [[ "$build_status" -ne 0 ]] || build_status=1
            fi
            timeout --kill-after=5s 30s docker --config "$BOOTSTRAP_ROOT/docker-config" --host unix:///var/run/docker.sock stop --time 2 "$reference" >/dev/null 2>&1 || true
            timeout --kill-after=5s 30s docker --config "$BOOTSTRAP_ROOT/docker-config" --host unix:///var/run/docker.sock rm --force "$reference" >/dev/null 2>&1 || true
            local survivors
            survivors="$(timeout --kill-after=5s 30s docker --config "$BOOTSTRAP_ROOT/docker-config" --host unix:///var/run/docker.sock ps --all --quiet --filter "$filter")" || exit 1
            [[ -z "$survivors" ]] || exit 1
            exit "$build_status"
          }
          trap cleanup_cli_bootstrap EXIT
          cp -R "$HOME/.cargo/registry" "$BOOTSTRAP_ROOT/cargo-home/registry"
          if [[ -d "$HOME/.cargo/git" ]]; then
            cp -R "$HOME/.cargo/git" "$BOOTSTRAP_ROOT/cargo-home/git"
          fi
          BUILDER_IMAGE="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).builder_image_id' "$CLI_FIXTURE_ROOT/cli-fixture.json")"
          TOOLCHAIN_ROOT="$(rustc --print sysroot)"
          BOOTSTRAP_CREATE_STARTED=true
          BOOTSTRAP_CREATED="$(timeout --kill-after=5s 60s docker --config "$BOOTSTRAP_ROOT/docker-config" --host unix:///var/run/docker.sock create \
            --init --name "$BOOTSTRAP_NAME" --pull=never --network=none --read-only \
            --user "$(id -u):$(id -g)" --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=256 --memory=4g --cpus=2 --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/source,readonly" \
            --mount "type=bind,src=$TOOLCHAIN_ROOT,dst=/tools,readonly" \
            --mount "type=bind,src=$BOOTSTRAP_ROOT/cargo-home,dst=/cargo-home" \
            --mount "type=bind,src=$BOOTSTRAP_ROOT/target,dst=/target" \
            --workdir /source --env PATH=/tools/bin:/usr/bin:/bin --env HOME=/tmp \
            --env CARGO_HOME=/cargo-home --env CARGO_TARGET_DIR=/target --env RUSTC=/tools/bin/rustc \
            --env GIT_CONFIG_NOSYSTEM=1 --env GIT_CONFIG_GLOBAL=/dev/null \
            --entrypoint /tools/bin/cargo "$BUILDER_IMAGE" \
            build -p trusted-server-release --target "$HOST_TARGET" --locked --offline)"
          [[ "$BOOTSTRAP_CREATED" =~ ^[a-f0-9]{64}$ ]]
          BOOTSTRAP_ID="$BOOTSTRAP_CREATED"
          timeout --kill-after=10s 15m docker --config "$BOOTSTRAP_ROOT/docker-config" --host unix:///var/run/docker.sock start --attach "$BOOTSTRAP_ID"
          PRODUCER="$BOOTSTRAP_ROOT/target/$HOST_TARGET/debug/trusted-server-release"
          node scripts/release/tests/prepare-js-fixture.mjs "$JS_FIXTURE_ROOT" "$PRODUCER"
          node scripts/release/tests/prepare-cargo-fixture.mjs "$CARGO_FIXTURE_ROOT" "$PRODUCER"
          {
            echo "TS_RELEASE_JS_FIXTURE_ROOT=$JS_FIXTURE_ROOT"
            echo "TS_RELEASE_CARGO_FIXTURE_ROOT=$CARGO_FIXTURE_ROOT"
            echo "TS_RELEASE_CLI_FIXTURE_ROOT=$CLI_FIXTURE_ROOT"
          } >> "$GITHUB_ENV"
          cat "$CLI_FIXTURE_ROOT/cli-fixture.json"
          df -h "$RUNNER_TEMP"

      - name: Verify startup timeout removes its owned container
        shell: bash
        run: |
          set -euo pipefail
          TEST_NAME=recipe::startup::tests::startup_timeout_removes_only_its_owned_container
          TEST_LIST="$(mktemp)"
          trap 'rm -f "$TEST_LIST"' EXIT
          cargo test -p trusted-server-release --target "$HOST_TARGET" --locked "$TEST_NAME" -- --ignored --exact --list > "$TEST_LIST"
          awk '/: test$/ { count++ } END { if (count != 1) { print "Expected exactly one startup cleanup fixture"; exit 1 } }' "$TEST_LIST"
          cargo test -p trusted-server-release --target "$HOST_TARGET" --locked "$TEST_NAME" -- --ignored --exact --nocapture

      # The canonical build is gated: glibc 2.34 ELF policy with retained
      # debug info, the remap scan, planted operator values absent and
      # `ts --version` in clean UBI 9, Ubuntu 22.04 and Debian 12 containers.
      # The reproduction build is recorded, never a gate.
      - name: Build, inspect and start the Linux ts candidate and measure its reproduction (Linux)
        shell: bash
        run: |
          set -euo pipefail
          TEST_NAME=recipe::tests::cli::linux_cli_candidate_builds_inspects_and_starts_cleanly
          TEST_LIST="$(mktemp)"
          trap 'rm -f "$TEST_LIST"' EXIT
          cargo test -p trusted-server-release --target "$HOST_TARGET" --locked "$TEST_NAME" -- --ignored --exact --list > "$TEST_LIST"
          awk '/: test$/ { count++ } END { if (count != 1) { print "Expected exactly one Linux CLI candidate fixture"; exit 1 } }' "$TEST_LIST"
          cargo test -p trusted-server-release --target "$HOST_TARGET" --locked "$TEST_NAME" -- --ignored --exact --nocapture
          cat "$TS_RELEASE_CLI_FIXTURE_ROOT/linux-cli-candidate-measurement.json"
          df -h "$RUNNER_TEMP"

      - name: Preserve available CLI candidate measurements in the job log
        if: always()
        shell: bash
        run: |
          if [[ -n "${TS_RELEASE_CLI_FIXTURE_ROOT:-}" ]]; then
            for report in builder-filesystem-controls.json linux-cli-candidate-measurement.json; do
              if [[ -f "$TS_RELEASE_CLI_FIXTURE_ROOT/$report" ]]; then
                cat "$TS_RELEASE_CLI_FIXTURE_ROOT/$report"
              fi
            done
          fi

  # Decides whether the macOS candidate jobs and their Linux JS handoff run.
  # It fails open: any error, a new branch or an unknown event selects them.
  # Skipped jobs report success, so nothing else depends on this filter.
  changes:
    name: Detect release candidate changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.filter.outputs.release }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Match changed paths against the release candidate inputs
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node --test scripts/release/tests/candidate-changes.test.mjs
          select_release() {
            echo "release=$1" >> "$GITHUB_OUTPUT"
            echo "Release candidate jobs selected: $1 ($2)"
            exit 0
          }
          case "$EVENT_NAME" in
            pull_request) RANGE="$PULL_BASE_SHA...$PULL_HEAD_SHA" ;;
            push) RANGE="$PUSH_BEFORE_SHA..$PUSH_AFTER_SHA" ;;
            *) select_release true "event $EVENT_NAME" ;;
          esac
          if [[ "$RANGE" == *0000000000000000000000000000000000000000* || "$RANGE" == ...* || "$RANGE" == *... || "$RANGE" == ..* ]]; then
            select_release true "no comparable base"
          fi
          if ! SELECTED="$(bash scripts/release/tests/candidate-changes.sh "$RANGE")"; then
            select_release true "cannot classify $RANGE"
          fi
          case "$SELECTED" in
            true|false) select_release "$SELECTED" "comparison $RANGE" ;;
            *) select_release true "unexpected classifier result" ;;
          esac

  # Exports the Linux two-fresh JS handoff for the macOS candidate jobs,
  # which cannot run the Linux-only JS build. The artifact is unauthenticated
  # ordinary CI evidence; the adopting job labels it so.
  test-release-js-handoff:
    name: cargo test (export Linux JS handoff for macOS candidates)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.release == 'true') }}
    runs-on: ubuntu-24.04
    # Fixture preparation (~3 min, including the JS fixture image) and the
    # two fresh JS builds (~12 min).
    timeout-minutes: 30
    env:
      # Optimize repeated whole-input hashes with test safety checks retained.
      CARGO_PROFILE_TEST_OPT_LEVEL: '2'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)
        with:
          persist-credentials: false
          # Full history: the fixture clones this checkout, and source
          # authentication rejects a shallow repository (`.git/shallow`).
          fetch-depth: 0

      - name: Read pinned tool versions
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "rust=$(awk '$1 == "rust" { print $2 }' .tool-versions)"
            echo "node=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)"
          } >> "$GITHUB_OUTPUT"

      - name: Use pinned Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node 24)
        with:
          node-version: ${{ steps.tools.outputs.node }}
          cache: npm
          cache-dependency-path: crates/trusted-server-js/lib/package-lock.json

      # The runner's installed rustup bootstraps ordinary CI, not the release producer.
      - name: Install pinned native Rust toolchain
        env:
          RUST_VERSION: ${{ steps.tools.outputs.rust }}
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup override set "$RUST_VERSION"
          HOST_TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          test "$HOST_TARGET" = x86_64-unknown-linux-gnu
          echo "HOST_TARGET=$HOST_TARGET" >> "$GITHUB_ENV"

      - name: Prepare original-only full JS fixture
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p trusted-server-release --target "$HOST_TARGET" --locked
          FIXTURE_ROOT="$RUNNER_TEMP/release-js-original-fixture"
          EXPORT_ROOT="$RUNNER_TEMP/release-js-handoff"
          test ! -e "$EXPORT_ROOT"
          node scripts/release/tests/prepare-js-fixture.mjs "$FIXTURE_ROOT" "target/$HOST_TARGET/debug/trusted-server-release"
          {
            echo "TS_RELEASE_JS_FIXTURE_ROOT=$FIXTURE_ROOT"
            echo "TS_RELEASE_JS_HANDOFF_EXPORT=$EXPORT_ROOT"
          } >> "$GITHUB_ENV"

      - name: Run two fresh offline JS builds and export the retained handoff
        shell: bash
        run: |
          set -euo pipefail
          TEST_NAME=preparation::tests::full::export_js_handoff_for_candidates
          TEST_LIST="$(mktemp)"
          trap 'rm -f "$TEST_LIST"' EXIT
          cargo test -p trusted-server-release --target "$HOST_TARGET" --locked "$TEST_NAME" -- --ignored --exact --list > "$TEST_LIST"
          awk '/: test$/ { count++ } END { if (count != 1) { print "Expected exactly one JS handoff export fixture"; exit 1 } }' "$TEST_LIST"
          cargo test -p trusted-server-release --target "$HOST_TARGET" --locked "$TEST_NAME" -- --ignored --exact --nocapture
          find "$TS_RELEASE_JS_HANDOFF_EXPORT" -type f | sort

      - name: Upload the unauthenticated JS handoff for the macOS candidates
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node 24)
        with:
          name: release-js-handoff
          path: ${{ env.TS_RELEASE_JS_HANDOFF_EXPORT }}
          if-no-files-found: error
          retention-days: 1
          # A re-run of this job replaces its own earlier upload.
          overwrite: true

  # Ordinary CI candidate evidence of the Darwin ts on native arm64 and Intel
  # macOS 15; not release qualification (every measurement reports it). The
  # unqualified sandbox only reaps descendants after each run, the Xcode is
  # the runner's, and the JS handoff is the Linux job's unauthenticated
  # artifact.
  test-release-macos-cli-candidate:
    name: cargo test (macOS ts CLI release candidate, ${{ matrix.os }})
    needs: test-release-js-handoff
    if: ${{ !cancelled() && needs.test-release-js-handoff.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    # Fixture preparation (~5 min), four denial builds (~5 min), then the
    # canonical and the measured reproduction confined CLI builds (~10-20 min
    # each; the Intel runners are the slower) and one native startup.
    timeout-minutes: 90
    env:
      # Optimize repeated whole-input hashes with test safety checks retained.
      CARGO_PROFILE_TEST_OPT_LEVEL: '2'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)
        with:
          persist-credentials: false
          # Full history: the fixture clones this checkout, and source
          # authentication rejects a shallow repository (`.git/shallow`).
          fetch-depth: 0

      - name: Read pinned tool versions
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "rust=$(awk '$1 == "rust" { print $2 }' .tool-versions)"
            echo "node=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)"
          } >> "$GITHUB_OUTPUT"

      - name: Use pinned Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node 24)
        with:
          node-version: ${{ steps.tools.outputs.node }}

      # The runner's installed rustup bootstraps ordinary CI, not the release
      # producer. The copied toolchain keeps only its host Darwin standard
      # library, which both the CLI and the denial fixture target.
      - name: Install pinned native Rust toolchain and check the native host
        env:
          RUST_VERSION: ${{ steps.tools.outputs.rust }}
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup override set "$RUST_VERSION"
          HOST_TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          case "$(uname -m)" in
            arm64) EXPECTED_TARGET=aarch64-apple-darwin ;;
            x86_64) EXPECTED_TARGET=x86_64-apple-darwin ;;
            *) echo "Unsupported macOS machine $(uname -m)" >&2; exit 1 ;;
          esac
          test "$HOST_TARGET" = "$EXPECTED_TARGET"
          # Absent on Intel hardware; 1 would mean a Rosetta-translated shell.
          TRANSLATED="$(sysctl -n sysctl.proc_translated 2>/dev/null || echo absent)"
          echo "sysctl.proc_translated=$TRANSLATED"
          test "$TRANSLATED" != 1
          echo "Selected Xcode developer directory: $(xcode-select -p)"
          echo "HOST_TARGET=$HOST_TARGET" >> "$GITHUB_ENV"

      - name: Prepare ordinary CI Darwin Cargo fixture
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p trusted-server-release --target "$HOST_TARGET" --locked
          CARGO_FIXTURE_ROOT="$RUNNER_TEMP/release-cargo-fixture"
          JS_HANDOFF_ROOT="$RUNNER_TEMP/release-js-handoff"
          test ! -e "$JS_HANDOFF_ROOT"
          node scripts/release/tests/prepare-cargo-fixture.mjs "$CARGO_FIXTURE_ROOT" "target/$HOST_TARGET/debug/trusted-server-release"
          {
            echo "TS_RELEASE_CARGO_FIXTURE_ROOT=$CARGO_FIXTURE_ROOT"
            echo "TS_RELEASE_JS_HANDOFF_ROOT=$JS_HANDOFF_ROOT"
          } >> "$GITHUB_ENV"
          df -h "$RUNNER_TEMP"

      - name: Download the Linux JS handoff into a fresh directory
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0 (Node 24)
        with:
          name: release-js-handoff
          path: ${{ env.TS_RELEASE_JS_HANDOFF_ROOT }}

      - name: Prove Cargo build scripts and proc macros inherit denial (macOS)
        shell: bash
        run: |
          set -euo pipefail
          TEST_NAME=recipe::tests::full_macos::cargo_children_inherit_denial_macos
          TEST_LIST="$(mktemp)"
          trap 'rm -f "$TEST_LIST"' EXIT
          cargo test -p trusted-server-release --target "$HOST_TARGET" --locked "$TEST_NAME" -- --ignored --exact --list > "$TEST_LIST"
          awk '/: test$/ { count++ } END { if (count != 1) { print "Expected exactly one macOS Cargo denial fixture"; exit 1 } }' "$TEST_LIST"
          cargo test -p trusted-server-release --target "$HOST_TARGET" --locked "$TEST_NAME" -- --ignored --exact --nocapture
          cat "$TS_RELEASE_CARGO_FIXTURE_ROOT/cargo-denial-measurement.json"

      # The canonical build is gated: Mach-O acceptance with the measured SDK
      # and a relative debug map, the remap and final-path scans, planted
      # operator values absent and a native `ts --version` on the reviewed
      # host. The reproduction build is recorded, never a gate.
      - name: Build, inspect and start the macOS ts candidate and measure its reproduction (macOS)
        shell: bash
        run: |
          set -euo pipefail
          TEST_NAME=recipe::tests::macos_cli::macos_cli_candidate_builds_inspects_and_starts_cleanly
          TEST_LIST="$(mktemp)"
          trap 'rm -f "$TEST_LIST"' EXIT
          cargo test -p trusted-server-release --target "$HOST_TARGET" --locked "$TEST_NAME" -- --ignored --exact --list > "$TEST_LIST"
          awk '/: test$/ { count++ } END { if (count != 1) { print "Expected exactly one macOS CLI candidate fixture"; exit 1 } }' "$TEST_LIST"
          cargo test -p trusted-server-release --target "$HOST_TARGET" --locked "$TEST_NAME" -- --ignored --exact --nocapture
          cat "$TS_RELEASE_CARGO_FIXTURE_ROOT/macos-cli-candidate-measurement.json"
          df -h "$RUNNER_TEMP"

      - name: Preserve available macOS candidate measurements in the job log
        if: always()
        shell: bash
        run: |
          if [[ -n "${TS_RELEASE_CARGO_FIXTURE_ROOT:-}" ]]; then
            for report in cargo-denial-measurement.json macos-cli-candidate-measurement.json; do
              if [[ -f "$TS_RELEASE_CARGO_FIXTURE_ROOT/$report" ]]; then
                cat "$TS_RELEASE_CARGO_FIXTURE_ROOT/$report"
              fi
            done
          fi

      # Bounded: two minutes of wall time and the last 400 lines at most.
      - name: Show recent sandbox denials on failure
        if: failure()
        shell: bash
        run: |
          perl -e 'alarm 120; exec @ARGV or die "cannot run log: $!"' \
            /usr/bin/log show --last 15m --style compact --predicate 'sender=="Sandbox"' \
            | tail -n 400 || true

  test-typescript:
    name: vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/trusted-server-js/lib
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)
        with:
          persist-credentials: false

      - name: Retrieve Node.js version
        id: node-version
        working-directory: .
        run: echo "node-version=$(grep '^nodejs ' .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node 24)
        with:
          node-version: ${{ steps.node-version.outputs.node-version }}
          cache: 'npm'
          cache-dependency-path: crates/trusted-server-js/lib/package.json

      - name: Install dependencies
        run: npm ci

      - name: Build bundle
        run: npm run build

      - name: Run unit tests
        env:
          TRUSTED_SERVER__RELEASE_JS_TESTS: '1'
        run: npm test -- --run
