name: 'Run Tests'

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-rust:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Retrieve Rust version
        id: rust-version
        run: echo "rust-version=$(grep '^rust ' .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Retrieve Viceroy version
        id: viceroy-version
        # `.tool-versions` is the single source of truth so this workflow and
        # `.github/actions/setup-integration-test-env/action.yml` can't drift.
        run: echo "viceroy-version=$(grep '^viceroy ' .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Retrieve Node.js version
        id: node-version
        run: echo "node-version=$(grep '^nodejs ' .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.rust-version.outputs.rust-version }}
          target: wasm32-wasip1
          cache-shared-key: cargo-${{ runner.os }}

      - name: Cache Viceroy binary
        id: cache-viceroy
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/viceroy
          key: viceroy-${{ runner.os }}-v${{ steps.viceroy-version.outputs.viceroy-version }}

      - name: Install Viceroy
        if: steps.cache-viceroy.outputs.cache-hit != 'true'
        run: cargo install viceroy --version "${{ steps.viceroy-version.outputs.viceroy-version }}" --locked --force

      - name: Use Node.js for the served-seam contract
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.node-version }}

      - name: Run tests
        run: cargo test-fastly

      - name: Run tests (reusable-sandbox feature)
        run: cargo test-fastly-reuse

      - name: Run template cache ESI local harness
        run: BID_DELAY=3 ./scripts/template-cache-local-test.sh esi

      - name: Run inline control harness
        run: BID_DELAY=3 ./scripts/template-cache-local-test.sh inline

      - name: Run cache purge harness
        run: BID_DELAY=3 ./scripts/template-cache-local-test.sh purge

  test-axum:
    name: cargo test (axum native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Retrieve Rust version
        id: rust-version
        run: echo "rust-version=$(grep '^rust ' .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.rust-version.outputs.rust-version }}
          # wasm32-wasip1 is required by the "Verify Fastly WASM release
          # build" step below; the axum build and tests are native.
          target: wasm32-wasip1
          cache-shared-key: cargo-${{ runner.os }}

      - name: Read pinned Node.js version for CLI fixtures
        id: node-version
        shell: bash
        run: echo "version=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      - name: Build Axum adapter
        run: cargo build -p trusted-server-adapter-axum

      - name: Run Axum adapter tests
        run: cargo test-axum

      - name: Test template build digest inputs (native)
        run: cargo test -p trusted-server-core --test template_build_digest

      - name: Run HTML processor benchmarks (smoke)
        # -- --test runs each benchmark as a regular test (no timing harness) so CI stays fast
        run: cargo bench -p trusted-server-core --bench html_processor_bench -- --test

      - name: Run host-target CLI tests
        run: ./scripts/test-cli.sh

      # The codegen crate is not a default member and no adapter alias builds it,
      # so its tests only run if invoked explicitly on the host target.
      - name: Run host-target OpenRTB codegen tests
        run: |
          cargo test --package trusted-server-openrtb-codegen --target "$(rustc -vV | sed -n 's/host: //p')"

      - name: Verify Fastly WASM release build
        run: cargo build --package trusted-server-adapter-fastly --release --target wasm32-wasip1

  test-cloudflare:
    name: cargo check (cloudflare native + wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Retrieve Rust version
        id: rust-version
        run: echo "rust-version=$(grep '^rust ' .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Set up Rust toolchain (native + wasm32-unknown-unknown)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.rust-version.outputs.rust-version }}
          target: wasm32-unknown-unknown
          cache-shared-key: cargo-${{ runner.os }}

      - name: Check Cloudflare adapter (native host)
        run: cargo check -p trusted-server-adapter-cloudflare

      - name: Check Cloudflare adapter (wasm32-unknown-unknown)
        run: cargo check -p trusted-server-adapter-cloudflare --target wasm32-unknown-unknown --features cloudflare

      - name: Run Cloudflare adapter tests (native host)
        run: cargo test-cloudflare

  test-spin:
    name: cargo check/build/test (spin native + wasm32-wasip1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Retrieve Rust version
        id: rust-version
        run: echo "rust-version=$(grep '^rust ' .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Set up Rust toolchain (native + wasm32-wasip1)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.rust-version.outputs.rust-version }}
          target: wasm32-wasip1
          cache-shared-key: cargo-${{ runner.os }}

      - name: Check Spin adapter (native host)
        run: cargo check -p trusted-server-adapter-spin

      - name: Check Spin adapter (wasm32-wasip1)
        run: cargo check-spin

      - name: Build Spin adapter release WASM
        # Mirror the Fastly release-build overrides so the artifact embeds usable
        # settings instead of the trusted-server.toml placeholders, which startup
        # rejects (falling back to the generic 503 router). This proves the
        # documented Spin artifact can boot, not just compile.
        env:
          TRUSTED_SERVER__PUBLISHER__ORIGIN_URL: http://127.0.0.1:8080
          TRUSTED_SERVER__PUBLISHER__PROXY_SECRET: integration-test-proxy-secret
          TRUSTED_SERVER__EC__PASSPHRASE: integration-test-ec-secret-padded-32
          TRUSTED_SERVER__PROXY__CERTIFICATE_CHECK: 'false'
        run: cargo build --package trusted-server-adapter-spin --target wasm32-wasip1 --features spin --release

      - name: Run Spin adapter tests (native host)
        run: cargo test-spin

  test-parity:
    name: cargo test (cross-adapter parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Retrieve Rust version
        id: rust-version
        run: echo "rust-version=$(grep '^rust ' .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.rust-version.outputs.rust-version }}
          components: clippy, rustfmt
          cache-shared-key: cargo-${{ runner.os }}

      - name: Format check (parity test crate)
        run: cargo fmt --manifest-path crates/trusted-server-integration-tests/Cargo.toml -- --check

      - name: Run cross-adapter parity tests
        run: cargo test --manifest-path crates/trusted-server-integration-tests/Cargo.toml --test parity

      - name: Clippy (parity test crate)
        run: cargo clippy --manifest-path crates/trusted-server-integration-tests/Cargo.toml --all-targets -- -D warnings

  test-cli:
    name: cargo test (ts CLI, native)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Retrieve Rust version
        id: rust-version
        run: echo "rust-version=$(grep '^rust ' .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.rust-version.outputs.rust-version }}
          components: 'clippy, rustfmt'
          cache-shared-key: cargo-cli-${{ runner.os }}

      - name: Read pinned Node.js version for CLI fixtures
        id: node-version
        shell: bash
        run: echo "version=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      # No separate `cargo fmt` here: `trusted-server-cli` is a workspace member,
      # so the main `cargo fmt --all` job already formats it. Clippy still needs a
      # native run — the workspace clippy jobs are wasm/adapter-scoped and never
      # lint the CLI's host-only code, including platform-specific trust operations.
      - name: cargo clippy
        run: |
          cargo clippy --manifest-path crates/trusted-server-cli/Cargo.toml --target "$(rustc -vV | sed -n 's/host: //p')" --all-targets -- -D warnings

      - name: Set up Chrome for browser fixture tests
        if: runner.os == 'macOS'
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: cargo test
        if: runner.os == 'Linux'
        run: |
          cargo test --manifest-path crates/trusted-server-cli/Cargo.toml --target "$(rustc -vV | sed -n 's/host: //p')"

      - name: cargo test (browser fixtures)
        if: runner.os == 'macOS'
        run: ./scripts/test-cli.sh
        env:
          CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Install tools for real NSS trust tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libnss3-tools openssl

      - name: cargo test (real NSS trust)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$(rustc -vV | sed -n 's/host: //p')"
          COUNT="$(cargo test --manifest-path crates/trusted-server-cli/Cargo.toml --target "$TARGET" \
            --test proxy_trust_linux -- --ignored --list | awk '/: test$/ { count += 1 } END { print count + 0 }')"
          if [ "$COUNT" -eq 0 ]; then
            echo "No ignored real-NSS tests matched --test proxy_trust_linux" >&2
            exit 1
          fi
          cargo test --manifest-path crates/trusted-server-cli/Cargo.toml --target "$TARGET" \
            --test proxy_trust_linux -- --ignored

  # Ordinary source-built behavior checks; this matrix is not release qualification.
  test-release-native:
    name: cargo test (release tooling and JS prebuilt, native)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Read pinned tool versions
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          echo "rust=$(awk '$1 == "rust" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
          echo "node=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Use pinned Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node 24)
        with:
          node-version: ${{ steps.tools.outputs.node }}
          cache: npm
          cache-dependency-path: crates/trusted-server-js/lib/package-lock.json

      - name: Install JS dependencies
        working-directory: crates/trusted-server-js/lib
        run: npm ci

      # The runner's installed rustup bootstraps ordinary CI, not the release producer.
      - name: Install pinned native Rust toolchain
        env:
          RUST_VERSION: ${{ steps.tools.outputs.rust }}
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup override set "$RUST_VERSION"
          HOST_TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          test -n "$HOST_TARGET"
          echo "HOST_TARGET=$HOST_TARGET" >> "$GITHUB_ENV"

      - name: Guard and run all native release-tool tests
        shell: bash
        run: |
          set -euo pipefail
          TEST_LIST="$(mktemp)"
          trap 'rm -f "$TEST_LIST"' EXIT
          cargo test -p trusted-server-release --target "$HOST_TARGET" --all-features -- --list > "$TEST_LIST"
          awk '/: test$/ { count++ } END { if (count == 0) { print "No native release-tool tests selected"; exit 1 } print "Selected " count " native release-tool tests" }' "$TEST_LIST"
          cargo test -p trusted-server-release --target "$HOST_TARGET" --all-features
          cargo clippy -p trusted-server-release --target "$HOST_TARGET" --all-targets --all-features -- -D warnings
          cargo doc -p trusted-server-release --target "$HOST_TARGET" --no-deps --all-features

      - name: Prepare original-only full JS fixture (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p trusted-server-release --target "$HOST_TARGET" --locked
          FIXTURE_ROOT="$RUNNER_TEMP/release-js-original-fixture"
          node scripts/release/tests/prepare-js-fixture.mjs "$FIXTURE_ROOT" "target/$HOST_TARGET/debug/trusted-server-release"
          echo "TS_RELEASE_JS_FIXTURE_ROOT=$FIXTURE_ROOT" >> "$GITHUB_ENV"

      - name: Prove two fresh offline JS builds (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          # Optimize repeated whole-input hashes with test safety checks retained.
          CARGO_PROFILE_TEST_OPT_LEVEL: '2'
          CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
          CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
        run: |
          set -euo pipefail
          TEST_NAME=preparation::tests::full::real_two_fresh_js_builds
          TEST_LIST="$(mktemp)"
          trap 'rm -f "$TEST_LIST"' EXIT
          cargo test -p trusted-server-release --target "$HOST_TARGET" --locked "$TEST_NAME" -- --ignored --exact --list > "$TEST_LIST"
          awk '/: test$/ { count++ } END { if (count != 1) { print "Expected exactly one full JS execution fixture"; exit 1 } }' "$TEST_LIST"
          cargo test -p trusted-server-release --target "$HOST_TARGET" --locked "$TEST_NAME" -- --ignored --exact --nocapture
          cat "$TS_RELEASE_JS_FIXTURE_ROOT/js-execution-measurement.json"

      - name: Guard and run native JS prebuilt tests
        shell: bash
        run: |
          set -euo pipefail
          TEST_LIST="$(mktemp)"
          trap 'rm -f "$TEST_LIST"' EXIT
          cargo test -p trusted-server-js --target "$HOST_TARGET" --test release_prebuilt -- --list > "$TEST_LIST"
          awk '/: test$/ { count++ } END { if (count == 0) { print "No native JS prebuilt tests selected"; exit 1 } print "Selected " count " native JS prebuilt tests" }' "$TEST_LIST"
          cargo test -p trusted-server-js --target "$HOST_TARGET" --test release_prebuilt
          cargo clippy -p trusted-server-js --target "$HOST_TARGET" --all-targets --all-features -- -D warnings

  # Ordinary CI candidate evidence of the confined Cargo recipe; this job is
  # not release qualification (every measurement reports it as such).
  test-release-cargo-candidate:
    name: cargo test (confined release Cargo candidate, Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Optimize repeated whole-input hashes with test safety checks retained.
      CARGO_PROFILE_TEST_OPT_LEVEL: '2'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)
        with:
          persist-credentials: false
          # Full history: the fixtures clone this checkout, and source
          # authentication rejects a shallow repository (`.git/shallow`).
          fetch-depth: 0

      - name: Read pinned tool versions
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          echo "rust=$(awk '$1 == "rust" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
          echo "node=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Use pinned Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node 24)
        with:
          node-version: ${{ steps.tools.outputs.node }}
          cache: npm
          cache-dependency-path: crates/trusted-server-js/lib/package-lock.json

      # The runner's installed rustup bootstraps ordinary CI, not the release producer.
      - name: Install pinned native Rust toolchain with the Wasm target
        env:
          RUST_VERSION: ${{ steps.tools.outputs.rust }}
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup target add --toolchain "$RUST_VERSION" wasm32-wasip1
          rustup override set "$RUST_VERSION"
          HOST_TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          test -n "$HOST_TARGET"
          echo "HOST_TARGET=$HOST_TARGET" >> "$GITHUB_ENV"

      - name: Prepare ordinary CI JS and Cargo fixtures
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p trusted-server-release --target "$HOST_TARGET" --locked
          PRODUCER="target/$HOST_TARGET/debug/trusted-server-release"
          JS_FIXTURE_ROOT="$RUNNER_TEMP/release-js-original-fixture"
          CARGO_FIXTURE_ROOT="$RUNNER_TEMP/release-cargo-fixture"
          node scripts/release/tests/prepare-js-fixture.mjs "$JS_FIXTURE_ROOT" "$PRODUCER"
          node scripts/release/tests/prepare-cargo-fixture.mjs "$CARGO_FIXTURE_ROOT" "$PRODUCER"
          echo "TS_RELEASE_JS_FIXTURE_ROOT=$JS_FIXTURE_ROOT" >> "$GITHUB_ENV"
          echo "TS_RELEASE_CARGO_FIXTURE_ROOT=$CARGO_FIXTURE_ROOT" >> "$GITHUB_ENV"
          df -h "$RUNNER_TEMP"

      - name: Prove Cargo build scripts and proc macros inherit denial (Linux)
        shell: bash
        run: |
          set -euo pipefail
          TEST_NAME=recipe::tests::full::cargo_children_inherit_denial
          TEST_LIST="$(mktemp)"
          trap 'rm -f "$TEST_LIST"' EXIT
          cargo test -p trusted-server-release --target "$HOST_TARGET" --locked "$TEST_NAME" -- --ignored --exact --list > "$TEST_LIST"
          awk '/: test$/ { count++ } END { if (count != 1) { print "Expected exactly one Cargo denial fixture"; exit 1 } }' "$TEST_LIST"
          cargo test -p trusted-server-release --target "$HOST_TARGET" --locked "$TEST_NAME" -- --ignored --exact --nocapture
          cat "$TS_RELEASE_CARGO_FIXTURE_ROOT/cargo-denial-measurement.json"

      - name: Build the Fastly Wasm from a real JS handoff through the confined recipe (Linux)
        shell: bash
        run: |
          set -euo pipefail
          TEST_NAME=recipe::tests::full::real_js_handoff_to_fastly_cargo_build
          TEST_LIST="$(mktemp)"
          trap 'rm -f "$TEST_LIST"' EXIT
          cargo test -p trusted-server-release --target "$HOST_TARGET" --locked "$TEST_NAME" -- --ignored --exact --list > "$TEST_LIST"
          awk '/: test$/ { count++ } END { if (count != 1) { print "Expected exactly one confined Cargo build fixture"; exit 1 } }' "$TEST_LIST"
          cargo test -p trusted-server-release --target "$HOST_TARGET" --locked "$TEST_NAME" -- --ignored --exact --nocapture
          cat "$TS_RELEASE_CARGO_FIXTURE_ROOT/cargo-execution-measurement.json"

  test-typescript:
    name: vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/trusted-server-js/lib
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)
        with:
          persist-credentials: false

      - name: Retrieve Node.js version
        id: node-version
        working-directory: .
        run: echo "node-version=$(grep '^nodejs ' .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node 24)
        with:
          node-version: ${{ steps.node-version.outputs.node-version }}
          cache: 'npm'
          cache-dependency-path: crates/trusted-server-js/lib/package.json

      - name: Install dependencies
        run: npm ci

      - name: Build bundle
        run: npm run build

      - name: Run unit tests
        env:
          TRUSTED_SERVER__RELEASE_JS_TESTS: '1'
        run: npm test -- --run
