name: PBS example checks

on:
  push:
    branches: [main]
    paths:
      - 'deploy/pbs-example/**'
      - '.tool-versions'
      - '.github/workflows/pbs-example.yml'
  pull_request:
    paths:
      - 'deploy/pbs-example/**'
      - '.tool-versions'
      - '.github/workflows/pbs-example.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels that PR's superseded run. Each job
# then joins a per-author queue for that job (its own `concurrency` block), so
# one person opening many PRs runs one copy of each job at a time and cannot
# fill the runner pool ahead of everyone else. Queued jobs start in the order they began waiting; GitHub
# keeps up to 100 pending per queue and cancels arrivals past that. Every job
# has a timeout so a hung job cannot hold its queue for hours. Bot-authored
# PRs and non-PR events key on the run ID and never wait on a queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  local-checks:
    name: PBS Terraform and Compose checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-local-checks-${{ github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot' && github.event.pull_request.user.login || github.run_id }}
      queue: max
    env:
      TF_IN_AUTOMATION: 'true'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Terraform version
        id: terraform
        shell: bash
        run: echo "version=$(awk '$1 == "terraform" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform.outputs.version }}
          terraform_wrapper: false

      - name: Read pinned Node.js version
        id: node
        shell: bash
        run: echo "version=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Check Docker Compose prerequisite
        run: docker compose version

      # These suites use mocked providers and plan mode. No AWS credentials,
      # Terraform apply, image pulls, or container startup are needed.
      - name: Format and test Terraform root
        run: |
          terraform fmt -check -recursive deploy/pbs-example
          terraform -chdir=deploy/pbs-example init -backend=false -input=false -lockfile=readonly
          terraform -chdir=deploy/pbs-example validate
          terraform -chdir=deploy/pbs-example test -filter=tests/root_unit_test.tftest.hcl

      - name: Validate and test regional module
        run: |
          terraform -chdir=deploy/pbs-example/modules/regional init -backend=false -input=false -lockfile=readonly
          terraform -chdir=deploy/pbs-example/modules/regional validate
          terraform -chdir=deploy/pbs-example/modules/regional test -filter=tests/security_unit_test.tftest.hcl
          git diff --exit-code -- deploy/pbs-example/.terraform.lock.hcl deploy/pbs-example/modules/regional/.terraform.lock.hcl

      - name: Check runtime inputs and smoke wiring without starting containers
        run: |
          bash -n deploy/pbs-example/scripts/smoke-runtime.sh
          env -u NODE_OPTIONS -u NODE_PATH node deploy/pbs-example/scripts/test-smoke-runtime.mjs
