name: Release build and signing
on:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Read pinned Node version
        id: tools
        run: echo "node=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.tools.outputs.node }}
      - run: node --test scripts/release/phase1.test.mjs
      # Refuse a tag the publisher would reject before building and signing.
      - name: Refuse non-SemVer release tags
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e "
          import { isReleaseTag } from './scripts/release/publish.mjs'
          if (!isReleaseTag(process.env.RELEASE_TAG)) throw Error('Release tags must be vMAJOR.MINOR.PATCH[-PRERELEASE]')
          "
      # The publisher requires a lightweight tag at the built commit. Refuse an
      # annotated tag here, before signing writes public attestations for it.
      - name: Refuse annotated release tags
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.type + " " + .object.sha')" = "commit $GITHUB_SHA"
  build:
    needs: checks
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            package: trusted-server-adapter-fastly
            target: wasm32-wasip1
            asset: trusted-server-fastly.wasm
          - os: ubuntu-24.04
            package: trusted-server-cli
            target: x86_64-unknown-linux-gnu
            asset: ts-x86_64-unknown-linux-gnu
          - os: macos-15
            package: trusted-server-cli
            target: aarch64-apple-darwin
            asset: ts-aarch64-apple-darwin
          - os: macos-15-intel
            package: trusted-server-cli
            target: x86_64-apple-darwin
            asset: ts-x86_64-apple-darwin
          - os: ubuntu-24.04
            package: trusted-server-adapter-axum
            target: x86_64-unknown-linux-gnu
            asset: trusted-server-axum-x86_64-unknown-linux-gnu
          - os: ubuntu-24.04
            package: trusted-server-adapter-axum
            target: x86_64-unknown-linux-musl
            asset: trusted-server-axum-x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            package: trusted-server-adapter-axum
            target: aarch64-unknown-linux-gnu
            asset: trusted-server-axum-aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Read pinned toolchains
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          echo "node=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
          echo "rust=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.tools.outputs.node }}
      - name: Install the pinned Rust toolchain without build caches
        env:
          RUST_VERSION: ${{ steps.tools.outputs.rust }}
          BUILD_TARGET: ${{ matrix.target }}
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --target "$BUILD_TARGET"
      - name: Build and generate the build inventory in a clean environment
        shell: bash
        env:
          BUILD_PACKAGE: ${{ matrix.package }}
          BUILD_TARGET: ${{ matrix.target }}
          RELEASE_ASSET: ${{ matrix.asset }}
          SOURCE_COMMIT: ${{ github.sha }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          env -i PATH="$PATH" HOME="$HOME" \
            CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" \
            RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" \
            TMPDIR="${TMPDIR:-/tmp}" RUNNER_TEMP="$RUNNER_TEMP" \
            SOURCE_COMMIT="$SOURCE_COMMIT" RELEASE_VERSION="$RELEASE_VERSION" \
            bash scripts/release/phase1-build.sh "$BUILD_PACKAGE" "$BUILD_TARGET" "$RELEASE_ASSET"
      # Only the tag-triggered signing job reads these; a main push is a build
      # and smoke check.
      - uses: actions/upload-artifact@v6
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-${{ matrix.asset }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  sign:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.RELEASE_PUBLICATION_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        asset:
          [
            trusted-server-axum-x86_64-unknown-linux-gnu,
            trusted-server-axum-x86_64-unknown-linux-musl,
            trusted-server-axum-aarch64-unknown-linux-gnu,
            trusted-server-fastly.wasm,
            ts-aarch64-apple-darwin,
            ts-x86_64-apple-darwin,
            ts-x86_64-unknown-linux-gnu,
          ]
    steps:
      # Only fixed inline checks execute here; never checkout or execute build inputs.
      - uses: actions/download-artifact@v7
        with:
          name: release-${{ matrix.asset }}
          path: release-assets
      - name: Validate signing inputs and retain their digests
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          cd release-assets
          test "$(find . -mindepth 1 -maxdepth 1 | wc -l)" -eq 2
          for file in "$ASSET" "$ASSET.spdx.json"; do test -f "$file" && test ! -L "$file" && test -s "$file" || exit 1; done
          sha256sum "$ASSET" "$ASSET.spdx.json" > ../inputs.sha256
      - name: Attest SLSA build provenance
        id: provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            release-assets/${{ matrix.asset }}
            release-assets/${{ matrix.asset }}.spdx.json
      - name: Attest the binary's SPDX SBOM
        id: sbom
        uses: actions/attest@v4
        with:
          subject-path: release-assets/${{ matrix.asset }}
          sbom-path: release-assets/${{ matrix.asset }}.spdx.json
      - name: Retain only this run's real bundles and signed-input digests
        env:
          ASSET: ${{ matrix.asset }}
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum --check ../inputs.sha256)
          test -s "$PROVENANCE"
          test -s "$SBOM"
          mkdir signed-assets
          cp "$PROVENANCE" "signed-assets/$ASSET.provenance.sigstore.json"
          cp "$SBOM" "signed-assets/$ASSET.sbom.sigstore.json"
          cp inputs.sha256 signed-assets/SHA256SUMS
          (cd signed-assets && sha256sum "$ASSET.provenance.sigstore.json" "$ASSET.sbom.sigstore.json" >> SHA256SUMS)
      - uses: actions/upload-artifact@v6
        with:
          name: signed-${{ matrix.asset }}
          path: signed-assets/*
          if-no-files-found: error
          retention-days: 7
