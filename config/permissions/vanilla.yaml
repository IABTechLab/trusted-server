# The place tree. Each node names the `group` that applies there, and may name
# the `jurisdiction` too, either as a plain group name or as a block with a
# `group:` line and the rest beside it. See the header for the full format.
rules:
  # The whole world. `group` is the baseline for a visitor whose place the geo
  # provider could not resolve, and `jurisdiction` is the consent handling for
  # that same visitor. Both are required, and every country below inherits the
  # jurisdiction unless it names its own.
  group: gdpr-eu
  jurisdiction: gdpr

  # European Union (27). Each inherits the top node's gdpr jurisdiction.
  AT: gdpr-eu
  BE: gdpr-eu
  BG: gdpr-eu
  HR: gdpr-eu
  CY: gdpr-eu
  CZ: gdpr-eu
  DK: gdpr-eu
  EE: gdpr-eu
  FI: gdpr-eu
  FR: gdpr-eu
  DE: gdpr-eu
  GR: gdpr-eu
  HU: gdpr-eu
  IE: gdpr-eu
  IT: gdpr-eu
  LV: gdpr-eu
  LT: gdpr-eu
  LU: gdpr-eu
  MT: gdpr-eu
  NL: gdpr-eu
  PL: gdpr-eu
  PT: gdpr-eu
  RO: gdpr-eu
  SK: gdpr-eu
  SI: gdpr-eu
  ES: gdpr-eu
  SE: gdpr-eu

  # European Economic Area (non-EU): GDPR applies through the EEA agreement.
  IS: gdpr-eu
  LI: gdpr-eu
  NO: gdpr-eu

  # United Kingdom, which keeps the GDPR jurisdiction under its own regime.
  GB: gdpr-uk

  # Australia, where no GDPR or US state law applies.
  AU:
    group: us-opt-out
    jurisdiction: non-regulated

  # United States. Every state follows this country node until a region under it
  # says otherwise, so a state appears below only where its own law applies. The
  # regions listed are the states with an active comprehensive privacy law, each
  # naming `us-state` so the consent gates treat the visitor as covered by it. A
  # region may also carry a `permissions:` map to vary single Data Uses on top of
  # its group, for example:
  #   CA:
  #     group: us-opt-out
  #     jurisdiction: us-state
  #     permissions:
  #       advertising_marketing.first_party.targeted: denied
  # Each `permissions` entry maps a Data Use to granted, requires_signal, or
  # denied. Or name a stricter group.
  US:
    group: us-opt-out
    jurisdiction: non-regulated
    # California.
    CA:
      group: us-opt-out
      jurisdiction: us-state
    # Virginia.
    VA:
      group: us-opt-out
      jurisdiction: us-state
    # Colorado.
    CO:
      group: us-opt-out
      jurisdiction: us-state
    # Connecticut.
    CT:
      group: us-opt-out
      jurisdiction: us-state
    # Utah.
    UT:
      group: us-opt-out
      jurisdiction: us-state
    # Montana.
    MT:
      group: us-opt-out
      jurisdiction: us-state
    # Oregon.
    OR:
      group: us-opt-out
      jurisdiction: us-state
    # Texas.
    TX:
      group: us-opt-out
      jurisdiction: us-state
    # Florida.
    FL:
      group: us-opt-out
      jurisdiction: us-state
    # Delaware.
    DE:
      group: us-opt-out
      jurisdiction: us-state
    # Iowa.
    IA:
      group: us-opt-out
      jurisdiction: us-state
    # Nebraska.
    NE:
      group: us-opt-out
      jurisdiction: us-state
    # New Hampshire.
    NH:
      group: us-opt-out
      jurisdiction: us-state
    # New Jersey.
    NJ:
      group: us-opt-out
      jurisdiction: us-state
    # Tennessee.
    TN:
      group: us-opt-out
      jurisdiction: us-state
    # Minnesota.
    MN:
      group: us-opt-out
      jurisdiction: us-state
    # Maryland.
    MD:
      group: us-opt-out
      jurisdiction: us-state
    # Indiana.
    IN:
      group: us-opt-out
      jurisdiction: us-state
    # Kentucky.
    KY:
      group: us-opt-out
      jurisdiction: us-state
    # Rhode Island.
    RI:
      group: us-opt-out
      jurisdiction: us-state

# How each session signal maps onto Data Uses. The permission engine reads this,
# so no signal-to-permission policy lives in the code. For each Data Use a signal
# produces a grant or a revoke, which the resolver then applies against the group
# baseline above (a grant sets a `requires_signal` Data Use, a revoke drops a
# `granted` one, and `denied` always wins so no signal can set it).
signals:
  # A present TCF v2 record (a standalone TC string, or the EU TCF section of a
  # GPP string). With authoritative true, each listed TCF purpose grants the
  # Data Use it maps to when the record consents to that purpose, and revokes it
  # otherwise; with authoritative false the record is ignored. The flag governs
  # only the TCF record's own grants and revokes: an opt-out signal below always
  # suppresses the Data Uses it revokes, even alongside a consenting TCF record,
  # because an explicit opt-out is never overridden by another signal. This is
  # the interim home for the purpose to Data Use mapping, and a purpose may
  # grant one Data Use or a list of them. Once the IAB Privacy Taxonomy tcf
  # column is finalized (fideslang) that becomes the single source and this
  # block is dropped.
  tcf:
    authoritative: true
    purposes:
      1: necessary.operations.storage
      2:
        - advertising_marketing.first_party.contextual
        - advertising_marketing.frequency_capping
        - advertising_marketing.negative_targeting
      3: advertising_marketing.profiling
      4:
        - advertising_marketing.first_party.targeted
        - advertising_marketing.third_party.targeted
      5: advertising_marketing.personalize.profiling
      6:
        - advertising_marketing.personalize.content
        - advertising_marketing.personalize.system
        - functional.personalization
      7:
        - analytics.ad_reporting.measure_ad_performance
        - analytics.ad_reporting.ad_delivery_and_targeting
        - analytics.ad_reporting.ad_viewability
      8: analytics.ad_reporting.content_performance
      9:
        - analytics.ad_reporting.market_research
        - analytics.ad_reporting.campaign_insights
      10: necessary.operations.improve
      11: select-basic-content
  # US-style opt-out of sale or sharing. It applies when any listed source is
  # set, and it suppresses the Data Uses it revokes even when a TCF record
  # consents to them. The list below models the US state opt-out scope, being
  # sale, sharing, targeted advertising, and device storage as the
  # conservative reading, so an opted-out visitor gets no Edge Cookie
  # written and no identifier shared, whilst contextual advertising and
  # measurement continue after an opt-out. A deployer can widen the list, or write `revokes: all` to drop
  # every granted Data Use. An opt-out suppresses use for the request; it is
  # never a destructive withdrawal of an already-issued identifier.
  us_opt_out:
    sources: [gpc, gpp_sale_opt_out, us_privacy_opt_out]
    revokes:
      - necessary.operations.storage
      - disclosure.sale
      - disclosure.share
      - disclosure.third_party_sale
      - advertising_marketing.first_party.targeted
      - advertising_marketing.third_party.targeted
      - advertising_marketing.profiling
