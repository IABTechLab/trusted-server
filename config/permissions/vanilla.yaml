    analytics.reporting.system: granted
    analytics.ad_reporting.ad_fraud_detection: granted
    advertising_marketing.serving: granted
    # The modeled ad-tech Data Uses. Each maps to a TCF purpose in `signals`
    # below, so a consent record grants it and an absent consent revokes it.
    necessary.operations.storage: granted
    advertising_marketing.first_party.contextual: requires_signal
    advertising_marketing.frequency_capping: requires_signal
    advertising_marketing.negative_targeting: requires_signal
    advertising_marketing.profiling: requires_signal
    advertising_marketing.first_party.targeted: requires_signal
