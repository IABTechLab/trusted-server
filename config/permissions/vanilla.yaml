    disclosure.third_party_sale: denied
    # Umbrella Data Uses stay denied so every grant is named at the specific
    # level, and a reviewer sees exactly what the policy permits.
    advertising_marketing: denied
    advertising_marketing.communications: denied
    advertising_marketing.first_party: denied
    advertising_marketing.personalize: denied
    advertising_marketing.third_party: denied
    analytics: denied
    analytics.ad_reporting: denied
    analytics.reporting: denied
    disclosure: denied
