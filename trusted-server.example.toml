[[handlers]]
path = "^/_ts/admin"
username = "admin"
password = "replace-with-admin-password-32-bytes"

[publisher]
domain = "example.com"
cookie_domain = ".example.com"
origin_url = "https://origin.example.com"
# Optional: override outbound Host header while connecting to origin_url.
# origin_host_header_override = "www.example.com"
proxy_secret = "change-me-proxy-secret"

# Optional: trust a fronting CDN's reader IP only when the same request also
# supplies the matching shared secret. The front door must set both headers on
# requests it sends here and remove client-supplied copies on its other routes.
# Fastly-only; see docs/guide/fastly.md for the required front-door setup.
# [trusted_client_ip]
# ip_header = "x-ts-client-ip"
# auth_header = "x-ts-client-ip-auth"
# shared_secret = "replace-with-a-random-shared-secret"

[ec]
passphrase = "trusted-server-placeholder-secret"
ec_store = "ec_identity_store"
pull_sync_concurrency = 3
# cluster_trust_threshold = 10
# cluster_recheck_secs = 3600

# Example partner configuration. Replace the token before validating/pushing.
# [[ec.partners]]
# name = "Example Partner"
# source_domain = "partner.example.com"
# OpenRTB agent type; vendor-specific values are supported (PAIR uses 571187).
# openrtb_atype = 3
# bidstream_enabled = true
# api_token = "replace-with-partner-api-token-32-bytes-minimum"
# batch_rate_limit = 60
# pull_sync_enabled = false

# Custom headers to include in every response.
# [response_headers]
# X-Robots-Tag = "noindex"

[request_signing]
enabled = false
config_store_id = "app_config"
secret_store_id = "secrets"

[integrations.prebid]
enabled = false
server_url = "https://prebid.example.com/openrtb2/auction"
timeout_ms = 1000
bidders = []
debug = false
client_side_bidders = []
# Keep selected GAM inventory out of Trusted Server's Prebid refresh auctions.
# Matching slots still refresh through GAM.
# excluded_gam_ad_unit_path_suffixes = ["/trackingonly"]
# Runtime bundle metadata. Set these after running `ts prebid bundle` and uploading the bundle.
# external_bundle_url = "https://assets.example.com/prebid/trusted-prebid-<sha256>.js"
# external_bundle_sha256 = "<manifest sha256>"
# external_bundle_sri = "<manifest sri>"

[integrations.prebid.bundle]
adapters = ["rubicon"]
# user_id_modules = ["sharedIdSystem"]

[integrations.nextjs]
enabled = false
rewrite_attributes = ["href", "link", "siteBaseUrl", "siteProductionDomain", "url"]
max_combined_payload_bytes = 10485760

[integrations.testlight]
enabled = false
endpoint = "https://testlight.example.com/openrtb2/auction"
timeout_ms = 1200
rewrite_scripts = true

[integrations.didomi]
enabled = false
sdk_origin = "https://sdk.example.com"
api_origin = "https://api.example.com"

[integrations.sourcepoint]
enabled = false
rewrite_sdk = true
cdn_origin = "https://cdn.example.com"
cache_ttl_seconds = 3600

[integrations.permutive]
enabled = false
organization_id = ""
workspace_id = ""
project_id = ""
api_endpoint = "https://api.example.com"
secure_signals_endpoint = "https://secure-signals.example.com"

[integrations.lockr]
enabled = false
app_id = ""
api_endpoint = "https://identity.example.com"
sdk_url = "https://identity.example.com/trusted-server.js"
cache_ttl_seconds = 3600
rewrite_sdk = true

[integrations.datadome]
enabled = false
sdk_origin = "https://sdk.example.com"
api_origin = "https://api.example.com"
cache_ttl_seconds = 3600
rewrite_sdk = true

[integrations.gpt]
enabled = false
# Keep this leaf present so the environment override can apply; the overlay
# cannot create a missing configuration leaf. Attribution stays off until enabled.
gam_attribution_enabled = false
script_url = "https://ads.example.com/gpt.js"
cache_ttl_seconds = 3600
rewrite_script = true

[integrations.gpt_diagnostics]
enabled = false

[proxy]
# certificate_check = true
# Required for integrations.prebid.external_bundle_url and first-party proxy redirects.
# allowed_domains = ["ads.example.com", "assets.example.com", "*.cdn.example.com"]

# Static/rehosted asset cache policies are operator-controlled. Disabled rules
# do not match, and matcher/policy validation is deferred until they are enabled;
# IDs must still be nonempty and unique. Keep rules disabled unless the matched
# publisher paths are known content-addressed.
# [[cache.asset_rules]]
# id = "nextjs-static"
# enabled = false
# preset = "nextjs-static"
# visibility = "public"
# browser_ttl_seconds = 31536000
# edge_ttl_seconds = 31536000
# immutable = true
#
# [[cache.asset_rules]]
# id = "publisher-fingerprinted-assets"
# enabled = false
# path_globs = ["/assets/**/*.js", "/assets/**/*.css", "/assets/**/*.png", "/assets/**/*.webp"]
# Immutable custom rules require an unambiguous fingerprint_style, either
# "hex" or "esbuild-base32". "vite-base64-url" is allowed only for
# non-immutable rules because ordinary filenames can match its shape.
# fingerprint_style = "hex"
# visibility = "public"
# browser_ttl_seconds = 31536000
# edge_ttl_seconds = 31536000
# immutable = true

[auction]
enabled = false
# Defaults to true. Keep this leaf present when using the EdgeZero v0.0.4
# environment override. Set false to return unre-written winning-bid adm,
# skipping proxy/click URL conversion and creative TSJS injection.
# Sanitization is controlled separately by `sanitize_creatives` below.
# Restore and push true before an older-binary rollback.
rewrite_creatives = true
# Strip executable markup (script/object/embed/form/...) from winning-bid adm,
# removing those elements together with their inner content.
#
# Defaults to false: executable markup is preserved rather than stripped. Note
# this is not "untouched" — with the default `rewrite_creatives = true` above,
# eligible URLs are still rewritten to first-party endpoints, bidder `<base>`
# elements are removed, and the creative TSJS runtime is injected.
#
# Enable whenever creatives can render in a context that shares the publisher's
# origin — it is the primary defence there.
#
# Leave disabled when creatives render in a foreign-origin frame (for example the
# Prebid Universal Creative inside the ad server's iframe), where the markup cannot
# reach the publisher origin. Sanitization removes script-based creatives entirely,
# so enabling it on a script-heavy demand stack silently blanks those slots.
sanitize_creatives = false
providers = []
timeout_ms = 2000
allowed_context_keys = []

[integrations.aps]
enabled = false
account_id = "example-aps-account-id"
timeout_ms = 1000
# Include raw APS request/response data in /auction metadata on test sites only.
debug = false
# Set both when the deployment hostname differs from APS-authorized inventory.
# inventory_domain = "publisher.example"
# inventory_page_origin = "https://www.publisher.example"
# Script creatives require separate security validation before opt-in.
allow_script_creatives = false

[integrations.google_tag_manager]
enabled = false
container_id = "GTM-EXAMPLE"
upstream_url = "https://tags.example.com"

[integrations.adserver_mock]
enabled = false
endpoint = "https://adserver.example.com/mediate"
timeout_ms = 1000

[integrations.adserver_mock.context_query_params]
example_segments = "segments"

[debug]
ja4_endpoint_enabled = false

# NEVER enable in production. Injects an auction dump before `</body>`.
# "redacted" validates response metadata but still includes bid-level fields
# and creative previews; it is not a fully anonymized dump.
auction_html_comment = false

[debug.auction_html_comment_options]
include_provider_responses = true
include_mediator_response = true
include_bids = true
# Subset of the fixed validated metadata keys shown in "redacted" (and, for
# these three keys, "upstream") mode. Any other key fails config load.
metadata_keys = ["error_type", "http_status", "message"]
# "redacted" (default), "upstream", or "full".
# "upstream" exposes six untyped provider diagnostic values that may contain
# request or identity data. "full" additionally exposes all response metadata
# and untruncated creatives. Never use either sensitive mode in production.
verbosity = "redacted"
# "compact" (default) or "pretty". Pretty formats only the outer dump;
# JSON request/response bodies remain strings exactly as captured.
format = "compact"

[creative_opportunities]
# Set to false to disable server-side ad templates while retaining slot definitions
# and direct POST /auction callers. Structurally inactive templates use the
# browser-only Cache-Control: private, max-age=60 policy; this setting is one cause.
# Origin private/no-store policies and bot, prefetch, or consent-denied requests
# retain their origin policy. CDN-specific cache headers remain unchanged.
# Before rolling back to a binary that predates this setting, restore true, re-push
# and finalize the config first.
enabled = true
gam_network_id = "123456789"
# FCP is not affected by this value — body content above </body> has already
# streamed and painted before the hold begins. What this caps is the slip on
# DOMContentLoaded and window.load. Worst case: a cache-hit page where origin
# drains in <50 ms but the auction runs to the limit. 500 ms is the recommended
# default; raise only if your SSPs need more headroom and your analytics confirm
# the DCL slip is acceptable.
auction_timeout_ms = 500  # override via TRUSTED_SERVER__CREATIVE_OPPORTUNITIES__AUCTION_TIMEOUT_MS
price_granularity = "dense"

# Initial-page delivery mode. `inline` is the default and current production
# behaviour. `esi` is an opt-in Fastly Core Cache experiment. The shared template cache stores an inert
# comment; a cold miss validates the repaired ESI parser in a private working
# copy, while warm hits use the streaming byte seam. No fragment HTTP request or
# publisher-controlled ESI is allowed.
# This and the three cache-safety keys below belong in this
# [creative_opportunities] table. See docs/guide/configuration.md before enabling.
# assembly_mode = "inline"

# Request headers (other than Accept-Encoding, whose supported content coding TS
# decodes to identity before storage) that the origin may name in Vary. Values
# are keyed losslessly and the origin response is checked for drift before
# storage. Every emitted Vary name must be covered or storage is refused. Never
# include Cookie: shared templates must be reader-neutral.
# template_cache_vary = [
#   "rsc",
#   "next-router-state-tree",
#   "next-router-prefetch",
#   "next-router-segment-prefetch",
# ]

# Safety ceiling for one reader-neutral shared template, in seconds. The origin must
# still authorize shared freshness; TS uses the smaller of that remaining edge
# freshness and this value. Defaults to 60. Valid range: 1 through 86400.
# template_cache_max_age_seconds = 1200  # override via TRUSTED_SERVER__CREATIVE_OPPORTUNITIES__TEMPLATE_CACHE_MAX_AGE_SECONDS

# Unsafe unless independently verified at the publisher origin. The default
# excludes every cookie-bearing request from the template cache. Set true only when origin HTML
# is byte-independent of Cookie; an origin Vary: Cookie is still refused.
# origin_is_cookie_independent = false

# `gam_unit_path` may be a template. Supported placeholders:
#   {network_id} -> gam_network_id
#   {slot_id}    -> the slot's id
#   {section}    -> a path segment of the request, sanitized to [A-Za-z0-9_-];
#                   `section_segment` picks which one, `section_root` covers
#                   paths that have no such segment.
# A template with no placeholders (or an absent gam_unit_path) keeps the old
# behavior: verbatim path, or the default `/<network_id>/<slot_id>`.
#
# `section_root` is REQUIRED when any slot's template uses {section}. There is no
# default — the home-section name is publisher-specific. Must be [A-Za-z0-9_-]+.
#
# `section_segment` is the 0-based index of the segment that names the section;
# it defaults to 0 (the first segment). Set it to 1 for locale-prefixed URLs, so
# "/en/news/article" resolves to "news" instead of "en".
#
# Both are left commented out: no slot below uses {section}, and an unused key
# still ships in the pushed config blob.
# section_root = "home"
# section_segment = 0

# No slot templates are enabled in the checked-in default config. Add
# `[[creative_opportunities.slot]]` entries via private config or override the
# entire array via:
# TRUSTED_SERVER__CREATIVE_OPPORTUNITIES__SLOT='[{"id":"...","gam_unit_path":"...",...}]'
#
# Example templated slot (one rule serves every section). Uncomment
# `section_root` above when enabling it. Note that "/news/*" does not match
# "/news" — list the section landing page separately.
# [[creative_opportunities.slot]]
# id = "ad-header"
# gam_unit_path = "/{network_id}/example/{section}"
# page_patterns = ["/", "/news", "/news/*", "/reviews", "/reviews/*"]
# formats = [{ width = 728, height = 90 }]
#   "/"          -> /123456789/example/home
#   "/news"      -> /123456789/example/news
#   "/news/x"    -> /123456789/example/news
#   "/reviews/y" -> /123456789/example/reviews
