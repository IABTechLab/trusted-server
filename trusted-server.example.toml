# =============================================================================
# Trusted Server application configuration template
# =============================================================================
#
# This is the source-controlled starting point for an operator-owned
# `trusted-server.toml`. Copy it (`ts config init`), fill in the required
# values, and push it (`ts config push`) as an EdgeZero app-config blob.
#
# Only two sections are REQUIRED for the server to start and pass validation:
#   1. [[handlers]] covering /_ts/admin  (admin authentication)
#   2. [publisher]                       (domain + origin)
#
# Edge Cookie identity is optional and stays off until an [ec] provider is
# selected, so no identity secret is needed to start. See the Edge Cookie
# section below.
#
# Everything below those is OPTIONAL. Most optional blocks are commented out, so
# uncomment and edit one to switch it on. All example hosts use `example.com`,
# so replace them with your real endpoints in your private config, not in this
# template.
#
# Everything this deployment can switch on is a provider, and every provider
# type is written the same way:
#
#   [<type>]
#   provider = "<name>"   # a string where one runs, a list where several run
#
#   [<type>.<name>]       # only when that provider has settings
#   setting = "value"
#
# The types are ec, geo, device, permission_signal, demand, adserver and
# integration. A settings table its type's `provider` does not name refuses
# startup, so there is no stale block to misread. The complete rules, and what
# is checked when, are in docs/guide/configuration-rules.md.
#
# `TRUSTED_SERVER__` env vars can override values when the `ts` CLI builds and
# validates this config for push (e.g. TRUSTED_SERVER__PUBLISHER__DOMAIN=...;
# nested keys use `__`). The overlay only replaces SCALAR leaves that already
# exist in the parsed TOML: a commented-out or absent key is silently ignored,
# and arrays or tables must be edited in TOML directly, not via env vars. The
# deployed runtime reads the pushed config blob, so these env vars do not change
# live behavior on their own.
# =============================================================================


# -----------------------------------------------------------------------------
# REQUIRED - Admin authentication
# -----------------------------------------------------------------------------
# HTTP Basic-auth handler(s). At least one handler whose `path` regex covers
# the /_ts/admin endpoints is mandatory; startup fails without it. Each handler
# needs a non-placeholder username/password (deploy validation rejects the
# sample password below).
[[handlers]]
# Regex matched against the request path. This one guards the admin surface.
path = "^/_ts/admin"
username = "admin"
password = "handler_password"

# You can add more handlers to basic-auth-protect other path prefixes. The
# sample password below is a known placeholder that deploy validation rejects,
# so it forces a real secret before push:
# [[handlers]]
# path = "^/secure"
# username = "user"
# password = "replace-with-admin-password"


# -----------------------------------------------------------------------------
# REQUIRED - Publisher / origin
# -----------------------------------------------------------------------------
[publisher]
# Public domain Trusted Server is fronting.
domain = "example.com"
# Cookie scope for first-party identity cookies (leading dot = include subdomains).
cookie_domain = ".example.com"
# Upstream origin to proxy publisher content from. No trailing slash.
origin_url = "https://origin.example.com"
# Secret Store key for the HMAC secret used to sign first-party proxy URLs.
proxy_secret = "publisher_proxy_secret"
# Optional: override the outbound Host header sent to origin_url.
# origin_host_header_override = "www.example.com"
# Optional: max bytes buffered when a response is post-processed in full (HTML
# rewriting/injection) instead of streamed. Default 16 MiB; larger responses
# return 502. Raise for deployments serving very large publisher pages.
# max_buffered_body_bytes = 16777216  # 16 MiB


# -----------------------------------------------------------------------------
# OPTIONAL - Edge Cookie (EC) identity
# -----------------------------------------------------------------------------
[ec]
# Edge Cookie identity is OFF by default. With no provider selected, Trusted
# Server runs statelessly and generates no Edge Cookie. Activate one by
# uncommenting the selector below, together with that provider's own
# [ec.<name>] table when it has settings (a table the selector does not name
# is rejected at startup). Deployment tooling can merge a
# TRUSTED_SERVER__EC__PROVIDER environment value into the published
# configuration before it is loaded, and the running server itself reads its
# settings from the platform config store rather than the environment. The
# built-in hmac provider is host-neutral, and a vendor provider ships in its
# own crate that the adapter composes in.
# provider = "hmac"
# KV store that persists EC identity state. This is the physical store name
# bound per adapter (e.g. `ec_identity_store` in fastly.toml); edgezero.toml's
# logical KV id is `trusted_server_kv`.
ec_store = "ec_identity_store"
# Extra origins allowed to POST the client resolve endpoint. The endpoint
# always accepts https://<publisher.domain> and nothing else by default. List
# further origins here if the pages that resolve identity are served from
# another origin, www being the common case. Each entry is a serialized origin
# (RFC 6454) compared by the same-origin test, so the scheme, host and port all
# have to match, and a subdomain is never accepted just for being a subdomain.
# resolve_allowed_origins = ["https://www.example.com"]
# Max concurrent partner pull-sync requests.
pull_sync_concurrency = 3
# Optional cluster-heuristic tuning (defaults shown):
# cluster_trust_threshold = 10    # entries with cluster_size <= this are individual users
# cluster_recheck_secs = 3600     # re-evaluate cluster_size after this many seconds

# Built-in HMAC provider table. Uncomment it together with the
# `provider = "hmac"` selector above. `passphrase` names the Secret Store key
# holding the secret used to derive EC identifiers. That secret must be
# >= 32 bytes and non-placeholder in production. Provision referenced keys in
# trusted_server_secrets before validating/pushing.
# [ec.hmac]
# passphrase = "ec_passphrase"

# A table can name the implementation it configures, which makes the table's
# own name a label of your choosing. The same provider could therefore be
# selected as `provider = "primary"` and configured in the table below
# instead, which is how a deployment gives a provider a name that means
# something to the people running it.
# [ec.primary]
# implementation = "hmac"
# passphrase = "ec_passphrase"

# Built-in host-signal provider table. Creates the identifier from the host's
# TLS JA4 and HTTP/2 signals together with the client IP, so it needs a host
# that supplies those signals (Fastly does). Uncomment it together with
# `provider = "host_signals"` above, and give it its own secret on the same
# terms as the hmac table.
# [ec.host_signals]
# passphrase = "ec_host_signals_passphrase"

# Example partner configuration. Provision referenced keys in
# trusted_server_secrets before validating/pushing.
# [[ec.partners]]
# name = "Example Partner"
# source_domain = "partner.example.com"
# OpenRTB source.atype (default 3); vendor-specific values are supported
# (PAIR uses 571187).
# openrtb_atype = 3
# include this partner's UIDs in auction user.eids
# bidstream_enabled = true
# Only for inbound identify or batch-sync API access:
# api_token = "partner_api_token"
# Required when pull sync is enabled:
# ts_pull_token = "partner_ts_pull_token"
# batch_rate_limit = 60      # max batch-sync requests/min (default 60)
# pull_sync_enabled = false  # default false

# Which module resolves location. Leave the whole section out to keep the
# host's own lookup, which is what every adapter ships with today.
# [geo]
# `none` resolves no location at all, or name a registered module that declares
# a geo provider to have that module resolve location instead of the host.
# provider = "none"


# =============================================================================
# OPTIONAL - Core features (disabled/omitted by default)
# =============================================================================

# Device-detection provider. Selects how a request is classified into device
# signals (browser/bot gating). Default "builtin" classifies from the User-Agent
# alone and makes no host call, so a default deployment stays host-neutral. The
# opt-in "fastly" provider adds the host's TLS/H2 signals to the gate.
# Override at deployment with TRUSTED_SERVER__device__provider.
# [device]
# provider = "builtin"   # or "fastly" to add TLS/H2 signal evidence

[geo]
# Geo / IP intelligence provider. No provider is the default: Trusted Server
# resolves no geolocation and makes no host geo call, so a default deployment is
# not tied to any host geo service. Opt into the host lookup with
# provider = "platform". Override with TRUSTED_SERVER__geo__provider.
# provider = "platform"
#
# The permission baseline for a request the geo provider leaves unmatched
# (and, with no geo provider, for every request) is the top of the rules tree
# in the permissions.yaml compiled into the build (the repository sample is
# config/permissions/sample.yaml). Edit that file to
# change it.
#
# With no geo provider, every request is treated as that top node, so a
# visitor from another jurisdiction receives its permission rules. A
# deployment that runs an Edge Cookie provider without a geo provider must
# acknowledge that by uncommenting the line below, or select a geo provider
# instead.
# assume_single_jurisdiction = true

# Custom headers added to every response (e.g. X-Robots-Tag: noindex).
# [response_headers]
# X-Robots-Tag = "noindex"

# Sign outbound OpenRTB/API requests. These are platform management-API store
# IDs used for key-rotation WRITES; the runtime reads keys from fixed store names
# (`jwks_store` / `signing_keys`), not these. To keep signing OFF, leave this
# whole block commented out. If you uncomment it - even with `enabled = false` -
# both store IDs are required and must be REAL values: the key rotate/deactivate
# admin routes read them regardless of `enabled`, so deploy validation rejects
# the placeholders below (replace them before pushing).
# [request_signing]
# enabled = false
# config_store_id = "<management-config-store-id>"
# secret_store_id = "<management-secret-store-id>"

# First-party HTML/CSS rewriting controls.
# [rewrite]
# Domains left as-is (not proxied/rewritten). Supports "*.example.com" wildcards.
# exclude_domains = ["*.cdn.example.com"]

# Trust a fronting CDN's reader IP only when the same request also supplies
# the matching shared secret. The front door must set both headers on requests
# it sends here and remove client-supplied copies on its other routes.
# `shared_secret` is a key in trusted_server_secrets, not the credential itself.
# Fastly-only; see docs/guide/fastly.md for the required front-door setup.
# [trusted_client_ip]
# ip_header = "x-ts-client-ip"
# auth_header = "x-ts-client-ip-auth"
# shared_secret = "trusted_client_ip_shared_secret"

# Tester-cookie endpoints: GET /_ts/set-tester sets ts-tester=true and
# GET /_ts/clear-tester clears it on publisher.cookie_domain.
# [tester_cookie]
# enabled = false

# Consent forwarding. All values below are the defaults, so uncomment one to
# override it.
# [consent]
# mode = "interpreter"            # "interpreter" (decode + forward) or "proxy" (raw passthrough)
# check_expiration = true         # check TCF consent freshness
# max_consent_age_days = 395      # max age before consent is treated as expired (~13 months)
#
# Which places fall under GDPR, and which US states have a comprehensive
# privacy law, are no longer listed here. They are the `jurisdiction` values in
# the permissions.yaml rules tree, so one file states the policy for both the
# permission baseline and the consent handling.
#
# [consent.us_privacy_defaults]
# notice_given = true             # has the publisher shown CCPA notice?
# lspa_covered = false            # is the publisher subject to LSPA?
# gpc_implies_optout = true       # should Sec-GPC: 1 trigger opt-out?
#
# [consent.conflict_resolution]
# mode = "restrictive"            # "restrictive" | "newest" | "permissive"
# freshness_threshold_days = 30

# Which permission signal providers run, and in what order.
#
# Signals compose rather than select. A request can carry a TCF string and a
# Global Privacy Control header at once, and both have something to say, so
# provider here is a list, whereas in [ec], [geo] and [device] it names one
# provider. The order is the policy, because the last provider with an opinion
# decides.
#
# Listed below is every provider the shipped adapters link, which is also
# exactly what runs when provider is left out. Each is a crate under
# crates/permission-signal, outside the core. Providers are named in
# snake_case, lowercase words joined by underscores. Remove the ones this
# publisher does not want to act on. A provider that is not on the list does
# not run, and there is no separate switch to turn one off. An unknown or
# repeated name is refused at startup rather than quietly ignored. None of the
# four has settings, so none needs a [permission_signal.<name>] table.
#
# [permission_signal]
# provider = [
#   "gpc",               # the Sec-GPC request header, Global Privacy Control
#   "gpp_sale_opt_out",  # a GPP US sale opt-out
#   "us_privacy",        # a US Privacy string sale opt-out
#   "tcf",               # TCF v2, with its purpose mapping in the crate
# ]
#
# The three opt-outs are separate entries so that a publisher who does not act
# on Global Privacy Control can remove "gpc" and keep the GPP and US Privacy
# opt-outs working.
#
# A consent record that arrives and cannot be read revokes, whichever providers
# are configured. That is error handling rather than a provider to choose, so
# it is not in this list and cannot be removed.
#
# The default order asks Global Privacy Control first, being a browser setting
# with no interface of its own, and the three that carry a choice someone made
# through an interface after, so an answer given at a prompt amends the header
# the visitor arrived with. Reorder the list to change that.
#
# The layering, what a provider may consult, and how to add a scheme are
# documented in crates/trusted-server-core/src/permission_signal/README.md
# and in the Permission Signals guide.

# Page integration. [integration] provider lists the ones that run, and each
# one that has settings gets its own [integration.<name>] table. An
# integration that is not on the list does not run, and a settings table the
# list does not name refuses startup. The built-in names are datadome,
# didomi, google_tag_manager, gpt, gpt_diagnostics, js_asset_proxy, lockr,
# nextjs, osano, permutive, prebid, sourcepoint and testlight. Add the ones
# this deployment needs to the list below and uncomment their tables further
# down.
[integration]
provider = []

# First-party proxying of named third-party scripts. Add "js_asset_proxy" to
# the list above to switch it on.
# [integration.js_asset_proxy]
# Uncomment to override upstream cache headers for every asset below.
# This replaces upstream directives, including private and no-store.
# Use only when each asset's bytes are identical for every visitor.
# cache_ttl_seconds = 3600
# Asset fetches use a fixed TrustedServer/1.0 User-Agent. Do not proxy assets
# that vary by browser User-Agent or use integrity hashes for UA-specific bytes.
#
# [[integration.js_asset_proxy.assets]]
# path = "/assets/example-vendor-loader.js"
# origin_url = "https://cdn.example.com/vendor-loader.js"
# proxy = "enabled"

# Proxy behavior and first-party asset routing. Kept active with defaults.
[proxy]
# Verify TLS certs when proxying to HTTPS origins (default true; false only for
# local self-signed dev).
# certificate_check = true
# Allowlist for first-party proxy signing, initial fetch targets, and redirect
# targets. Supports exact ("example.com") and wildcard ("*.example.com", also
# matches apex).
# REQUIRED to include the Prebid external_bundle_url host when Prebid is enabled.
# allowed_domains = ["ads.example.com", "assets.example.com", "*.cdn.example.com"]
#
# Route first-party asset paths to a different backend origin. Longest matching
# prefix wins; only GET/HEAD participate; query string is preserved.
# [[proxy.asset_routes]]
# prefix = "/.image/"
# origin_url = "https://assets.example.com"
# Optional path rewrite before sending upstream (the prefix must match what the
# pattern expects, and here both use `/.image/`):
# path_pattern = "^/\\.image/(.*)/[^/]+\\.([^/.]+)$"
# target_path = "/image/upload/$1.$2"
#
# Optional S3 SigV4 auth for a private origin:
# [proxy.asset_routes.auth]
# type = "s3_sigv4"
# region = "us-east-1"
# origin_query = "strip"
# secret_store = "s3-auth"
# access_key_id = "access_key_id"
# secret_access_key = "secret_access_key"
#
# Optional Fastly Image Optimizer for the route (references a profile_set below):
# [proxy.asset_routes.image_optimizer]
# enabled = true
# region = "us_east"
# profile_set = "default_images"

# Reusable Fastly Image Optimizer profile sets referenced by asset routes.
# Supported IO params are a strict subset: quality, resize-filter, format,
# width, height, crop. Keep production profile tables in private config.
# [image_optimizer.profile_sets.default_images]
# base_params = "quality=70&resize-filter=bicubic"
# default_profile = "default"
# unknown_profile = "use_default"   # "use_default" or "reject"
# profile_param = "profile"
#
# [image_optimizer.profile_sets.default_images.profiles]
# default = "width=1920"
# thumbnail = "width=150&crop=1:1,smart"
# medium = "format=auto&width=828"

# Operator-controlled cache header policies for static/rehosted assets. Disabled
# rules never match, and matcher/policy validation is deferred until a rule is
# enabled; IDs must be non-empty and unique. Keep rules disabled unless the
# matched publisher paths are known to be content-addressed.
# [[cache.asset_rules]]
# id = "nextjs-static"
# enabled = false
# preset = "nextjs-static"                 # built-in matcher/policy preset
# visibility = "public"
# browser_ttl_seconds = 31536000
# edge_ttl_seconds = 31536000
# immutable = true
#
# [[cache.asset_rules]]
# id = "publisher-fingerprinted-assets"
# enabled = false
# path_globs = ["/assets/**/*.js", "/assets/**/*.css", "/assets/**/*.png", "/assets/**/*.webp"]
# Immutable custom rules require an unambiguous fingerprint_style, either "hex"
# or "esbuild-base32". "vite-base64-url" is allowed only for non-immutable rules
# because ordinary filenames can match its shape.
# fingerprint_style = "hex"
# visibility = "public"
# browser_ttl_seconds = 31536000
# edge_ttl_seconds = 31536000
# immutable = true

# Server-side auction. [auction] holds the settings that belong to the auction
# itself, [demand] selects the demand sources, [adserver] selects the ad server
# that picks the winner, and [auction.bidders.<code>] says which demand source a
# browser bidder code is routed to. Kept active with the creative-processing
# leaves present so the EdgeZero environment override can apply to them.
[auction]
# Keep disabled until provider endpoints, routes, and profile values below are
# replaced with deployment-specific settings.
enabled = false
# Rewrite winning-bid creative HTML to first-party endpoints (default true). Set
# false to skip proxy/click-URL conversion and creative TSJS injection.
# Sanitization is controlled separately by `sanitize_creatives` below. Restore
# true before rolling back to an older binary that rejects unknown fields.
rewrite_creatives = true
# Strip executable markup (script/object/embed/form/...) from winning-bid adm,
# removing those elements together with their inner content. Defaults to false
# (executable markup preserved). Note that with `rewrite_creatives = true` the
# adm is still not untouched: eligible URLs are rewritten, bidder `<base>`
# elements are removed, and the creative TSJS runtime is injected. Enable it
# whenever creatives can render in a context that shares the publisher origin
# (its primary defence there); leave it off when creatives render in a
# foreign-origin frame (e.g. the Prebid Universal Creative inside the ad
# server's iframe), since it removes script-based creatives entirely and would
# blank slots on a script-heavy demand stack.
sanitize_creatives = false
timeout_ms = 2000
# Context keys the JS client may forward into auction requests (allowlist;
# empty blocks all).
allowed_context_keys = []

# Example demand sources. Remove or customize before enabling auctions. The
# table name is this source's identity, and it is the implementation unless the
# table carries an `implementation` line, which is how two Prebid Servers run
# side by side under names of their own. The built-in implementations are
# openrtb, prebid_server and aps. Every endpoint must be HTTPS, or HTTP to
# 127.0.0.1, ::1 or localhost.
[demand]
provider = ["pbs_main"]

[demand.pbs_main]
implementation = "prebid_server"
endpoint = "https://prebid.example.com/openrtb2/auction"
# `prebid_server` defaults to 1000 ms when omitted.
routing = "explicit"
debug = false
test_mode = false
consent_forwarding = "both"

[demand.pbs_main.notifications]
suppress_all = false
suppress_seats = []

[auction.bidders.example-bidder]
provider = "pbs_main"

# APS is a demand implementation too, not a page integration, so everything it
# owns lives in its own table. Use routing = "all_eligible" when every
# banner-compatible slot should be eligible. The APS timeout defaults to
# 800 ms, and debug, script creatives and publisher-native rendering all
# default to off. Add "aps_main" to the [demand] provider list above when
# uncommenting this.
# [demand.aps_main]
# implementation = "aps"
# endpoint = "https://aps.example.com/e/pb/bid"
# routing = "all_eligible"
# account_id = "example-aps-account-id"
# debug = false
# allow_script_creatives = false
# rendering_mode = "trusted_server"
# inventory_domain = "publisher.example"
# inventory_page_origin = "https://www.publisher.example"

# The ad server that picks the auction winner. With no [adserver] selection the
# highest bid wins. The only implementation this repository ships is
# adserver_mock, for development and testing.
# [adserver]
# provider = "adserver_mock"
#
# [adserver.adserver_mock]
# endpoint = "https://adserver.example.com/decide"
# timeout_ms = 1000
# Map auction context keys to decision-URL query params:
# [adserver.adserver_mock.context_query_params]
# example_segments = "segments"

# Server-side ad slot templates + creative-opportunity auction. Kept active.
[creative_opportunities]
# Set false to disable server-side ad templates while keeping slot definitions
# and direct POST /auction callers. Structurally inactive templates fall back to
# the browser-only `Cache-Control: private, max-age=60` policy (this is one
# cause of it). Origin private/no-store policies, and bot/prefetch/consent-denied
# requests, retain their origin policy; CDN-specific cache headers are unchanged.
# Restore true, re-push, and finalize before rolling back to a binary that
# predates this setting.
enabled = true
gam_network_id = "123456789"
price_granularity = "dense"
# FCP is not affected by this value, because body content above </body> has already
# streamed and painted before the hold begins. What this caps is the slip on
# DOMContentLoaded and window.load. 500 ms is the recommended default; raise
# only if your SSPs need more headroom and analytics confirm the DCL slip is OK.
auction_timeout_ms = 500
#
# Initial-page delivery mode (spike/experimental). `inline` is the default and
# current production behaviour; `esi` is an opt-in Fastly Core Cache experiment
# storing an inert comment in a shared, reader-neutral template cache. See
# docs/guide/configuration.md before enabling. This and the cache-safety
# keys below belong in this [creative_opportunities] table.
# assembly_mode = "inline"
# Request headers (besides Accept-Encoding) the origin may name in Vary. Every
# emitted Vary name must be covered here or template storage is refused. Never
# include Cookie, because shared templates must be reader-neutral.
# template_cache_vary = [
#   "rsc",
#   "next-router-state-tree",
#   "next-router-prefetch",
#   "next-router-segment-prefetch",
# ]
# Safety ceiling (seconds) for one shared template; TS uses the smaller of this
# and the origin-authorized remaining edge freshness. Default 60; range 1-86400.
# template_cache_max_age_seconds = 1200
# Optional exact, case-sensitive cookie names; omitted and empty lists are equal.
# Key bounded variants only, never account, session, or TS identity IDs.
# Absent and empty values select different variants. No cardinality limit exists.
# template_cache_key_cookies = ["ab_bucket"]
# Presence, including session=, bypasses template lookup and storage.
# template_cache_bypass_cookies = ["session"]
# With either list nonempty, false bypasses unlisted cookies; true asserts those
# cookies do not change origin HTML. No identity or consent cookie is exempt.
# With both lists empty, false bypasses all Cookie headers, as before.
# An origin `Vary: Cookie` is always refused, regardless of these settings.
# origin_is_cookie_independent = false
# Invalid names, duplicates, cross-list overlap, and TS identity cookies in the
# key list reject configuration. Named policies bypass ambiguous/nonconforming
# Cookie fields, including duplicate key cookies.
# If a downstream CDN maps ab_bucket to X-Exp-Variant, also add x-exp-variant to
# template_cache_vary; that header alone cannot separate arms at TS.
# Rollback: older binaries reject both new fields even as empty lists. Remove
# both fields AND restore independence=false or disable ESI when HTML uses cookies.
#
# `gam_unit_path` may be a template. Supported placeholders:
#   {network_id} -> gam_network_id
#   {slot_id}    -> the slot's id
#   {section}    -> a path segment of the request, sanitized to [A-Za-z0-9_-];
#                   `section_segment` picks which one, `section_root` covers
#                   paths that have no such segment.
# A template with no placeholders (or an absent gam_unit_path) keeps the old
# behavior: verbatim path, or the default `/<network_id>/<slot_id>`.
#
# `section_root` is REQUIRED when any slot's template uses {section}. There is no
# default - the home-section name is publisher-specific. Must be [A-Za-z0-9_-]+.
#
# `section_segment` is the 0-based index of the segment that names the section;
# it defaults to 0 (the first segment). Set it to 1 for locale-prefixed URLs, so
# "/en/news/article" resolves to "news" instead of "en".
#
# Both are left commented out: no slot below uses {section}, and an unused key
# still ships in the pushed config blob.
# section_root = "home"
# section_segment = 0
#
# Slot templates. Add one block per slot below. (This is an array of tables, so
# the env overlay cannot set it - edit the `[[creative_opportunities.slot]]`
# blocks in TOML directly.)
# [[creative_opportunities.slot]]
# id = "leaderboard"
# gam_unit_path = "/123456789/leaderboard"
# div_id = "div-gpt-ad-leaderboard"
# page_patterns = ["/"]              # glob syntax (not regex); "/" matches only the homepage
# formats = [{ width = 728, height = 90 }]
#
# Example templated slot (one rule serves every section). Uncomment
# `section_root` above when enabling it. Note that "/news/*" does not match
# "/news" - list the section landing page separately.
# [[creative_opportunities.slot]]
# id = "ad-header"
# gam_unit_path = "/{network_id}/example/{section}"
# page_patterns = ["/", "/news", "/news/*", "/reviews", "/reviews/*"]
# formats = [{ width = 728, height = 90 }]
#   "/"          -> /123456789/example/home
#   "/news"      -> /123456789/example/news
#   "/news/x"    -> /123456789/example/news
#   "/reviews/y" -> /123456789/example/reviews

# Direct Tinybird auction telemetry (off by default). When enabled, `api_host`
# is required and must be a bare host (no scheme or path).
# [tinybird]
# enabled = true
# api_host = "api.us-east.tinybird.example"   # required when enabled; host only
# auction_dataset = "auction_events"          # Events API datasource name
# auction_token_secret = "tinybird_auction_append_token"  # Key in trusted_server_secrets

# Debug endpoints (all default false, and never enable one in production).
# [debug]
# Exposes GET /_ts/debug/ja4 returning TLS/JA4 fingerprint details. Disable
# after investigation; it reflects data browser JS cannot normally read.
# ja4_endpoint_enabled = false
# Injects a `<!-- ts-debug: ... -->` auction dump before `</body>`. NEVER enable
# in production: even the default "redacted" mode still includes bid-level fields
# and creative previews, so it is not a fully anonymized dump.
# auction_html_comment = false
#
# Fine-grained control over the dump (all optional; defaults shown).
# [debug.auction_html_comment_options]
# include_provider_responses = true
# include_adserver_response = true
# include_bids = true
# Subset of the fixed validated metadata keys shown in "redacted" (and, for these
# three keys, "upstream") mode. Any other key fails config load.
# metadata_keys = ["error_type", "http_status", "message"]
# "redacted" (default), "upstream", or "full". "upstream" exposes six untyped
# provider diagnostic values that may contain request or identity data; "full"
# additionally exposes all response metadata and untruncated creatives. Never use
# either sensitive mode in production.
# verbosity = "redacted"
# "compact" (default) or "pretty"; pretty formats only the outer dump, JSON
# request/response bodies remain strings exactly as captured.
# format = "compact"


# =============================================================================
# OPTIONAL - Integration settings
# =============================================================================
# Every integration is off by default, because [integration] provider above is
# empty. To switch one on, add its name to that list and uncomment its settings
# table below. An integration with nothing to set needs no table at all. A
# table the list does not name refuses startup, so a block left behind after an
# integration is switched off is caught rather than sitting unread. Required
# fields are noted per table.
# =============================================================================
# [integration.prebid]
# timeout_ms = 1000
# debug = false
# client_side_bidders = []          # bidders running via native Prebid.js adapters
# Keep selected GAM inventory out of Trusted Server's Prebid refresh auctions.
# Matching slots still refresh through GAM.
# excluded_gam_ad_unit_path_suffixes = ["/trackingonly"]
# Runtime bundle metadata, set after running `ts prebid bundle` and uploading:
# external_bundle_url = "https://assets.example.com/prebid/trusted-prebid-<sha256>.js"
# external_bundle_sha256 = "<manifest sha256>"
# external_bundle_sri = "<manifest sri>"
# Bundle build inputs consumed by `ts prebid bundle`, not by the edge runtime.
# Values are exact upstream module stems without `.js`.
# [integration.prebid.bundle.modules]
# bidder = ["rubiconBidAdapter"]
# Omit user_id for the curated default preset; use [] to select none.
# user_id = ["sharedIdSystem"]
# Omitted or empty analytics selects no analytics adapters.
# analytics = ["atsAnalyticsAdapter"]

# Prebid User ID modules that Trusted Server installs and keeps installed, so
# operators can manage identity centrally without publisher JavaScript changes.
# Each entry is forwarded to Prebid.js verbatim: `name` is a
# `userSync.userIds` entry name, `params` and `storage` are whatever that module
# documents. Trusted Server does not interpret them; supported names come from
# the checked-in User ID registry. Each `name` must appear only once.
#
# The module must be present in the built bundle: name it under
# [integration.prebid.bundle.modules].user_id, or omit that list to take the
# generator's default preset. `ts prebid bundle` resolves every managed name
# through the checked-in User ID registry and fails if the generated manifest
# omits its required module without updating the configured hash or SRI.
#
# Persisting a resolved ID into the EC identity graph additionally needs a
# matching partner under [[ec.partners]] whose source_domain equals the module's
# OpenRTB EID source; without one the ID still reaches the auction but is never
# written to KV.
#
# [[integration.prebid.managed_user_ids]]
# name = "sharedId"
#
# [integration.prebid.managed_user_ids.storage]
# type = "cookie"            # or "html5"
# name = "_sharedid"
# expires = 15               # days; omit to keep Prebid's default
# refresh_in_seconds = 1800  # omit to keep Prebid's default

# Next.js first-party rewriting for App Router / RSC payloads.
# [integration.nextjs]
# rewrite_attributes = ["href", "link", "siteBaseUrl", "siteProductionDomain", "url"]
# max_combined_payload_bytes = 10485760   # 10 MiB

# Testlight OpenRTB test integration. `endpoint` is required.
# [integration.testlight]
# endpoint = "https://testlight.example.com/openrtb2/auction"
# timeout_ms = 1200
# rewrite_scripts = true

# Didomi CMP SDK/API first-party proxy. `ts audit` adds "didomi" to the
# [integration] provider list and uncomments this table when it detects Didomi
# on the audited page.
# [integration.didomi]
# geo_query_parameters = false
# sdk_origin = "https://sdk.example.com"
# api_origin = "https://api.example.com"

# Sourcepoint CMP first-party proxy.
# `cdn_origin` is intentionally omitted: the upstream CDN origin is pinned to
# Sourcepoint's own host and is not operator-selectable. Leave it unset so the
# validated default applies, because overriding it with any other host fails
# config validation.
# [integration.sourcepoint]
# rewrite_sdk = true
# cache_ttl_seconds = 3600
# auth_cookie_name = "sp_auth"      # optional: forward a custom authCookie upstream

# Osano consent management. It has nothing to set, so naming "osano" in the
# [integration] provider list above is the whole configuration and it needs no
# table of its own.

# Permutive DMP. `organization_id` and `workspace_id` are required.
# [integration.permutive]
# organization_id = "your-permutive-organization-id"   # required (non-empty)
# workspace_id = "your-permutive-workspace-id"          # required (non-empty)
# project_id = "your-permutive-project-id"
# api_endpoint = "https://api.example.com"
# secure_signals_endpoint = "https://secure-signals.example.com"

# lockr identity SDK. `app_id` is required.
# [integration.lockr]
# app_id = "your-lockr-app-id"                          # required (non-empty)
# api_endpoint = "https://identity.example.com"
# sdk_url = "https://identity.example.com/trusted-server.js"
# cache_ttl_seconds = 3600
# rewrite_sdk = true

# DataDome bot protection. Proxies tags.js + signal-collection API first-party.
# `ts audit` adds "datadome" to the [integration] provider list and uncomments
# this table when it detects DataDome.
# [integration.datadome]
# sdk_origin = "https://sdk.example.com"
# api_origin = "https://api.example.com"
# cache_ttl_seconds = 3600
# rewrite_sdk = true
# Server-side Protection API validation (fails open on timeout/error):
# enable_protection = false
# Required when enable_protection = true. The value is a key in
# trusted_server_secrets, not the DataDome credential itself.
# server_side_key_secret_name = "datadome_server_side_key"
# protection_api_origin = "https://api.example.com"
# timeout_ms = 1500
# protection_excluded_methods = ["OPTIONS"]
# Client-side tag auto-injection (emits only when client_side_key is non-empty):
# client_side_key = ""
# inject_client_side_tag = true
# client_side_tag_url = "/integrations/datadome/tags.js"
# Temporary static-header bypass for an access-controlled STAGING environment
# only. A matching `x-ts-datadome-bypass` header skips server-side Protection
# API validation and is stripped before the origin sees it. The credential is
# loaded from the Secret Store at runtime (>= 32 bytes of high-entropy material).
# Never enable in production.
# [integration.datadome.protection_test_bypass]
# enabled = true
# credential_secret_store = "ts_secrets"
# credential_secret_name = "datadome_protection_test_bypass"

# Google Publisher Tag (GPT) first-party proxy. `ts audit` adds "gpt" to the
# [integration] provider list and uncomments this table when it detects GPT.
# GAM attribution stays off until `gam_attribution_enabled` is set true. The
# environment overlay cannot create a missing leaf, so uncomment the line
# before relying on TRUSTED_SERVER__INTEGRATION__GPT__GAM_ATTRIBUTION_ENABLED.
# [integration.gpt]
# gam_attribution_enabled = false
# script_url = "https://ads.example.com/gpt.js"
# cache_ttl_seconds = 3600
# rewrite_script = true

# GPT runtime diagnostics browser overlay. Selected manually rather than by
# `ts audit`, it serves a diagnostics module gated behind an activation query
# param and a session cookie. It has nothing to set, so naming
# "gpt_diagnostics" in the [integration] provider list above is the whole
# configuration.

# Google Tag Manager first-party proxy. `ts audit` adds "google_tag_manager" to
# the [integration] provider list, uncomments this table and fills container_id
# when it detects GTM. `container_id` is required.
# [integration.google_tag_manager]
# Invalid placeholder on purpose, because selecting GTM without a real
# GTM-XXXXXX id fails validation.
# container_id = "GTM-REPLACE-ME"
# Must be a credential-free https bare origin with a literal host: no path,
# query, fragment, `user:pass@` or wildcard. Targets are built by appending a
# rooted path to this value, so anything beyond an origin corrupts them.
# upstream_url = "https://tags.example.com"
# Tag ids the `gtag/js` path may serve from your own origin, in addition to
# `container_id`. A request naming any other tag id is redirected to the
# upstream instead, so this origin never serves a container you did not
# choose. The visitor loads that tag from the upstream directly, which a
# `script-src` that does not list the upstream origin will block.
#
# Set this if your pages load gtag with a measurement id separate from the
# container above (a GA4 `G-`, Ads `AW-` or Merchant Center `MC-` id). A tag
# that is missing here also loses the ad-blocker resilience this integration
# provides. Find the ids by grepping your rendered HTML for `gtag/js?id=`.
# allowed_tag_ids = ["G-EXAMPLE1", "AW-000000", "MC-EXAMPLE1"]

