# This file describes a Fastly Compute package. To learn more visit:
# https://www.fastly.com/documentation/reference/compute/fastly-toml

authors = []
cloned_from = "https://github.com/fastly/compute-starter-kit-rust-default"
description = "EdgePubs - Trusted Server"
language = "rust"
manifest_version = 3
name = "trusted-server-adapter-fastly"
# Temporary service-ID exception: owner `aram356`; expires
# 2026-09-30T00:00:00Z. See the documentation-refresh decision record.
service_id = "dysUw6h73VzeomD61eal85"

[scripts]
build = """
    cargo build --bin trusted-server-adapter-fastly --release --target wasm32-wasip1 --color always
"""

# Direct integrations will be initialized as dynamic backends and don't need to be declared here.
[backends]

[local_server]
    address = "127.0.0.1:7676"

    [local_server.backends]

    [local_server.kv_stores]
        # Local test fixture for the counter KV store.
        [[local_server.kv_stores.counter_store]]
            key = "placeholder"
            data = "placeholder"

        # Local test fixture for the creative KV store.
        [[local_server.kv_stores.creative_store]]
            key = "placeholder"
            data = "placeholder"

        # Local test fixture for the EC identity KV store.
        [[local_server.kv_stores.ec_identity_store]]
            key = "placeholder"
            data = "placeholder"

        # Local test fixture for a seeded EC identity entry.
        [[local_server.kv_stores.ec_identity_store]]
            key = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.test01"
            data = '{"v":1,"created":1700000000,"last_seen":1700000000,"consent":{"ok":true,"updated":1700000000},"geo":{"country":"US"}}'

        # Local test fixture for the consent KV store.
        [[local_server.kv_stores.consent_store]]
            key = "placeholder"
            data = "placeholder"
    [local_server.secret_stores]
        # Local test fixture for a signing key; never use in production.
        [[local_server.secret_stores.signing_keys]]
            key = "ts-2025-10-A"
            data = "NVnTYrw5xoyTJDOwoUWoPJO3A6UCCXOJJUzgGTxxx7k="

        [[local_server.secret_stores.api-keys]]
            key = "api_key"
            env = "FASTLY_KEY"

        [[local_server.secret_stores.ts_secrets]]
            key = "tinybird_auction_append_token"
            data = "test-tinybird-auction-append-token"

        # App-config references use logical `trusted_server_secrets`; the
        # edgezero_runtime_env mapping below resolves it to physical `ts_secrets`.
        [[local_server.secret_stores.ts_secrets]]
            key = "placeholder"
            data = "placeholder"

    [local_server.config_stores]
        [local_server.config_stores.edgezero_runtime_env]
            format = "inline-toml"
        [local_server.config_stores.edgezero_runtime_env.contents]
            EDGEZERO__STORES__SECRETS__TRUSTED_SERVER_SECRETS__NAME = "ts_secrets"

        [local_server.config_stores.trusted_server_config]
            format = "inline-toml"
        [local_server.config_stores.trusted_server_config.contents]

        [local_server.config_stores.jwks_store]
            format = "inline-toml"
        [local_server.config_stores.jwks_store.contents]
            # Local test fixtures for signing-key publication and rotation.
            ts-2025-10-A = "{\"kty\":\"OKP\",\"crv\":\"Ed25519\",\"kid\":\"ts-2025-10-A\",\"use\":\"sig\",\"x\":\"UVTi04QLrIuB7jXpVfHjUTVN5aIdcbPNr50umTtN8pw\"}"
            ts-2025-10-B = "{\"kty\":\"OKP\",\"crv\":\"Ed25519\",\"kid\":\"ts-2025-10-B\",\"use\":\"sig\",\"x\":\"HVTi04QLrIuB7jXpVfHjUTVN5aIdcbPNr50umTtN8pw\"}"
            current-kid = "ts-2025-10-A"
            active-kids = "ts-2025-10-A,ts-2025-10-B"
